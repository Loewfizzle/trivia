<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gems preview</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/vault.css">
<style>
  /* FRIENDS B — THE TIER GEM = ONE SHAPE: every tier's gem at its real size + 4× (the before / after sheet; ?still=1 = reduced motion) */
  body { background: #07060d; color: #e9e6f5; margin: 0; padding: 18px 16px; font: 600 12px/1.3 var(--font-ui); }
  h1 { font: 800 12px/1 var(--font-display); letter-spacing: 0.2em; margin: 0 0 14px; color: #fff; }
  .g-row { display: grid; grid-template-columns: 92px 40px 1fr; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .g-row b { font: 800 10px/1 var(--font-display); letter-spacing: 0.16em; }
  .g-big { transform: scale(4); transform-origin: 0 50%; height: 80px; display: flex; align-items: center; }
  .g-real { display: flex; align-items: center; justify-content: center; height: 30px; }
</style>
</head>
<body class="nd-on">
<h1 id="ttl">THE TIER GEMS</h1>
<div id="list"></div>
<script type="module">
  import { gemEl } from '/js/vault/gems.js';
  const q = new URLSearchParams(location.search);
  if (q.get('still')) document.body.classList.add('reduced-fx');
  if (q.get('label')) document.getElementById('ttl').textContent = q.get('label');
  const list = document.getElementById('list');
  for (const [t, dev] of [['common'], ['uncommon'], ['rare'], ['epic'], ['legendary'], [null, true]]) {
    const row = document.createElement('div'); row.className = 'g-row';
    const b = document.createElement('b'); b.textContent = dev ? 'DEV / 1 OF 1' : t.toUpperCase();
    const real = document.createElement('div'); real.className = 'g-real'; real.append(gemEl(t, { dev }));
    const big = document.createElement('div'); big.className = 'g-big'; big.append(gemEl(t, { dev }));
    row.append(b, real, big); list.append(row);
  }
</script>
</body>
</html>
