<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folk preview</title>
<!-- CITY 2.0 — 8P: THE PEOPLE's figures, no Firebase (js/screens/harbor/folk.js on a plain promenade). Rows: a walk cycle (8 frames
     of one stride) per look, the poses, a jog, a dog; ?light=day|night|gold &scale=1 (1 = the phone's size at the promenade's middle;
     2 = twice) &season=autumn|winter|summer &party=1 &rain=1. node shots.mjs "<browser>" - -page "tests/integration/folk-preview.html?light=night" -->
<style>
  html, body { background: #111; color: #ddd; margin: 0; font: 11px monospace; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { lookOf, drawFolk, drawDog, drawLeash, jointsOf } from '/js/screens/harbor/folk.js';
import { propItems } from '/js/screens/harbor/workers.js';
import { LADDER, STEPS } from '/js/core/harbor-crew.js';
const qs = new URLSearchParams(location.search);
const ONLY = (qs.get('only') || '').split(',').filter(Boolean), show = k => !ONLY.length || ONLY.includes(k);
const LIGHT = qs.get('light') || 'day', SCALE = Number(qs.get('scale') || 2), season = qs.get('season') || 'autumn', party = qs.get('party') === '1', rain = qs.get('rain') === '1' ? 1 : 0;
const T = LIGHT === 'night' ? { night: 1, sunDir: 0 } : LIGHT === 'gold' ? { gold: 1, sunDir: -0.6, sunEl: 8 } : { day: 1, sunDir: -0.5, sunEl: 34 };
const dark = LIGHT === 'night' ? 1 : 0;
const W = 402 * SCALE, H = 1060 + 12 * (34 * SCALE + 14) + 190 * SCALE, dpr = window.devicePixelRatio || 1, cv = document.getElementById('c');
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const c = cv.getContext('2d'); c.scale(dpr, dpr);
c.fillStyle = dark ? '#3a3650' : LIGHT === 'gold' ? '#b08870' : '#9a948c'; c.fillRect(0, 0, W, H);
// a fake camera: z 47 → the phone's promenade scale × SCALE
const z = 47, cam = { F: 600 * SCALE, VPX: 0, VPY: -600 * SCALE * 13.2 / 47, CAMH: 13.2, W: 402 * SCALE };
const at = (sx, sy) => ({ x: sx * z / cam.F, z, y0: sy });
const env = { t: 1.3, mo: true, T, dark, lightAt: dark ? () => [200, 150, 90] : null, rimSide: () => 1, shadow: dark ? null : () => ({ dx: 0.9, dz: 0.6, a: 0.25 }) };
const draw = (sx, sy, st, look, seed, role = 'lead') => {
  const L = lookOf(look, seed, { season, party, rain, role });
  c.save(); c.translate(0, sy); drawFolk(c, cam, { s: { x: sx * z / cam.F, z, a: 1, ...st }, L }, env); c.restore();
  return L;
};
// (8b2: the ladders are props — drawn from a state by workers.js, as on the title)
const ladder = (sy, st) => { const it = propItems({ cam, speakeasy: {} }, { props: [{ kind: 'xladder', t0: 0, t1: 1e9, at: () => ({ z, ...st }), len: LADDER.len, w: LADDER.w, wf: LADDER.wf, kit: null }] }, 'near', 1)[0]; c.save(); c.translate(0, sy); it.draw(c, env); c.restore(); };
const stepsAt = (sy, st) => { const it = propItems({ cam, speakeasy: {} }, { props: [{ kind: 'xsteps', t0: 0, t1: 1e9, at: () => st, ws: STEPS.ws }] }, 'near', 1)[0]; c.save(); c.translate(0, sy); it.draw(c, env); c.restore(); };
const label = (s, x, y) => { c.fillStyle = dark ? '#ccc' : '#222'; c.fillText(s, x, y); };
let y = Math.max(90, 34 * SCALE);
// walk cycles: 8 frames of one stride, per look (facing right, then one facing left)
const looks = [['commuter', 11], ['lady', 12], ['walker', 13], ['guest', 14], ['worker', 15], ['newsboy', 16], ['couple', 17], ['night', 18]];
for (const [lk, seed] of show('looks') ? looks : []) {
  label(lk, 4, y - 70);
  for (let i = 0; i < 8; i++) { const S = 0.44 * 2.1, dist = i / 8 * 2 * S; draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'walk', dir: i === 7 ? -1 : 1, dist, v: 1.4 }, lk, seed); }
  y += 34 * SCALE + 14;
}
// FP3b — THE FACING: one walker at 8 headings (right · 3/4 away-right · away · 3/4 away-left · left · 3/4 toward-left · toward · 3/4
// toward-right), mid-stride; then a TURN from right to left through the front (lerpHd), standing
if (show('headings')) {
label('headings: R · 3/4 away-R · AWAY · 3/4 away-L · L · 3/4 toward-L · TOWARD · 3/4 toward-R', 4, y - 70);
for (let i = 0; i < 8; i++) draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'walk', hd: i * Math.PI / 4, dist: 0.55, v: 1.3 }, 'commuter', 11);
y += 34 * SCALE + 14;
}
if (show('lady')) {
label('the same, a lady (her bob) + a newsboy (the cap’s peak)', 4, y - 70);
for (let i = 0; i < 8; i++) draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'walk', hd: i * Math.PI / 4, dist: 0.55, v: 1.2 }, i % 2 ? 'newsboy' : 'lady', 12 + (i % 2) * 4);
y += 34 * SCALE + 14;
}
if (show('turn')) {
label('a turn on the spot, right → left through the front (standing)', 4, y - 70);
for (let i = 0; i < 8; i++) draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'wait', hd: -i * Math.PI / 7, dist: 0, v: 0 }, 'walker', 13);
y += 34 * SCALE + 14;
}
if (show('toward')) {
label('walking TOWARD us · 8 frames of one stride', 4, y - 70);
for (let i = 0; i < 8; i++) { const S = 0.35 * 2.1, dist = i / 8 * 2 * S; draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'walk', hd: -Math.PI / 2 + 0.25, dist, v: 1.3 }, 'commuter', 11); }
y += 34 * SCALE + 14;
}
// the jog
if (show('jog')) {
label('jogger', 4, y - 70);
for (let i = 0; i < 8; i++) { const S = 0.62 * 2.1, dist = i / 8 * 2 * S; draw(40 * SCALE / 2 + i * 44 * SCALE / 2, y, { pose: 'walk', dir: 1, dist, v: 3 }, 'jogger', 21); }
y += 34 * SCALE + 14;
}
// the poses (front, back, side)
if (show('poses')) {
label('poses: wait · watch · chat · point · wave · shop · cart · sit · lean(back) · dance · toast · garden · walk away · walk toward', 4, y - 70);
const poses = [['wait', 0], ['watch', 1], ['chat', 1], ['point', 1], ['wave', 0], ['shop', 2], ['cart', 1], ['sit', 0], ['lean', 2], ['dance', 1], ['toast', -1], ['garden', 1], ['walk', 2], ['walk', 0]];
poses.forEach(([p, dir], i) => draw(20 * SCALE / 2 + i * 28 * SCALE / 2, y + (i > 6 ? 34 * SCALE + 10 : 0), { pose: p, dir, dist: 0.3, v: p === 'walk' ? 1.4 : 0 }, i % 2 ? 'lady' : 'guest', 30 + i));
y += 2 * (34 * SCALE + 10) + 14;
}
// a couple arm in arm + a dog walker
if (show('couple')) {
label('arm in arm · a dog walker', 4, y - 70);
for (let i = 0; i < 4; i++) { const dist = i * 0.5; draw(40 * SCALE / 2 + i * 90 * SCALE / 2 + 6, y - 6, { pose: 'walk', dir: 1, dist, v: 1, link: -1 }, 'couple', 40, 'partner'); draw(40 * SCALE / 2 + i * 90 * SCALE / 2, y, { pose: 'walk', dir: 1, dist, v: 1, link: 1 }, 'couple', 41, 'lead'); }
}
// 8b2 — THE WORKERS: each trade's clothes (3/4 toward us, with their gear) · a LIFT with the knees (pick: 8 frames) · a ladder climbed
// RUNG BY RUNG (8 frames of one rung) · the work STROKES over a cycle (paint · paste · squeegee · sweep, 8 frames each) · loads carried
const ROW = 34 * SCALE + 14, at8 = i => 40 * SCALE / 2 + i * 44 * SCALE / 2;
if (show('workers')) {
  const W8 = [['milkman', 'bottles'], ['sweeper', 'broom'], ['cop', null], ['mailman', null], ['barber', null], ['painter', 'brush'], ['washer', 'squeegee'],
    ['billposter', 'paste'], ['iceman', 'ice'], ['trashman', 'can'], ['repairman', 'steps'], ['bootlegger', 'crate'], ['lookout', null], ['staff', null]];
  label('the trades: milkman · white wing · beat cop · mailman · barber · painter · washer / billposter · iceman · collector · repairman · bootlegger · lookout · staff', 4, y - 70);
  W8.forEach(([lk, carry], i) => draw(at8(i % 7) + (i % 7) * 4 * SCALE, y + (i >= 7 ? ROW : 0), { pose: 'wait', hd: -Math.PI / 2 + 0.6, dist: 0, v: 0, ...(carry ? { carry } : {}) }, lk, 50 + i));
  y += 2 * ROW;
}
if (show('lift')) {
  label('LIFT with the knees: the collector picks up the can (pick, 1.6 s) · the bootlegger sets a crate down (set)', 4, y - 70);
  for (let i = 0; i < 8; i++) { const since = i / 7 * 1.6; draw(at8(i), y, { pose: 'pick', hd: -Math.PI / 2 + 0.7, since, left: 1.6 - since, carry: 'can' }, 'trashman', 61); }
  y += ROW;
  for (let i = 0; i < 8; i++) { const since = i / 7 * 1.6; draw(at8(i), y, { pose: 'set', hd: 0.4, since, left: 1.6 - since, carry: 'crate' }, 'bootlegger', 62); }
  y += ROW;
}
if (show('climb')) {
  label('RUNG BY RUNG: one rung up (8 frames) — the stepping foot lifts, the opposite hand reaches', 4, y - 70);
  for (let i = 0; i < 8; i++) { const q = i / 7; draw(at8(i), y - q * 0.32 * cam.F / z, { pose: 'climb', hd: Math.PI, y: 1 + q * 0.32, rung: { n: 0, q, up: true } }, 'painter', 63); }
  y += ROW;
}
if (show('strokes')) {
  label('STROKES (a cycle, 8 frames): paint (on the ladder) · paste (smoothing) · squeegee · sweep', 4, y - 70);
  const rows = [['paint', 'painter', 'brush', 1.5, { y: 1.2 }], ['paste', 'billposter', 'brush', 1.9, {}], ['squeegee', 'washer', 'squeegee', 1.6, {}], ['sweep', 'sweeper', 'broom', 1.25, {}]];
  for (const [pz, lk, carry, P, ex] of rows) { for (let i = 0; i < 8; i++) { env.t = 10 + i / 8 * P; draw(at8(i), y, { pose: pz, hd: pz === 'sweep' ? 0.3 : Math.PI / 2 + 0.5, carry, ...ex }, lk, 64); } y += ROW; }
  env.t = 1.3;
}
if (show('carry')) {
  label('LOADS: a crate on the shoulder · milk in the hand · the ice block · THE LADDER CARRIED BY TWO (walking right)', 4, y - 70);
  for (let i = 0; i < 4; i++) { const dist = i * 0.4; draw(at8(i), y, { pose: 'walk', hd: 0, dist, v: 1.1, carry: i < 2 ? 'crate' : 'bottles' }, i < 2 ? 'bootlegger' : 'milkman', 65 + i); }
  for (let i = 0; i < 2; i++) draw(at8(4 + i * 2), y, { pose: 'walk', hd: Math.PI, dist: i * 0.5, v: 1, carry: 'ice' }, 'iceman', 70);
  y += ROW;
  // (8b2: the tall ladder is a PROP — workers.js draws it from its state; on the carriers' FAR shoulders, they in front of it, in step)
  const gapPt = LADDER.gap * cam.F / z;
  for (let i = 0; i < 2; i++) { const x0 = 24 * SCALE + i * (gapPt + 70 * SCALE), xw = x0 * z / cam.F + i * 0.21; ladder(y, { x: xw - LADDER.hA, y: LADDER.ys, th: 0, e: 0 }); draw(x0, y, { pose: 'walk', hd: 0, dist: 0, v: 1.1, carry: 'ladderA' }, 'painter', 71); draw(x0 + gapPt, y, { pose: 'walk', hd: 0, dist: 0, v: 1.1, carry: 'ladderB' }, 'painter', 72); }
  y += ROW;
}
// 8b2 — THE TALL LADDER RAISED (core/harbor-crew.js#tallLadder), frame by frame: set down on edge · its end hoisted · walked up hand over
// hand · pushed upright · the fly hauled up its rope · tipped onto the blade (the holder foots it from behind) · then the STEPLADDER:
// on the shoulder · swung down · stood folded · spread
if (show('raise')) {
  label('THE TALL LADDER: set down · hoisted · walked up · pushed up · the fly hauled · on the blade (the holder footing it)', 4, y - 70);
  const yb = y + 118 * SCALE, X = LADDER, E = 4.76, thL = 1.677, wx = sx => sx * z / cam.F, up = 0.17;
  const fr = [[6, 'set', 0, 0, 0], [92, 'raise', 0.38, 0, 0], [172, 'walk', 0.6, 0, 0], [250, 'walk', 1.05, 0, 0], [300, 'push', Math.PI / 2, 0, 0], [340, 'haul', Math.PI / 2, E / 2, 0], [376, 'hold', thL, E, 0]];
  for (const [sx0, pz, th, e] of fr) {
    const px = wx(sx0 * SCALE), hx = th > 1.5 ? px + 0.45 : px + X.hR / Math.tan(th || 0.01) + up, manPt = (pz === 'set' ? px + X.len - X.hB : th === 0 ? px + 5.45 : hx) * cam.F / z;
    draw((px - 0.25) * cam.F / z, yb, { pose: 'hold', hd: -Math.PI / 2, dist: 0, v: 0 }, 'painter', 81);
    ladder(yb, { x: px + 0.2, y: pz === 'set' ? 0.5 : 0, th, e });
    draw(manPt, yb, pz === 'walk' ? { pose: 'walk', hd: Math.PI, dist: sx0 / 40, v: 0.8, carry: 'walkup' } : { pose: pz, hd: Math.PI, dist: 0, v: 0, since: pz === 'raise' ? 2.4 : 1, left: pz === 'raise' ? 0.8 : 1, carry: pz === 'set' ? 'ladderB' : null }, 'painter', 82);
  }
  y = yb + 64 * SCALE;
  label('THE STEPLADDER: on the shoulder · swung down · stood folded · spread · climbed', 4, y - 70);
  const Ls = Math.hypot(STEPS.d, 1.85), st5 = [[30, 'carry'], [110, 'upend', 0.35], [190, 'upend', 1], [270, 'spread', 1], [350, 'climb', 1]];
  for (const [sx0, k, u] of st5) {
    const gx = wx(sx0 * SCALE), d = k === 'spread' || k === 'climb' ? STEPS.d : 0, h = Math.sqrt(Ls * Ls - d * d);
    let S;
    if (k === 'carry') S = { fb: { x: gx - Ls / 2, y: STEPS.ys + STEPS.ws / 2, z: z - 0.2 }, tp: { x: gx + Ls / 2, y: STEPS.ys + STEPS.ws / 2, z: z - 0.2 }, n: [0, 1, 0] };
    else if (k === 'upend' && u < 1) { const phi = 0.9 * u / 0.5 > 0.9 ? 0.9 : 0.9 * u / 0.5, B = { x: gx - 0.62 - Ls / 2 * (1 - u), y: (STEPS.ys) * (1 - u / 0.5) }; S = { fb: { ...B, z }, tp: { x: B.x + Ls * Math.cos(phi), y: B.y + Ls * Math.sin(phi), z }, n: [-Math.sin(phi), Math.cos(phi), 0] }; }
    else S = { fb: { x: gx - 0.62 - d, y: 0, z }, tp: { x: gx - 0.62, y: h, z }, n: [-h / Ls, d / Ls, 0] };
    S.bb = k === 'spread' || k === 'climb' ? { x: gx - 0.62 + d, y: 0, z } : S.fb; S.z = z;
    stepsAt(y, S);
    draw(k === 'climb' ? (gx - 0.62) * cam.F / z : sx0 * SCALE, y, k === 'carry' ? { pose: 'walk', hd: Math.PI, dist: 0.3, v: 1.1, carry: 'steps' } : k === 'climb' ? { pose: 'climb', hd: Math.PI, y: 1.0, rung: { n: 1, q: 0.4 } } : { pose: k, hd: Math.PI, since: u * 1.9, left: (1 - u) * 1.9 + 0.01, carry: k === 'upend' ? 'steps' : null }, 'repairman', 83);
  }
  y += ROW;
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
