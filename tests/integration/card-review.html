<!doctype html>
<html lang="en" class="vl-lab-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card review</title>
<!-- THE VAULT 1C — THE LOOK REVIEWS: each card's SLIM STRIP + its FULL CARD at real phone size, moving, ONE shared surface, nothing else on
     the page (the lab's readout + its chrome out of the way). ?cards=card-sg-tr3b,card-sg-ufo  &strips=0 (full cards only)  &full=0 (strips
     only)  &still=1  &t=<s> (a fixed time: the frame at t seconds — the burst's matching frames)  &mix=lobby (8 strips in the calmer cut) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/progress.css">
<link rel="stylesheet" href="/css/vault.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>body { margin: 0; background: #0b0a10; } .cr { display: flex; flex-direction: column; gap: 14px; padding: 12px 16px 30px; max-width: 420px; margin: 0 auto; position: relative; }
.cr h3 { margin: 6px 0 -4px; font: 700 12px/1 var(--font-ui); letter-spacing: 0.18em; color: #c9b98a; }</style>
</head>
<body class="vl-lab-on">
<main class="cr fx-host" id="cr"></main>
<script type="module">
import { registerLabText, LAB, GUESTS } from '/js/vault/catalog.js';
import { LAB_TEXT } from '/api/_lib/lab-text.js';
import '/api/_lib/catalog.js';
registerLabText(LAB_TEXT);
import { h } from '/js/ui/dom.js';
import { createSurface, setFxReduced, setFxTier } from '/js/fx/renderer.js';
import { FX } from '/js/fx/index.js';
import { stripEl, LOOKS, fxOpts } from '/js/vault/strip.js';
import { fullCardEl, mountFull } from '/js/vault/full.js';
const q = new URLSearchParams(location.search);
if (q.get('still') === '1') setFxReduced(true);
if (q.get('tier') != null) setFxTier(Number(q.get('tier')));
if (q.get('t') != null) { const T = Number(q.get('t')) * 1000, t0 = performance.now(); const real = performance.now.bind(performance); performance.now = () => T + (real() - t0) * 0.0001; }
const cards = (q.get('cards') || 'card-sg-ufo').split(',').filter(Boolean);
const root = document.getElementById('cr');
const surface = createSurface(root, { label: 'review' });
const av = ['bolt', 'diamond', 'crown', 'alien', 'star', 'moon', 'ghost', 'hex'], col = ['cyan', 'magenta', 'yellow', 'green', 'violet', 'orange', 'magenta', 'cyan'];
cards.forEach((id, i) => {
  const g = GUESTS[i % GUESTS.length], name = (LAB.find(x => x.id === id) || {}).name || id;
  root.append(h('h3', name));
  if (q.get('strips') !== '0') {
    const el = stripEl({ card: id, name: g.name, lv: g.lv, host: i === 0, no: 3112 });
    root.append(el); const look = LOOKS[id];
    if (look && look.fx) surface.add(el, FX[look.fx], fxOpts(id, { seed: g.lv, radius: 12, calm: q.get('calm') === '1' ? 1 : 0 }));
  }
  if (q.get('full') !== '0') {
    const card = fullCardEl({ card: id, who: { name: g.name, lv: g.lv, avatar: av[i % 8], color: col[i % 8], at: Date.UTC(2026, 9, 3), no: 3112 }, spotted: Date.UTC(2026, 10, 3, 3, 14) });
    root.append(h('div.vl-col', card)); mountFull(surface, card, id, { seed: i + 3 });
  }
});
window.__cr = { ready: true };
document.fonts.ready.then(() => setTimeout(() => { document.body.dataset.ready = '1'; }, 900));
</script>
</body>
</html>
