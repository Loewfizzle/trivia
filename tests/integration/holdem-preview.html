<!doctype html>
<!-- HOLD'EM preview (no Firebase) — HE3: the REAL table view (js/games/holdem/view.js) mounted with a REAL table: the dealer's own pure core
     (api/_lib/holdem-dealer.js — the engine, a seeded deck) played to the asked-for moment, then sent through THE LEAN WIRE exactly as a
     phone reads it (publicOf → toWire → the room's node) + this phone's own hole node. So a shot is the phone's screen.
       &n=2..8            players at the table (default 6)
       &state=waiting | myturn | preflop | flop | turn | river | allin | showdown | foldwin | away | slider | final   (default myturn)
          HE4:  headsup (n=2, the board centred) · raised (a flop at n=3/4 — the board raised) · split (a showdown that splits the pot) ·
                sidepots (an all in → the run-out → 3 pots awarded one at a time, a short stack OUT) · levelup (BLINDS UP at the next deal) ·
                HE5: leaveafter (CASH, you in a hand: LEAVE AFTER THIS HAND) · leavequeued (LEAVING AFTER THIS HAND · CANCEL)
                ko (you bust → the KO card → SPECTATING) · spectate (after it — what a refresh shows) · out (an opponent busts: OUT, the fade,
                the re-spread at the next deal) · leave (CASH: LEAVE TABLE's confirm) · ledger (CASH's end) · final (the tournament's end)
                (sidepots / levelup / ko / out play their last step LIVE ~0.6 s after the page shows — the real motion, as a phone sees it)
       &play=1            THE MOTION DEMO: a scripted table that plays on a loop (below) — HE5: WITH THE SOUNDS after a TAP FOR SOUND (&mute=1 silent)
                          myturn = your turn before the flop (after a raise) · preflop = someone else's turn (your pre-actions)
                          flop / turn / river = your turn on that street, facing a bet · allin = a multi-way all in, run out street by street
                          showdown = the river shown down · foldwin = everyone folded to you (SHOW) · away = you're AWAY (I'M BACK), a seat OUT
                          slider = myturn with the RAISE slider open · final = the podium (the console's frame + HOLD'EM's body)
       &mode=cash         a CASH table (BLINDS 5/10; away = SAT OUT; &broke=1 = your stack 0 → REBUY)
       &deck=two          the CLASSIC two-colour faces           &hand=AsKd   your two cards (the deck is rigged to deal them)
       &skin=cabin        the table's skin (HE6): casino (the default) · cabin · apartment   &settings=1  ☰ → Settings open (THE TABLE picker)
       &rankings=1        THE RANKINGS SHEET open (HE7)
       &seed=x            another deal                            &host=0      you're not the host (no END SESSION in CASH)
       &st=47&sb=34       the safe areas (pt) — an iPhone 13/14 = 47 / 34 (the default), a 15/16 Pro = 62 / 34
       &sl=47&sr=47       HE7 — a window WIDER THAN TALL is the SIDEWAYS table (rotate the phone): its safe areas left / right (the notch) +
                          below default to 47 / 47 / 21 (top 0); under 700 wide = an SE (none); wider than 1000 = a desktop (none — the
                          stage scales the table). A real phone with a notch keeps its own (env()) — turn it and the table turns
     HE4 ADD-ON (Ben) — REAL SLIM CARDS: every fake player has a REAL public face, as a room player's profile (profiles/{pid} through
     fake-firebase.js → profile/public.js#watchRoomProfiles → pubOf): a different APPROVED card each (two legendaries, the textured ZEBRA ·
     GLITTER BOMB · VELVET ROOM · MARBLE), their own emblem (shape + finish, a tube style) + name glow + a level — the page approves exactly that
     set through &labmarks= (js/vault/approved.js — a local server / the LAN only; added to the address when missing). Preview-only data.
     tests/integration/holdem-shots.mjs shoots it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold'em preview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/kit.css">
<link rel="stylesheet" href="../../css/board.css">
<link rel="stylesheet" href="../../css/holdem.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { background: #000; height: 100%; margin: 0; overflow: hidden; }</style>
</head>
<body data-theme="holdem" data-look="night">
<div class="screen screen-in" id="app"></div>
<script type="module">
import { newRecord, applyOp, advance, publicOf, holeOf } from '/__dev/api-lib/holdem-dealer.js';
import { legalActions, running } from '/js/games/holdem/table.js';
import { toWire, nestWire } from '/js/games/holdem/wire.js';
import { finalRowsOf, ranksOf, finalSummaryOf } from '/js/games/holdem/logic.js';
import { rngFrom } from '/js/core/rng.js';
import { setState } from '/js/store.js';
import { updateSettings } from '/js/audio/settings.js';

const q = new URLSearchParams(location.search);
// (HE4 ADD-ON — the players' REAL faces: one approved card each — the lab's marks for this page only)
const FACES = [
  { cd: 'card-sg-aurora', es: 'emb-house', g: 'glow-gold', l: 42 },                         // ALEX — SKY DANCER (legendary)
  { cd: 'card-zebra', es: 'emb-key', tb: 'tube-chase', g: 'glow-neon', l: 18 },              // MAXIMILIANOS — ZEBRA (the 12-letter name)
  { cd: 'card-glitter', es: 'emb-prism', g: 'glow-prism', l: 27 },                          // BO — GLITTER BOMB (epic)
  { cd: 'card-velvet', es: 'emb-sweetheart', tb: 'tube-breath', g: 'glow-candle', l: 12 },   // GRACE — VELVET ROOM (rare)
  { cd: 'card-wildfire', es: 'emb-torch', g: 'glow-fire', l: 55 },                          // CHARLOTTE — WILDFIRE (legendary)
  { cd: 'card-marquee', es: 'emb-cocktail', tb: 'tube-twotone', g: 'glow-champagne', l: 9 }, // ED — THE MARQUEE (epic)
  { cd: 'card-marble', es: 'emb-diamond', g: 'glow-ice', l: 21 },                           // PENELOPE — MARBLE & GOLD (rare)
  { cd: 'card-chrome', es: 'emb-owl', g: 'glow-frost', l: 6 },                              // JUN — SILVER CHROME (uncommon)
];
if (!q.get('labmarks')) {
  const ids = [...new Set(FACES.flatMap(f => [f.cd, `full-${f.cd}`, f.es, f.g, f.tb].filter(Boolean)))];
  q.set('labmarks', ids.join(','));
  history.replaceState(null, '', `?${q}`);
}
const ASK = q.get('state') || 'myturn';
const N = ASK === 'headsup' ? 2 : Math.max(2, Math.min(8, Number(q.get('n') || (ASK === 'raised' ? 4 : 6))));
const STATE = q.get('play') === '1' ? 'play' : ({ ledger: 'final', headsup: 'myturn', raised: 'flop', leaveafter: 'preflop', leavequeued: 'preflop' })[ASK] || ASK;
const MODE = q.get('mode') === 'cash' || ['ledger', 'leave', 'leaveafter', 'leavequeued'].includes(ASK) ? 'cash' : 'tournament';
const STAGED = ['sidepots', 'levelup', 'ko', 'out'].includes(STATE);
// (HE7: a phone ON ITS SIDE — wider than tall — has its safe areas left + right (the notch side + its twin) + the home bar below:
//  47 / 47 / 21 by default; &sl=&sr= set them; a desktop-sized window (wider than 1000) none)
// (a REAL phone with a notch — Ben's iPhone on the LAN — keeps its own safe areas (env(): right in both orientations, as you turn it);
//  a computer / the test browser has none → the simulated iPhone's, re-applied on every resize — so turning a window turns the table)
const realSafe = (() => { const p = document.createElement('i'); p.style.cssText = 'position:fixed;top:0;left:0;width:env(safe-area-inset-left,0px);height:env(safe-area-inset-top,0px);visibility:hidden';
  document.documentElement.append(p); const r = p.offsetWidth + p.offsetHeight; p.remove(); return r > 0; })();
const probeCss = document.createElement('style');
document.head.append(probeCss);
function applySafe() {
  const given = ['st', 'sb', 'sl', 'sr'].some(k => q.has(k));
  if (realSafe && !given) return;
  // (on its side: an iPhone 13/14's notch + home bar — an SE-sized window (< 700 wide) has neither; a desktop-sized one none)
  const wide = innerWidth > innerHeight, flat = wide && (innerWidth > 1000 || innerWidth < 700);
  const st = Number(q.get('st') ?? (wide ? 0 : 47)), sb = Number(q.get('sb') ?? (flat ? 0 : wide ? 21 : 34));
  const sl = Number(q.get('sl') ?? (wide && !flat ? 47 : 0)), sr = Number(q.get('sr') ?? (wide && !flat ? 47 : 0));
  for (const [k, v] of [['t', st], ['b', sb], ['l', sl], ['r', sr]]) document.documentElement.style.setProperty(`--safe-${k}`, `${v}px`);
  probeCss.textContent = `.he-probe-t { height: ${st}px !important } .he-probe-b { height: ${sb}px !important } .he-probe-l { width: ${sl}px !important } .he-probe-r { width: ${sr}px !important }`;
}
applySafe();
addEventListener('resize', applySafe);
updateSettings({ heDeck: q.get('deck') === 'two' ? 'two' : 'four', heSkin: q.get('skin') || 'casino', musicOff: true, sfxOff: true });   // (HE6: &skin=casino|cabin|apartment)

// the players: mixed name lengths (a 12-letter one), the real emblem styles
const NAMES = ['ALEX', 'MAXIMILIANOS', 'BO', 'GRACE', 'CHARLOTTE', 'ED', 'PENELOPE', 'JUN'];
const AV = ['bolt', 'crown', 'eye', 'star', 'diamond', 'moon', 'alien', 'wave'];
const COL = ['cyan', 'magenta', 'yellow', 'green', 'orange', 'violet', 'red', 'blue'];
const uids = Array.from({ length: N }, (_, i) => `p${i}`);
const pidOf = i => `phepreview${'abcdefgh'[i]}${'abcdefgh'[i]}`;   // (profile/public.js's pid shape: p + 11 of [a-z2-9])
const players = Object.fromEntries(uids.map((u, i) => [u, { name: NAMES[i], avatar: AV[i], color: COL[i], joinedAt: i, pid: pidOf(i) }]));
// each player's public face (profiles/{pid} — the shape a room player's profile has: n · a · c · l · cd · es · g · tb · mn), served by the fake database
window.__fakeDb = Object.fromEntries(uids.map((u, i) => [`profiles/${pidOf(i)}`, { n: NAMES[i], a: AV[i], c: COL[i], mn: null, ...FACES[i] }]));
const presence = Object.fromEntries(uids.map(u => [u, { online: true, lastSeen: 0 }]));

// HE4 — THE MOTION DEMO (&play=1): a scripted table that PLAYS on the real clock, through the real dealer core + THE LEAN WIRE, on a loop —
// a hand to a showdown (bets every street), an all in with side pots (a run-out street by street, the pots awarded one at a time, the short
// stacks busted → OUT + the re-spread), a fold-win; the blinds go up every &lv seconds (default 40); down to two → HEADS UP; a winner →
// a new match. &ko=1 = you're one of the short stacks (the KO card → SPECTATING).
const PLAY = q.get('play') === '1';
// (HE8 — LONG NIGHTS: &speed=K runs THE MOTION DEMO K× faster — the dealer's clock AND this phone's (window.__clock) — so an endurance run plays
//  hundreds of hands in minutes; the motion keeps its real durations, so it overlaps + cancels the way a fast table does)
const SPEED = PLAY ? Math.max(1, Math.min(30, Number(q.get('speed') || 1))) : 1;
const PT0 = Date.now();
const vnow = () => (SPEED > 1 ? PT0 + (Date.now() - PT0) * SPEED : Date.now());
if (SPEED > 1) window.__clock = vnow;
const T0 = PLAY ? PT0 : STAGED || STATE === 'spectate' ? Date.now() - 180_000 : Date.UTC(2026, 10, 10, 23, 0, 0);
let now = T0;
const rng = rngFrom(q.get('seed') || 'he3-preview');
let rec = newRecord({ code: 'PVWX', uids, mode: MODE, now, rng });
if (PLAY) rec.m.levelMs = Math.max(10, Number(q.get('lv') || 40)) * 1000;
// (&hand=AsKd: the deck rigged so that seat gets them — set after the first deal below)
advance(rec, now, rng);
const T = () => rec.m.table;
const L = () => { const t = T(); return running(t) && !t.runout ? legalActions(t) : null; };
function play(action, amount) {
  const l = L(); if (!l) return false;
  now += 2600;
  applyOp(rec, 'act', l.id, { hand: T().hand, seq: rec.seq, action, ...(amount != null ? { amount } : {}) }, { now, rng });
  rec.seq++;
  return true;
}
const passive = () => { const l = L(); return play(l.canCheck ? 'check' : 'call'); };
// (HE4: a RIGGED deal — the seats' hole cards + the five board cards, burns between — set right after the deal, before any card shows)
const FULL = [...'23456789TJQKA'].flatMap(r => [...'shdc'].map(x => r + x));
function rig(holes = {}, board = null) {
  const t = T();
  for (const [id, c] of Object.entries(holes)) { const x = t.seats.find(y => y.id === id); if (x) x.cards = c.slice(); }
  if (board) {
    const used = new Set([...t.seats.flatMap(x => x.cards || []), ...board]);
    const rest = FULL.filter(c => !used.has(c));
    t.deck = [rest[0], board[0], board[1], board[2], rest[1], board[3], rest[2], board[4], ...rest.slice(3)];
  }
}
/** an all in before the flop: `short` = { seatIndex: chips kept }, `caller` = the seat that calls (the rest fold) — the run-out waits */
function shove(short, caller) {
  T().seats.forEach((x, i) => { if (short[i] != null && x.stack + x.bet > short[i]) x.stack = Math.max(1, short[i] - x.bet); });
  for (let g = 0; g < 30 && L(); g++) {
    const l = L(), i = T().seats.findIndex(y => y.id === l.id);
    play(short[i] != null ? 'allin' : i === caller ? (l.canCheck ? 'check' : l.callAllIn ? 'allin' : 'call') : (l.canCheck ? 'check' : 'fold'));
  }
}
const toStreet = name => { for (let g = 0; g < 60 && T().street !== name && running(T()); g++) passive(); };

let me = uids[0];
if (STATE === 'myturn' || STATE === 'slider' || STATE === 'preflop') {
  const opener = L().id;
  play('raise', T().bb * 3);
  if (N > 3) play('fold');
  if (STATE === 'preflop') { me = opener; if (N > 4) passive(); }
  else me = L().id;
} else if (['flop', 'turn', 'river'].includes(STATE)) {
  if (N > 4) { play('fold'); }
  toStreet(STATE);
  const l = L();
  const half = l.presets && l.presets.find(p => p.key === 'half');
  play('bet', half ? half.to : T().bb * 2);
  me = L().id;
} else if (STATE === 'allin') {
  // three short stacks all in before the flop → side pots, the hands turned up, the board running out street by street
  const seats = T().seats;
  seats.forEach((x, i) => { if (i < 3) { const keep = [420, 860, 1500][i]; x.stack = Math.min(x.stack, keep - x.bet); } });
  for (let g = 0; g < 20 && L(); g++) { const l = L(); const x = T().seats.find(y => y.id === l.id); if (T().seats.indexOf(x) < 3) play('allin'); else play(T().seats.indexOf(x) === 3 ? 'call' : 'fold'); }
  now += 1600; advance(rec, now, rng); rec.seq++;
  me = T().seats[3] ? T().seats[3].id : uids[0];
} else if (STATE === 'sidepots') {
  // three short stacks + a caller, rigged so each pot goes to someone else: the main → seat 0 (aces), side 1 → seat 1 (kings), side 2 → seat 3 (queens); seat 2 busts
  const S = T().seats;
  rig({ [S[0].id]: ['Ad', 'Ac'], [S[1].id]: ['Kd', 'Kc'], [S[2].id]: ['7d', '2h'], [S[3].id]: ['Qd', 'Qc'] }, ['2c', '5d', '9h', 'Js', '3c']);
  shove({ 0: 300, 1: 700, 2: 1100 }, 3);
  me = S[3].id;
} else if (STATE === 'ko' || STATE === 'spectate' || STATE === 'out') {
  // a short stack all in against aces — it busts. ko / spectate: you're the short stack; out: someone else is (you sit it out)
  const S = T().seats;
  rig({ [S[0].id]: ['7c', '2d'], [S[1].id]: ['As', 'Ah'] }, ['9c', 'Jd', 'Kh', '4s', '3c']);
  shove({ 0: 240 }, 1);
  me = STATE === 'out' ? S[2].id : S[0].id;
  if (STATE === 'spectate') { for (let g = 0; g < 12; g++) { now += 1600; advance(rec, now, rng); } now += 7000; advance(rec, now, rng); rec.seq++; }
} else if (STATE === 'levelup') {
  for (let g = 0; g < 20 && running(T()); g++) { const l = L(); if (!l) break; play('fold'); }
  me = uids[0];
} else if (STATE === 'leave') {
  for (let g = 0; g < 20 && running(T()); g++) { const l = L(); if (!l) break; play('fold'); }
  me = T().seats.find(x => x.stack > 0).id;
} else if (STATE === 'split') {
  // the board is a straight everyone plays — every hand still in splits the pot
  rig({}, ['As', 'Kd', 'Qh', 'Jc', 'Ts']);
  if (N > 4) { play('fold'); play('fold'); }
  toStreet('river');
  for (let g = 0; g < 20 && L(); g++) passive();
  for (let g = 0; g < 10 && running(T()); g++) { now += 1600; advance(rec, now, rng); }
  rec.seq++;
  me = (T().seats.find(x => x.shown) || T().seats[0]).id;
} else if (STATE === 'showdown' || STATE === 'final') {
  if (N > 4) { play('fold'); play('fold'); }
  toStreet('river');
  for (let g = 0; g < 20 && L(); g++) passive();
  for (let g = 0; g < 10 && running(T()); g++) { now += 1600; advance(rec, now, rng); }
  rec.seq++;
  me = (T().seats.find(x => x.shown) || T().seats[0]).id;
} else if (STATE === 'foldwin') {
  for (let g = 0; g < 20 && running(T()); g++) { const l = L(); if (!l) break; me = l.id; play('fold'); }
  me = T().result && T().result.pots[0] ? T().result.pots[0].winners[0].id : me;
} else if (STATE === 'away') {
  const l = L();
  me = T().seats.find(x => x.id !== l.id && x.status === 'in').id;
  const x = T().seats.find(y => y.id === me); x.away = true; x.timeouts = 2;
  if (MODE === 'cash') { x.status = 'sitout'; x.held = false; x.cards = []; }
  else if (N > 3) { const o = T().seats[T().seats.length - 1]; if (o.id !== me && o.id !== l.id) { o.status = 'out'; o.stack = 0; o.cards = []; } }
  rec.seq++;
}
// HE5 — LEAVE AFTER THIS HAND queued by the dealer (the button: LEAVING AFTER THIS HAND · CANCEL)
if (ASK === 'leavequeued') rec.lv = { [me]: T().hand };
if (MODE === 'cash' && q.get('broke') === '1') { const x = T().seats.find(y => y.id === me); x.stack = 0; x.status = 'folded'; x.cards = []; }
if (q.get('hand') && T().seats.find(x => x.id === me)) { const x = T().seats.find(y => y.id === me); const c = q.get('hand'); x.cards = [c.slice(0, 2), c.slice(2, 4)]; }
// the clock: a few seconds into the turn (the bar part-drained)
const t = T();
// (HE8 — YOUR TURN TIMER: &clk=<ms left> holds the clock there; &bank=1 = the turn already in your time bank — the bar red-orange; with
//  &clk ≤ 5000 the last 5 s: the plate's pulse)
if (q.get('bank') === '1' && t.deadline) { const x = t.seats.find(y => y.seat === t.turn) || t.seats[t.turn]; t.bankFrom = t.deadline; t.deadline = t.bankFrom + (x.bank || 30_000); t.bankOn = true; x.bank = 0; }
const CLK = q.get('clk') != null ? Number(q.get('clk')) : null;
if (!PLAY && !STAGED && STATE !== 'spectate') window.__clock = () => (t.deadline ? t.deadline - (CLK != null ? CLK : 12_500) : now + 400);

const pub = publicOf(rec);
const node = { seq: rec.seq, at: now, ...nestWire(toWire(pub)) };
const hole = holeOf(rec, me);
window.__fakeDb[`hole/PVWX/${me}`] = hole;
const host = q.get('host') === '0' ? uids.find(u => u !== me) : me;
const game = { id: 'holdem', matchId: rec.id, settings: { mode: MODE, speed: 'turbo' }, participants: Object.fromEntries(uids.map(u => [u, true])), phase: 'play', startAt: T0 };
if (STATE === 'final') {
  // the podium: a finished match's rows (a made-up order of finish over the real players)
  const fake = MODE === 'cash'
    ? { mode: 'cash', players: pub.players, ledger: uids.map((u, i) => ({ id: u, buyins: 1000 + (i % 2) * 1000, rebuys: i % 2, final: [2840, 1260, 990, 0, 1910, 500, 1300, 1200][i], net: [2840, 1260, 990, 0, 1910, 500, 1300, 1200][i] - (1000 + (i % 2) * 1000), hands: 40 })) }
    : { mode: 'tournament', players: Object.fromEntries(uids.map((u, i) => [u, { hands: 30 - i, won: 9 - i, kos: Math.max(0, 3 - i) }])), places: uids.map((u, i) => ({ id: u, place: i + 1 })) };
  Object.assign(fake, { hands: 47, biggest: { amount: 4280, ids: [uids[1]] } });
  if (MODE !== 'cash') fake.players[uids[2]].kos = 3;
  Object.assign(game, { phase: 'final', ranks: ranksOf(fake), rows: finalRowsOf(fake), endMode: MODE, sum: finalSummaryOf(fake) });
}
const state = { uid: me, code: 'PVWX', players, presence, game, meta: { hostId: host, status: 'playing' }, live: STATE === 'waiting' ? { table: null } : { table: node }, liveKey: 'x' };
setState({ uid: me, players, presence, game, meta: state.meta, live: state.live });
(await import('/js/profile/public.js')).watchRoomProfiles(players);   // (the room's profiles, as room.js watches them)
await new Promise(r => setTimeout(r, 20));
const { loadGame } = await import('/js/games/registry.js');
await loadGame('holdem');   // (the cartridge, as every phone has it by the podium — its finalScene draws the body)
const { createView } = await import('/js/games/holdem/view.js');
const view = createView();
view.mount(document.getElementById('app'), state);
if (STATE === 'slider') { await new Promise(r => setTimeout(r, 60)); document.querySelector('.he-raise')?.click(); }
if (STATE === 'leave') { await new Promise(r => setTimeout(r, 120)); document.querySelector('.he-leave')?.click(); await new Promise(r => setTimeout(r, 400)); }
// (HE6: &settings=1 = ☰ → Settings open over the table — THE TABLE picker; a tap there switches the skin live)
if (q.get('settings')) {
  const sp = await import('/js/ui/settings-panel.js');
  sp.installSettingsPanel(); document.querySelector('.gear')?.click();
  await new Promise(r => setTimeout(r, 500));
  document.querySelector('.set-table')?.scrollIntoView({ block: 'center' });
  await new Promise(r => setTimeout(r, 200));
}
// (HE7: &rankings=1 = THE RANKINGS SHEET open — your hand's name tapped)
if (q.get('rankings')) {
  (await import('/js/games/holdem/rankings.js')).openRankings({ mark: 'PAIR' });
  await new Promise(r => setTimeout(r, 450));
}
await document.fonts.ready;
await new Promise(r => setTimeout(r, 150));
window.__preview = { rec, pub, me, node };
document.body.dataset.ready = '1';

const sleep = ms => new Promise(r => setTimeout(r, ms));
const vsleep = ms => sleep(Math.max(8, ms / SPEED));   // (the demo's pauses, compressed by &speed)
/** a new public table (+ your hole node) → the view, exactly as a phone gets the dealer's write */
const publish = () => {
  rec.seq++;
  const p = publicOf(rec);
  const n = { seq: rec.seq, at: vnow(), ...nestWire(toWire(JSON.parse(JSON.stringify(p)))) };
  window.__fakePush(`hole/PVWX/${me}`, holeOf(rec, me));
  const live = { table: n };
  Object.assign(state, { live, game: { ...state.game, matchId: rec.id } });
  view.update({ ...state });
};
// THE STAGED STATES: the last step plays LIVE (the real clock — fresh events → the real motion), until the next deal (the re-spread)
if (STAGED) {
  await sleep(600);
  if (STATE === 'levelup') { rec.m.startAt = Date.now() - rec.m.levelMs - 2000; rec.doneAt = Date.now() - 10_000; }
  const h0 = T().hand;
  for (let i = 0; i < 120; i++) {
    if (advance(rec, Date.now(), rng)) publish();
    if (T().hand !== h0) break;
    await sleep(200);
  }
  document.body.dataset.staged = '1';
}

// HE5 — THE SOUNDS in THE MOTION DEMO (the PRISM pattern): the engine's tap listeners (the first tap unlocks the audio, as in the app) + a
// TAP FOR SOUND button; the effects on, the music off here (HOLD'EM's music is the console's LATE station). &mute=1 = silent, no button; a test
// browser (navigator.webdriver) gets none unless &sound=1
if (PLAY && q.get('mute') !== '1' && (!navigator.webdriver || q.get('sound') === '1')) {
  (await import('/js/audio/engine.js')).installAudio();
  updateSettings({ muted: false, sfxOff: false, musicOff: true });
  const tap = document.createElement('button');
  tap.textContent = 'TAP FOR SOUND';
  tap.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10000;min-height:56px;padding:0 28px;border-radius:12px;border:2px solid #f2c14e;background:#120d04;color:#ffe7a6;font:700 18px "Chakra Petch",sans-serif;letter-spacing:.1em;box-shadow:0 0 22px rgba(242,193,78,.4)';
  tap.addEventListener('click', () => { tap.remove(); });
  document.body.append(tap);
}
if (PLAY) {
  const KO = q.get('ko') === '1';
  let shovers = [], lastHand = -1;
  const scene = () => T().hand % 3;            // 1 = a showdown · 2 = an all in with side pots · 0 = a fold-win
  window.__preview.hands = 0;   // (HE8: every hand dealt in the demo, across its matches — the endurance run counts them)
  function onNewHand() {
    lastHand = T().hand;
    window.__preview.hands++;
    shovers = [];
    if (scene() !== 2) return;
    // three short stacks (never you, unless &ko=1)
    const pool = T().seats.filter(x => x.status === 'in' && (KO || x.id !== me));
    const pick = (KO ? [pool.find(x => x.id === me), ...pool.filter(x => x.id !== me)] : pool).filter(Boolean).slice(0, 3);
    pick.forEach((x, i) => { const keep = [260, 520, 900][i]; if (x.stack + x.bet > keep) x.stack = Math.max(1, keep - x.bet); shovers.push(x.id); });
  }
  function decide(l) {
    const tb = T(), x = tb.seats.find(y => y.id === l.id);
    const sc = scene();
    if (sc === 2) {
      if (shovers.includes(l.id)) return ['allin'];
      const caller = tb.seats.filter(y => !shovers.includes(y.id) && y.status === 'in').sort((a, b) => b.stack - a.stack)[0];
      if (caller && caller.id === l.id) return [l.canCheck ? 'check' : l.callAllIn ? 'allin' : 'call'];
      return [l.canCheck ? 'check' : 'fold'];
    }
    if (sc === 0) {
      if (tb.street === 'preflop' && tb.bet <= tb.bb && !l.canCheck) return ['raise', tb.bb * 3];
      return [l.canCheck ? 'check' : 'fold'];
    }
    // a showdown: a raise before the flop, a half-pot bet on the flop + the turn, the last seat folds to the flop bet
    if (tb.street === 'preflop') return tb.bet <= tb.bb && !l.canCheck ? ['raise', tb.bb * 3] : [l.canCheck ? 'check' : 'call'];
    if (l.canCheck && tb.street !== 'river') { const half = (l.presets || []).find(p => p.key === 'half'); return half && !half.allin ? ['bet', half.to] : ['check']; }
    if (l.canCheck) return ['check'];
    const live = tb.seats.filter(y => y.status === 'in');
    if (tb.street === 'flop' && live.length > 2 && live[live.length - 1].id === l.id) return ['fold'];
    return [l.callAllIn ? 'allin' : 'call'];
  }
  (async () => {
    for (;;) {
      await vsleep(250);
      now = vnow();
      if (rec.m.ended) {
        await vsleep(4000);
        now = vnow();
        rec = newRecord({ code: 'PVWX', uids, mode: MODE, now, rng, prevSeq: rec.seq });
        rec.m.levelMs = Math.max(10, Number(q.get('lv') || 40)) * 1000;
        advance(rec, now, rng); lastHand = -1;
        window.__preview.rec = rec;
        publish();
        continue;
      }
      const l = L();
      if (l) {
        await vsleep(l.id === me ? 1400 : 850);
        now = vnow();
        const [a, amt] = decide(l);
        try { applyOp(rec, 'act', l.id, { hand: T().hand, seq: rec.seq, action: a, ...(amt != null ? { amount: amt } : {}) }, { now, rng }); } catch (e) { try { applyOp(rec, 'act', l.id, { hand: T().hand, seq: rec.seq, action: l.canCheck ? 'check' : 'fold' }, { now, rng }); } catch { /* the next tick */ } }
        publish();
        continue;
      }
      if (advance(rec, now, rng)) { if (T().hand !== lastHand && running(T())) onNewHand(); publish(); }
    }
  })();
}
</script>
