<!-- OC1 — the real OVERCLOCK view in its OVERDRIVE skin, no Firebase (an import map swaps js/firebase.js for fake-firebase.js):
     ?type=trivia|truefalse|<any type>  (the challenge on screen)   &n=4 (players)   &final=1 (the ×2 last challenge)   &seed=… (OC6: another deal)
     &at=brief      the title slam + the rules card (BRIEF_MS 7 s)        ready   the slam + 3-2-1 (READY_MS 3.2 s)
         play       answering                                             right / wrong   one answer, its feedback frozen mid-way
         answer     THE ANSWER after the round (your picks: right · wrong · none)
         combo4     the 4th right in a row → the OVERDRIVE banner         combo10   the 10th → the quick flash
         kit        the kit's pieces in the OVERDRIVE skin (the number pad, the keyboard, the tach in its last 3 s, THE ANSWER)
     &still=1 holds the slam on its card (no countdown)   window.__preview = { game, state, step, tap(i) }
     OC2 — THE RESULTS FLOW (the after-challenge screen + the end of the match):
         at=answer &type=<any of the 18>   THE ANSWER (this phone's picks: a mix of right + wrong)
         &beat=answer|banner|stand         the after-challenge screen opened at that beat (a rejoin's view)   &win=tie|none   DEAD HEAT · NO WINNER
         &ready=1                          READY marks on most rows       &n=1…8   the players (1 = SOLO)
         &final=1 &beat=final|victory      the LAST challenge: FINAL STANDINGS · THE VICTORY (the console's frame + finalScene)   &cowin=1 CO-WINNERS
         &hold=1 (+ __go())                a right / wrong / combo4 / combo10 tap waits for the camera (shots.mjs --cast … --js "__go()")
     OC3 — THE TYPING CHALLENGES (type=math | pattern | closest | missinglink | unscramble), on the kit's pads (pressed like a finger):
         at=play · typing (a part-typed answer) · right · wrong (typed + LOCK IT IN / GO / the last tile) · answer (THE ANSWER, its dressing)
         at=brief&still=1 &type=pattern | missinglink   the rules card + its ~3 s DEMO (loops)
         window.__preview.typePad('123') · typeKeys('WORD') · typeTiles('word')   (a camera's --js can type on the pads)
     OC3B — THE CARD + LIST CHALLENGES (type=spellcheck | higherlower | timeline | sortit): at=play · right · wrong · answer (THE ANSWER, its
         dressing; higherlower: &run=miss (default) | time | perfect) · at=brief&still=1&type=higherlower = its DEMO in the rules card
         window.__preview.tap(k, right) answers part k (a Higher or Lower call, a spelling, a sort, a whole Timeline order)
     OC5 — DUMB LUCK (type=dumbluck — always 2+ players):
         at=brief&still=1   the title slam with the crafted NEON SIGN (powering up)
         at=play            THE ODDS BOARD   &picks=none | mine (yours + a few) | crowd (several on one horse)   &t=ms into it (default 2200)
         at=race &t=ms      THE RACE at that moment (default 8000; &t=200 = the off)   at=finish &t=ms   THE FINISH (default 1600)
             &win=long (an 8-1 / 12-1 winner — LONG SHOT!) · house (nobody backed it) · you (yours wins) · photo=1 (a photo finish)
         at=answer          the after-screen (&beat=answer | banner | stand) — WINNING TICKETS · THE HOUSE WINS (&win=house)
         &freeze=1          the server clock held still (window.__clock) — a moving moment as a still
         SOLO's victory (&n=1&final=1&beat=victory&at=answer): &pb=new (NEW PERSONAL BEST) · &pb=best (YOUR SCORE + YOUR BEST) · none = /api down
     OC8 — THE PREVIEW TELLS THE TRUTH (A21):
         THE CORNER BUTTONS — the real app's ☰ + music (the console's markup, sized + placed by components.css) on every state; &corner=0 hides them
         &beat=victory lands AT REST (the podium's slim cards up, the award chips in — a rejoin's view); &anim=1 = the live power-up instead
         at=right / wrong / close: the screen HOLDS the answer's feedback (its advance waits; &mid=ms into the feedback, default 320) —
         the shot lands AFTER the tap, never on the next question; __preview.release() lets it go on
         &zero=1 (the last challenge) = nobody scored (every result 0 — the NOBODY SCORED body) -->

<body data-theme="overclock" data-look="night">

<!-- OC8 (A21) — THE CORNER BUTTONS exactly as the console builds them (ui/settings-panel.js: button.menu-btn + button.music-btn; components.css
     sizes + places them — 36 pt circles, ☰ on top, music under it); the after-challenge screens must clear them -->
<button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" id="pv-menu"><span class="mb-bars"><i></i><i></i><i></i></span></button>
<button class="music-btn" type="button" aria-label="Music on — tap to turn it off" aria-pressed="true" id="pv-music"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="nt"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g><path class="slash-bg" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg></button>
<script type="module">
import { createView } from '/js/games/overclock/view.js';
import { createGame } from '/js/games/overclock/director.js';
import { partsFor } from '/js/games/overclock/challenges.js';
import { levelOf, CHALLENGE_MS, READY_MS, BRIEF_MS, FINAL_MS, standingsMs, computeResults, resultBeats, finalBeats, beatStart, roundWin, packRoundWin } from '/js/games/overclock/logic.js';
import { appendPatch } from '/js/trivia/bankdata.js';
import { liveKeyFor, loadGame } from '/js/games/registry.js';
import { setState } from '/js/store.js';

const q = new URLSearchParams(location.search);
if (q.get('corner') === '0') for (const id of ['pv-menu', 'pv-music']) document.getElementById(id).remove();
const type = q.get('type') || 'trivia';
const at = q.get('at') || 'play';
const n = Math.max(1, Math.min(8, Number(q.get('n') || 4)));
const final = q.get('final') === '1';
const COLORS = ['orange', 'cyan', 'magenta', 'yellow', 'green', 'violet', 'red', 'blue'];
const NAMES = ['YOU', 'MAYA', 'LEO', 'DANA', 'EVE', 'FINN', 'GRACE', 'HAL'];
const AV = ['crown', 'bolt', 'diamond', 'star', 'skull', 'heart', 'eye', 'ghost'];
const uids = Array.from({ length: n }, (_, i) => `u${i}`), me = uids[0];
const players = Object.fromEntries(uids.map((u, i) => [u, { name: NAMES[i], color: COLORS[i], avatar: AV[i], joinedAt: i }]));
const presence = Object.fromEntries(uids.map(u => [u, { online: true, lastSeen: Date.now() }]));
const QS = [
  { q: 'Which planet has the shortest day in our solar system?', a: ['Jupiter', 'Mercury', 'Saturn', 'Neptune'], c: 0 },
  { q: 'What is the hardest natural substance on Earth?', a: ['Quartz', 'Titanium', 'Diamond', 'Graphene'], c: 2 },
  { q: 'In which city did the first Olympic Games of the modern era take place?', a: ['Paris', 'Athens', 'London', 'Rome'], c: 1 },
].map(x => ({ ...x, cat: 'general', d: 'medium' }));
const { patch } = appendPatch({ matchId: 'pv', trivia: { n: 0, seen: {} } }, 'PVW1', QS);
const bank = {}; for (const [k, v] of Object.entries(patch)) if (k.startsWith('bank/')) bank[k.slice(5)] = v;
const total = 6, ci = final ? 5 : 1;
const order = [type === 'truefalse' ? 'math' : 'truefalse', type, 'memory', 'oddone', 'stroop', type === 'closest' ? 'timeline' : 'closest'];
if (final) { order[5] = type; order[1] = type === 'truefalse' ? 'trivia' : 'truefalse'; }
const now = Date.now();
const game = createGame({ matchId: 'pv', settings: { mode: 'quick' }, participants: Object.fromEntries(uids.map(u => [u, true])), now, seed: q.get('seed') || 'preview-seed', bank, trivia: { n: patch['trivia/n'] }, order });
Object.assign(game, { ci, ck: String(ci), tq: { [ci]: 0 }, seen: { [type]: at !== 'brief' } });
// OC4 — ODD ONE OUT's families on demand: &fams=0,1,3 (0 letters · 1 rotation · 2 mirror · 3 neon shapes) &item=n (each family's n-th item)
if (type === 'oddone' && q.get('fams')) game.deal = { [ci]: q.get('fams').split(',').map(Number).flatMap(f => [f, Number(q.get('item') || 0)]) };
game.results = { 0: Object.fromEntries(uids.map((u, i) => [u, { pts: [148, 120, 96, 60, 40, 30, 20, 10][i], ok: 4, parts: 4 }])) };
game.combo = Object.fromEntries(uids.map(u => [u, { c: 0, m: 2 }]));
if (at === 'combo4') game.combo[me] = { c: 3, m: 3 };
if (at === 'combo10') game.combo[me] = { c: 9, m: 9 };
if (at === 'answer') game.combo[me] = { c: 2, m: 4 };
const parts = partsFor(type, levelOf(ci, total));
const boards = Object.fromEntries(uids.slice(1).map((u, i) => [u, { p: Math.min(parts, i + 1), ok: Math.min(parts, i + 1), n: parts, done: false }]));
const state = { uid: me, code: 'PVW1', players, presence, game, live: { boards, marks: {}, next: {}, my_boards: {} }, liveKey: null, meta: { status: 'playing' } };
// OC5 — DUMB LUCK: the field, the picks, the drawn winner (a seed found for the asked moment: a long shot, a photo finish), the race's clock
const DL = type === 'dumbluck' ? await import('/js/games/overclock/luck.js') : null;
let dlRace = null;
if (DL) {
  const want = q.get('win') || '', photo = q.get('photo') === '1';
  const picks = q.get('picks') || (at === 'play' ? 'none' : 'mine');
  let seed = 'preview-seed', w = 0;
  for (let k = 0; k < 4000; k++) {
    const sd = `preview-dl-${k}`, f = DL.dlField(sd, ci);
    const lane = want === 'long' ? f.indexOf(12) : want === 'you' ? 2 : want === 'house' ? f.indexOf(5) : f.indexOf([3, 4, 2][k % 3]);
    const S = DL.raceScript(sd, ci, lane);
    if (S.photo === photo) { seed = sd; w = lane; break; }
  }
  game.seed = seed;
  const field = DL.dlField(seed, ci);
  const others = uids.slice(1);
  const pk = {};
  if (picks === 'mine' || picks === 'crowd') pk[me] = want === 'you' ? w : want === 'house' ? (w + 2) % 6 : (w + 1) % 6;
  others.forEach((u, i) => { pk[u] = picks === 'crowd' ? (i < 3 ? 4 : i % 6) : want === 'house' ? (w + 1 + (i % 4)) % 6 : (i % 3 === 0 ? w : (w + 2 + i) % 6); });
  if (picks === 'none') for (const u of Object.keys(pk)) delete pk[u];
  if (at === 'play' && picks === 'none') { /* nobody yet */ } else for (const [u, h] of Object.entries(pk)) if (u !== me || at === 'play') boards[u] = DL.pickBoard(h);
  if (at === 'play' && picks !== 'none' && pk[me] != null) boards[me] = DL.pickBoard(pk[me]);
  dlRace = { pk, w, field };
}
// &beat=answer|banner|stand|final|victory (OC2): the after-challenge screen opened at that beat (its start moved back on the clock — exactly
// what a phone rejoining then sees); &still=1 freezes it there
const BEAT = q.get('beat') || '';
// (OC8 — A21: &beat=victory lands AT REST — the victory's own "late" rule (victory.js: > 6 s after its beat) shows the podium's slim cards + the
//  award chips in place, as the real app shows them a moment in; &anim=1 = the power-up from its first frame)
const VIC_REST = BEAT === 'victory' && q.get('anim') !== '1' ? 6500 : 0;
const beatOff = phase => { if (!BEAT || (phase !== 'standings' && phase !== 'final')) return 0; const solo = n === 1; const b = phase === 'final' ? finalBeats(type, solo) : resultBeats(type, solo); const at = beatStart(b, BEAT); return at == null ? 0 : at + 250 + (phase === 'final' ? VIC_REST : 0); };
const setPhase = (phase, len) => { const t = Date.now() - beatOff(phase); const hold = q.get('still') === '1' && (phase === 'standings' || phase === 'final') ? 600000 : 0; Object.assign(game, { phase, phaseStartAt: t, phaseEndsAt: t + (hold || len), ...(phase === 'play' ? { playStartAt: t } : {}) }); };
if (at === 'brief') { game.brief = true; setPhase('ready', q.get('still') === '1' ? 600000 : BRIEF_MS); }
else if (at === 'ready') { game.brief = false; setPhase('ready', q.get('still') === '1' ? 600000 : READY_MS); }
else setPhase('play', at === 'play' ? CHALLENGE_MS : 600000);
if (DL) {
  const T = Number(q.get('t') ?? (at === 'race' ? 8000 : at === 'finish' ? 1600 : 2200));
  const now0 = Date.now();
  if (q.get('freeze') === '1') window.__clock = () => now0;
  const lockAt = at === 'race' ? now0 - T : at === 'finish' ? now0 - DL.DL_RACE_MS - T : now0 - DL.DL_RACE_MS - DL.DL_FINISH_MS - 200;
  if (at === 'play') Object.assign(game, { phaseStartAt: now0 - T, playStartAt: now0 - T, phaseEndsAt: now0 - T + DL.DL_MS });
  else if (at === 'race' || at === 'finish' || at === 'answer') {
    Object.assign(game, { playStartAt: lockAt - DL.DL_PICK_MS - 120, phaseStartAt: lockAt - DL.DL_PICK_MS - 120, phaseEndsAt: lockAt - 120 + DL.DL_MS });
    game.dl = { [ci]: { pk: dlRace.pk, lk: lockAt, w: dlRace.w } };
  }
}
// OC5 — the SOLO victory's server answer (&n=1&final=1&beat=victory): &pb=new → NEW PERSONAL BEST (was 940) · &pb=best → YOUR SCORE + YOUR BEST
if (q.get('pb')) { try { sessionStorage.setItem('rc:PVW1_pv', JSON.stringify(q.get('pb') === 'new' ? { pbs: [{ b: 'overclock-quick-solo', v: 1180, prev: 940 }], bests: { 'overclock-quick-solo': 1180 } } : { pbs: [], bests: { 'overclock-quick-solo': 1320 } })); } catch { /* */ } }
await loadGame('overclock');   // (the registry knows a game's live paths once its cartridge is in)
setState({ code: 'PVW1', uid: me });
state.liveKey = liveKeyFor(game);

const view = createView();
const screen = document.getElementById('screen');
let mounted = false;
// (the console's podium frame reads the STORE's game to find the cartridge's finalScene — the preview keeps the store in step)
const push = () => { setState({ game: { ...game }, players, presence }); if (!mounted) { view.mount(screen, state); mounted = true; } else view.update({ ...state, game: { ...game } }); };
const step = p => { Object.assign(game, p); push(); };
const wait = ms => new Promise(r => setTimeout(r, ms));
// OC8 (A21) — HOLD THE ADVANCE: while on, a screen's timers of ≥ 400 ms (the next question, the feedback's end) are kept, not run — the
// answer's feedback stays on screen for the camera; window.__preview.release() lets them go
const ST = window.setTimeout.bind(window);
const realWait = ms => new Promise(r => ST(r, ms));
let holding = false; const heldT = [];
window.setTimeout = (fn, ms = 0, ...a) => (holding && ms >= 400 && typeof fn === 'function' ? (heldT.push(() => fn(...a)), 0) : ST(fn, ms, ...a));
const holdAdvance = on => { holding = on; if (!on) heldT.splice(0).forEach(f => ST(f, 0)); };
const tiles = () => [...document.querySelectorAll('.oc-tile, .tf-btn')];
// a finger: pointerdown at a real point on the element (OC4 — the crack starts where the finger lands: &tx=0..1 &ty=0..1 across it, default 0.64 · 0.5)
const TX = Number(q.get('tx') ?? 0.64), TY = Number(q.get('ty') ?? 0.5);
const press = el => { if (!el) return; const r = el.getBoundingClientRect(); el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerType: 'touch', clientX: r.left + r.width * TX, clientY: r.top + r.height * TY })); };
const spec = () => window.__oc && window.__oc.spec();
/** answer the challenge's part k: right or not */
function tap(k, right = true) {
  const s = spec();
  if (!s) return;
  if (s.type === 'trivia') { const c = s.questions[k].c; press(document.querySelectorAll('.oc-tile')[right ? c : (c + 1) % 4]); }
  else if (s.type === 'truefalse') { const t = s.items[k].truth; press(document.querySelector((right ? t : !t) ? '.tf-true' : '.tf-false')); }
  else if (padAnswer(s, k) != null) { typePad(padAnswer(s, k, right)); press(document.querySelector('.gk-np .gk-go')); }
  else if (s.type === 'missinglink') { typeKeys(right ? s.puzzles[k].answer : 'STONE'); if (!right) press(document.querySelector('.gk-keyboard .gk-go')); }
  else if (s.type === 'unscramble') { const w = right ? s.word : [...s.word].reverse().join(''); typeTiles(w); }
  // OC3B — the card + list challenges, pressed like a finger
  else if (s.type === 'spellcheck') { const a = s.items[k].ans; press(document.querySelectorAll('.oc-sp-opt')[right ? a : (a + 1) % 4]); }
  else if (s.type === 'higherlower') { const P = s.pairs[k], up = P.b.v > P.a.v; press(document.querySelector((right ? up : !up) ? '.oc-hl-btn.is-up' : '.oc-hl-btn.is-down')); }
  else if (s.type === 'timeline') { tlOrder(right).forEach(i => press(document.querySelectorAll('.oc-tl-row')[i])); press(document.querySelector('.oc-tl-lock')); }
  else if (s.type === 'sortit') return sortTap(k, right);
  // OC4 — the visual / reflex challenges
  else if (s.type === 'rewire') return wire(right ? Infinity : 2, k);
  else if (s.type === 'memory') return mem(right ? s.seq.length : 3);
  else if (s.type === 'count') return countTap(k, right);
  else if (s.type === 'reflex') return rxTap(right);
  else if (s.type === 'compass') return cpTap(k, right);
  else if (s.type === 'oddone') { const g = s.grids[k]; press(document.querySelectorAll('.oc-odd-cell')[right ? g.idx : (g.idx + 3) % (g.size * g.size)]); }
  else if (s.type === 'stroop') { const it = s.items[k]; press(document.querySelector(`.oc-cc-opt[data-c="${right ? it.ink : it.order.find(c => c !== it.ink)}"]`)); }
}
// SIGNAL LOCK: right = wait for GO then a finger ~240 ms later; wrong = a tap during the wait (EARLY)
async function rxTap(right = true) {
  for (let w = 0; w < 200 && !/wait|go/.test(document.querySelector('.oc-rx')?.dataset.mode || ''); w++) await wait(20);
  if (!right) { await wait(300); press(document.querySelector('.oc-rx-pad')); return; }
  for (let w = 0; w < 300 && document.querySelector('.oc-rx')?.dataset.mode !== 'go'; w++) await wait(10);
  await wait(240); press(document.querySelector('.oc-rx-flash'));
}
// COMPASS: wait for "WHICH WAY NOW?", then the heading (wrong = the opposite one)
async function cpTap(k, right = true) {
  const s = spec(); if (!s) return;
  for (let w = 0; w < 600 && !document.querySelector('.oc-cp.is-asking'); w++) await wait(20);
  const R = s.rounds[k];
  press(document.querySelector(`.oc-cp-${'nesw'[right ? R.ans : (R.ans + 2) % 4]}`));
}
// QUICK COUNT: wait for the question, then the right count (or two off — 'close' = one off)
async function countTap(k, right = true) {
  const s = spec(); if (!s) return;
  for (let w = 0; w < 120 && !document.querySelector('.oc-qc-opt'); w++) await wait(30);
  const it = s.items[k], v = right === 'close' ? it.options.find(o => Math.abs(o - it.ans) === 1) : right ? it.ans : it.options.find(o => Math.abs(o - it.ans) >= 2) ?? it.options.find(o => o !== it.ans);
  press(document.querySelector(`.oc-qc-opt[data-v="${v}"]`));
}
// MEMORY: wait for your turn, repeat the sequence (slipAt < its length → a wrong node at that step), a finger ~220 ms apart
async function mem(slipAt = 99) {
  const s = spec(); if (!s) return;
  for (let w = 0; w < 200 && !document.querySelector('.oc-mem-grid.is-input'); w++) await wait(40);
  const nodes = () => document.querySelectorAll('.oc-mem-node');
  for (let k = 0; k < s.seq.length; k++) {
    press(nodes()[k === slipAt ? (s.seq[k] + 4) % 9 : s.seq[k]]);
    if (k === slipAt) return;
    await wait(220);
  }
}
// REWIRE: turn the first m tiles of circuit k's path into place (Infinity = solve it), a finger press each turn, ~70 ms apart
const wired = {};
async function wire(m = Infinity, k = null) {
  const s = spec(); if (!s) return;
  const c = k ?? Math.min(1, Math.floor(window.__oc.state().p)), pz = s.puzzles[c];
  for (let w = 0; w < 60 && document.querySelectorAll('.oc-wire-tile').length !== pz.n * pz.n; w++) await wait(50);
  const cur = wired[c] ||= pz.start.slice();
  for (const i of pz.path.slice(0, m)) {
    while (cur[i] !== pz.solution[i] && !(window.__oc.state().p > c)) {
      press(document.querySelectorAll('.oc-wire-tile')[i]); cur[i] = (cur[i] + 1) % 4; await wait(70);
    }
  }
}
// TIMELINE: the screen indexes in the right order (wrong = the middle two swapped)
const tlOrder = (right = true) => { const s = spec(), o = [0, 1, 2, 3].map(pos => s.shown.indexOf(pos)); if (!right) [o[1], o[2]] = [o[2], o[1]]; return o; };
// SORT IT: wait for card k on the table, then a finger: a quick TAP on a side (or __preview.swipe — a real drag, for the motion proof)
const liveCard = async () => { for (let w = 0; w < 80 && !document.querySelector('.oc-st-card.is-live'); w++) await wait(25); return document.querySelector('.oc-st-card.is-live'); };
const ptr = (type, x, y) => document.querySelector('.oc-st').dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch', clientX: x, clientY: y }));
async function sortTap(k, right = true) {
  const card = await liveCard(); if (!card) return;
  const s = spec(), side = right ? s.cards[k].s : 1 - s.cards[k].s, r = document.querySelector('.oc-st').getBoundingClientRect();
  const x = r.left + r.width * (side ? 0.82 : 0.18), y = r.top + r.height * 0.5;
  ptr('pointerdown', x, y); ptr('pointerup', x, y);
}
async function swipe(right = true, k = null) {
  const card = await liveCard(); if (!card) return;
  const s = spec(), i = k ?? window.__oc.state().p, side = right ? s.cards[i].s : 1 - s.cards[i].s, r = card.getBoundingClientRect();
  const x0 = r.left + r.width / 2, y = r.top + r.height / 2, dir = side ? 1 : -1;
  ptr('pointerdown', x0, y);
  for (let f = 1; f <= 9; f++) { await new Promise(requestAnimationFrame); ptr('pointermove', x0 + dir * f * 13, y + f); }
  ptr('pointerup', x0 + dir * 117, y + 9);
}
// OC3 — the kit's pads, pressed like a finger (pointerdown on each key)
const padAnswer = (s, k, right = true) => {
  const v = s.type === 'math' ? s.problems[k].ans : s.type === 'pattern' ? s.seqs[k].ans : s.type === 'closest' ? Math.round(s.answer * 1.12) : null;
  return v == null ? null : right || s.type === 'closest' ? v : v + 7;
};
function typePad(v) {
  for (const ch of String(v).replace('-', '−')) press([...document.querySelectorAll('.gk-np-key')].find(b => b.dataset.k === ch));
}
function typeKeys(word) { for (const ch of String(word).toUpperCase()) press([...document.querySelectorAll('.gk-kb-key')].find(b => b.dataset.k === ch)); }
function typeTiles(word) { for (const ch of String(word)) press([...document.querySelectorAll('.oc-us-tile:not(.is-used)')].find(b => b.dataset.ch === ch)); }
/** at=typing: a part-typed answer (the pad's first digits, two letters on the keyboard, two tiles) */
function typing() {
  const s = spec();
  if (!s) return;
  const p = padAnswer(s, 0);
  if (p != null) typePad(String(p).slice(0, Math.max(1, String(p).length - 1)));
  else if (s.type === 'missinglink') typeKeys(s.puzzles[0].answer.slice(0, 3));
  else if (s.type === 'unscramble') typeTiles(s.word.slice(0, 2));
}
window.__preview = { game, state, step, tap, push, release: () => { holdAdvance(false); document.getAnimations().forEach(a => { try { a.play(); } catch { /* */ } }); }, wire: (m, k) => wire(m, k), mem: n => mem(n), swipe: (r, k) => swipe(r, k), typePad: v => typePad(v), typeKeys: w => typeKeys(w), typeTiles: w => typeTiles(w), lock: () => press(document.querySelector('.gk-np .gk-go')) };
// (the view's test hook needs ?emu in the address — the preview adds it for itself)
if (!/[?&]emu\b/.test(location.search)) history.replaceState(null, '', `${location.pathname}${location.search}${location.search ? '&' : '?'}emu=1`);
push();

// body[data-ready] = the scenario reached its moment (shots.mjs --page shoots then, + its --wait for a settle / a mid-animation frame)
const ready = () => { document.body.dataset.ready = '1'; };
// &hold=1 (OC2 — THE MOTION PROOF): the scenario waits for window.__go() before its tap, so a camera (shots.mjs --cast … --js "__go()") films
// it from the first frame
const hold = q.get('hold') === '1' ? new Promise(r => { window.__go = r; }) : null;
(async () => {
  if (at === 'kit') { await kitPage(); return ready(); }
  await wait(250);
  if (hold && /^(right|wrong|combo4|combo10)$/.test(at)) { ready(); await hold; }
  if (at === 'right' || at === 'wrong' || at === 'close' || at === 'typing') for (let w = 0; w < 60 && !spec(); w++) await wait(100);
  if (at === 'typing') { typing(); return ready(); }
  if (at === 'right' || at === 'wrong' || at === 'close') {
    // (OC8 — A21: the feedback HELD — the screen's own advance timers wait, the CSS motion pauses mid-way; the shot lands after the tap)
    holdAdvance(true);
    await tap(0, at === 'close' ? 'close' : at === 'right');
    await realWait(Number(q.get('mid') || 320));
    if (!hold) document.getAnimations().forEach(a => { try { a.pause(); } catch { /* */ } });
    return ready();
  }
  if (at === 'combo4' || at === 'combo10') {
    // the cue + a tap on the NEXT question while it still runs (the cues never block play)
    tap(0, true);
    if (hold) { await wait(470); tap(1, true); }
    return ready();
  }
  if (at !== 'answer') return ready();
  for (let w = 0; w < 60 && !spec(); w++) await wait(100);   // (a bank-backed challenge waits for its bank)
  if (DL) { closeRound(DL.dlResults(game, ci, game.dl[ci])); return ready(); }
  if (type !== 'trivia' && type !== 'truefalse') { await answerOther(spec()); return ready(); }
  // THE ANSWER: play the round (trivia: right, wrong, right · true or false: a miss on the 3rd + the 6th), then the round closes
  const s = spec(), N = s.type === 'trivia' ? 3 : s.type === 'truefalse' ? 8 : 0;
  for (let k = 0; k < N; k++) { tap(k, s.type === 'trivia' ? k !== 1 : k !== 2 && k !== 5); await wait(s.type === 'trivia' ? 1000 : 900); }
  await wait(600);
  const live = { ...boards, [me]: { p: N, ok: s.type === 'trivia' ? 2 : 6, n: N, done: true, doneAt: Date.now() } };
  const res = shapeWin(computeResults(game, live));
  closeRound(res, { combo: { ...game.combo, [me]: { c: 1, m: 4 } } });   // (its real length — the screen counts down from it)
  ready();
})();

// OC2 — THE ANSWER for the other sixteen: this phone's picks (a mix of right + wrong, as the screen would have saved them), the room's
// boards (+ the unsealed guesses for CLOSEST CALL), the results + times, then the round closes
async function answerOther(s) {
  const { savePicks } = await import('/js/games/overclock/answers.js');
  const hlMode = q.get('run') || 'miss', hlRun = hlMode === 'perfect' ? (s.parts || parts) : 6;   // (OC3B: higherlower's run)
  const P = {
    math: () => s.problems.map((p, i) => (i === 1 ? p.ans + 12 : p.ans)),
    pattern: () => s.seqs.map((x, i) => (i ? x.ans - 3 : x.ans)),
    memory: () => [{ at: Math.min(3, s.seq.length - 1), n: (s.seq[Math.min(3, s.seq.length - 1)] + 4) % 9 }],
    oddone: () => s.grids.map((g, i) => (i === 1 ? (g.idx + 2) % (g.size * g.size) : g.idx)),
    count: () => s.items.map((it, i) => (i === 1 ? it.ans + 1 : i === 2 ? it.ans + 2 : it.ans)),
    stroop: () => s.items.map((it, i) => (i === 2 ? it.order.find(c => c !== it.ink) : it.ink)),
    reflex: () => [287, 312, null, 255, 301],
    compass: () => s.rounds.map((R, i) => (i === 2 ? (R.ans + 1) % 4 : R.ans)),
    closest: () => [Math.round(s.answer * 0.86)],
    missinglink: () => [s.puzzles[0].answer, 'STONE'],
    unscramble: () => [[...s.word].reverse().join('')],
    spellcheck: () => s.items.map((it, i) => (i === 1 ? (it.ans + 1) % 4 : i === 3 ? (it.ans + 2) % 4 : it.ans)),
    timeline: () => [tlOrder(false)],
    sortit: () => s.cards.map((c, i) => (i === 2 || i === 7 ? 1 - c.s : i === 10 ? -1 : c.s)),
    higherlower: () => s.pairs.map((P, i) => { const r = P.b.v > P.a.v ? 'up' : 'down'; return i < hlRun ? r : i === hlRun && hlMode === 'miss' ? (r === 'up' ? 'down' : 'up') : null; }).filter((v, i) => v != null || i < hlRun),
  };
  const picks = (P[s.type] || (() => []))();
  if (picks.length) savePicks(game.matchId, ci, picks);
  const n = s.parts || parts;
  const okMe = { memory: 3, rewire: 1.42, reflex: 3.4, closest: 0.86, higherlower: hlRun, timeline: 2, sortit: 8 }[s.type] ?? Math.max(0, n - 1);
  const live = { [me]: { p: n, ok: okMe, n, done: true, doneAt: Date.now() - 4000 } };
  uids.slice(1).forEach((u, i) => { live[u] = { p: n, ok: Math.max(0, n - (i % 3)) - (s.type === 'reflex' ? 0.3 * i : 0), n, done: true, doneAt: Date.now() - 2000 - i * 900 }; });
  if (s.type === 'closest') game.rv = { [ci]: Object.fromEntries(uids.map((u, i) => [u, { g: Math.round(s.answer * [0.86, 1.04, 1.3, 0.7, 1.12, 0.5, 1.6, 0.95][i]) }])) };
  if (s.type === 'higherlower') { uids.forEach((u, i) => { live[u].p = Math.min(n, Math.floor(live[u].ok) + (i % 2)); }); live[me].p = Math.min(n, hlRun + (hlMode === 'miss' ? 1 : 0)); }
  game.playStartAt = Date.now() - 20000;
  const res = shapeWin(computeResults(game, live));
  const tm = Object.fromEntries(uids.map((u, i) => [u, 9000 + i * 2300]));
  closeRound(res, { tm: { [ci]: tm } });
}
/** &win=tie → you + MAYA level on top (a DEAD HEAT) · &win=none → nobody scored; then the round closes like the director closes it */
function shapeWin(res) {
  const w = q.get('win');
  if (w === 'tie' && uids.length > 1) { const top = Math.max(...Object.values(res).map(r => r.pts)); res[uids[0]].pts = top; res[uids[1]].pts = top; }
  if (w === 'none' || q.get('zero') === '1') for (const r of Object.values(res)) r.pts = 0;
  return res;
}
function closeRound(res, extra = {}) {
  const last = ci === total - 1;
  if (last) {
    // THE END: the award chips need streaks + times; &cowin=1 → you + MAYA level at the top (CO-WINNERS)
    extra.combo = Object.fromEntries(uids.map((u, i) => [u, { c: 0, m: [6, 9, 4, 3, 2, 5, 7, 1][i] }]));
    extra.tm = { ...(extra.tm || {}), 0: Object.fromEntries(uids.map((u, i) => [u, 6000 + i * 1500])) };
    if (q.get('zero') === '1') { for (const r of Object.values(game.results[0])) r.pts = 0; for (const u of uids) extra.combo[u] = { c: 0, m: 0 }; }
    if (q.get('cowin') === '1' && uids.length > 1) { res[uids[0]].pts = res[uids[1]].pts = Math.max(...Object.values(res).map(r => r.pts)); game.results[0][uids[0]].pts = game.results[0][uids[1]].pts = 148; }
  }
  setPhase(last ? 'final' : 'standings', last ? FINAL_MS : standingsMs(type));
  if (q.get('ready') === '1') state.live.next = Object.fromEntries(uids.filter((u, i) => i % 3 !== 2).map(u => [u, { at: Date.now() }]));
  step({ results: { ...game.results, [ci]: res }, rw: { ...(game.rw || {}), [ci]: packRoundWin(roundWin(res, uids)) }, ...extra });
}

// the kit's pieces in the OVERDRIVE skin, on the frame's background
async function kitPage() {
  const [{ createNumpad }, { createKeyboard }, { createTach }, { answerFrame }, { h }] = await Promise.all([
    import('/js/games/kit/numpad.js'), import('/js/games/kit/keyboard.js'), import('/js/games/kit/tach.js'), import('/js/games/kit/answer.js'), import('/js/ui/dom.js')]);

  const stage = document.querySelector('.oc-stage');
  view.unmount();
  stage.replaceChildren();
  document.querySelector('.oc-overlay').replaceChildren();
  const box = h('div.ch.pv-kit', { style: { marginTop: 'auto' } });
  stage.append(box);

}
