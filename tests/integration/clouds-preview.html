<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clouds preview</title>
<!-- CITY 2.0 — DT2: THE CLOUDS, every kind in every light, no Firebase (js/screens/harbor/clouds.js#bakeCloud on the real layout
     from js/core/harbor-clouds.js). One phone-sized sky panel per look: ?looks=noon,golden … &cover=0.45 &seed=… &res=2
     SP: &layers=lo,mid,hi (the live cover by height: 0,0,0.6 = cirrus only) &kinds=cirrus,cumulus (only those) &band=1 (the
     tagline's band shown) -->
<style>
  html, body { background: #111; color: #ddd; margin: 0; font: 12px monospace; }
  #m { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; }
  figure { margin: 0; } figcaption { padding: 2px 4px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="m"></div>
<script type="module">
import { bakeCloud } from '/js/screens/harbor/clouds.js';
import { cloudMix, cloudPlan, skyLight } from '/js/core/harbor-clouds.js';
const qs = new URLSearchParams(location.search);
const W = 402, H = 520, box = { W, top: 62, roof: 470, hz: 563, avoid: { y0: 280, y1: 340 } };
const RES = Number(qs.get('res') || 2), SEED = qs.get('seed') || 'pv1';
// the look: the sun (elevation, its place on the screen), the sky's stops, the cover
const LOOKS = {
  morning: { el: 16, sx: 70, sy: 400, cover: 0.35, sky: [[34, 92, 182], [84, 146, 214], [160, 198, 234], [222, 226, 232]] },
  noon: { el: 34, sx: 175, sy: 380, cover: 0.3, sky: [[26, 82, 172], [70, 136, 212], [146, 192, 236], [214, 230, 242]] },
  cloudy: { el: 30, sx: 175, sy: 380, cover: 0.55, sky: [[44, 96, 176], [92, 146, 206], [160, 196, 228], [210, 224, 236]] },
  afternoon: { el: 20, sx: 320, sy: 400, cover: 0.4, sky: [[30, 88, 178], [80, 142, 212], [156, 196, 234], [220, 228, 236]] },
  golden: { el: 4, sx: 330, sy: 440, cover: 0.45, sky: [[58, 52, 118], [138, 92, 146], [236, 148, 122], [255, 196, 140]] },
  sunset: { el: -1.5, sx: 345, sy: 520, cover: 0.45, sky: [[40, 42, 104], [114, 72, 136], [226, 110, 112], [255, 156, 108]] },
  dusk: { el: -4.5, sx: 360, sy: 560, cover: 0.45, sky: [[26, 34, 92], [52, 62, 128], [110, 100, 160], [190, 130, 160]] },
  dawn: { el: 1, sx: 60, sy: 480, cover: 0.45, sky: [[50, 56, 120], [130, 104, 160], [240, 160, 140], [255, 206, 160]] },
  blue: { el: -6.5, sx: 360, sy: 600, cover: 0.45, sky: [[16, 30, 86], [32, 56, 128], [60, 86, 156], [104, 110, 170]] },
  night: { el: -30, cover: 0.45, moon: { x: 160, y: 300, el: 30, illum: 0.8 }, sky: [[8, 8, 24], [16, 14, 42], [34, 22, 66], [60, 34, 92]] },
  party: { el: -30, cover: 0.45, party: 1, sky: [[10, 6, 30], [24, 12, 54], [52, 24, 90], [90, 40, 120]] },
  overcast: { el: 30, sx: 175, sy: 380, cover: 0.95, sky: [[124, 136, 154], [150, 160, 174], [176, 184, 194], [200, 204, 208]] },
};
const pick = (qs.get('looks') || 'morning,noon,cloudy,golden,sunset,dusk,night,party,overcast').split(',');
const PAL = [[255, 63, 176], [63, 224, 255], [166, 91, 255], [255, 204, 90]];
const m = document.getElementById('m');
for (const name of pick) {
  const lk = LOOKS[name]; if (!lk) continue;
  const fig = document.createElement('figure'), cap = document.createElement('figcaption'), cv = document.createElement('canvas');
  const Z = Number(qs.get('z') || 1);
  cv.width = W * RES; cv.height = H * RES; cv.style.width = W * Z + 'px'; cv.style.height = H * Z + 'px';
  fig.append(cap, cv); m.append(fig);
  const c = cv.getContext('2d'); c.scale(RES, RES);
  const g = c.createLinearGradient(0, 0, 0, box.hz);
  lk.sky.forEach((s, i) => g.addColorStop([0, 0.35, 0.75, 1][i], `rgb(${s})`));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (lk.sx != null && lk.el > -1) { const r = c.createRadialGradient(lk.sx, lk.sy, 0, lk.sx, lk.sy, 70); r.addColorStop(0, 'rgba(255,250,235,1)'); r.addColorStop(0.2, 'rgba(255,240,210,0.7)'); r.addColorStop(1, 'rgba(255,240,210,0)'); c.fillStyle = r; c.fillRect(0, 0, W, H); }
  if (lk.moon) { c.fillStyle = '#e8e8f0'; c.beginPath(); c.arc(lk.moon.x, lk.moon.y, 11, 0, 7); c.fill(); }
  const cover = Number(qs.get('cover') || lk.cover);
  // &layers=lo,mid,hi: the live weather's cover by height (e.g. 0,0,0.6 = high cirrus only; 0.3,0,0.9 = cumulus under a veil)
  const ly = qs.get('layers') ? qs.get('layers').split(',').map(Number) : null;
  const L = { cloud: cover, cloudLayers: ly ? { lo: ly[0], mid: ly[1], hi: ly[2] } : null, sun: { el: lk.el }, moon: lk.moon ? { el: lk.moon.el, illum: lk.moon.illum } : { el: -10 }, rain: 0, snow: 0, storm: 0 };
  const M = cloudMix(L, SEED), plan = cloudPlan(box, M, SEED);
  const G = skyLight(L, { sun: lk.sx != null ? { x: lk.sx, y: lk.sy, vis: lk.el > -1 ? 1 : 0 } : null, side: lk.sx != null ? (lk.sx > W / 2 ? 1 : -1) : 0, moon: lk.moon || null, party: lk.party || 0, palette: PAL, horizon: lk.sky[2].map((v, i) => (v + lk.sky[3][i]) / 2), deck: M.deck });
  const t0 = performance.now();
  const only = qs.get('kinds') ? qs.get('kinds').split(',') : null;
  // (the tagline's band, faint: the cirrus keep above it)
  if (qs.get('band')) { c.fillStyle = 'rgba(255,255,255,0.08)'; c.fillRect(0, box.avoid.y0, W, box.avoid.y1 - box.avoid.y0); }
  for (const d of plan) {
    if (only && !only.includes(d.kind)) continue;
    const sp = bakeCloud(d, G, box, d.kind === 'deck' ? 0.6 : RES, SEED);
    c.globalAlpha = 1;
    if (d.kind === 'deck') { c.drawImage(sp, -d.w * 0.3, -2, d.w, d.h); c.drawImage(sp, d.w * 0.7, -2, d.w, d.h); }
    else c.drawImage(sp, d.x0, d.y - d.h, d.w, d.h);
  }
  // a stand-in skyline (the clouds go behind it)
  c.fillStyle = lk.el > 0 ? '#8a8f9e' : '#151228';
  for (let x = 0; x < W; x += 26) { const hh = 40 + ((x * 37) % 90); c.fillRect(x, box.roof - hh + 40, 22, H); }
  cap.textContent = `${name} · cover ${cover} · ${plan.length} clouds (${[...new Set(plan.map(d => d.kind))].join(' ')}) · ${(performance.now() - t0).toFixed(0)} ms`;
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
