<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE PASSWORD preview</title>
<!-- PW1 — the REAL view (js/games/password/view.js) against a LOCAL FAKE JUDGE with fixed test words (never the real list): no Firebase (the
     import map swaps js/firebase.js for fake-firebase.js), no /api. The fake judges with the same pure logic the server uses (logic.js).
       the test words: THE DOOR = CRANE · THE BACK ROOM = LIGHT (&w1= &w2= to change them — any two five-letter words)
       &d1=TRAIN,CRATE        door 1's guesses, in order (door 1 closes by itself on CRANE or the 6th)
       &d2=STORM,FIGHT        door 2's guesses (only once door 1 is open)
       &typed=LIG             letters typed but not sent on the next row
       &refuse=1              a refused word on screen (the row shaking + NOT IN THE LIST)   &short=1   NOT ENOUGH LETTERS
       &end=crack | fail1 | fail2    shortcuts: a clean crack (3 + 2 guesses) · door 1 held · door 2 held — the result card up
       &handoff=1             the hand-off between the doors held on screen
       &look=night | day      body[data-look] (PW2: the DAY look — "C1 clear morning sky"); a tiny DAY / NIGHT toggle at the foot flips it LIVE (&toggle=0 hides it)
       &reveal=1              THE DOOR REVEAL runs (door 1's answer typed + entered once the page is ready)
       &share=1               the rendered SHARE image (1080 × 1350) over the screen — with &end=crack|fail1|fail2 (+ &look=day)
       &corner=0              hides the console's corner buttons (☰ + music, drawn here as the console draws them)
       &still=1               the result card / hand-off WITHOUT their entrance (a rejoin's view)
       window.__password = { run(), typed(), type(w), enter(), back(), state(), resync() } · window.__judge = the fake (its answers, its record)
     e.g. ?d1=TRAIN,CRANE&d2=STORM,FIGHT&typed=LI   = mid door 2 with all three marks on the tiles + the keys -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/kit.css">
<link rel="stylesheet" href="/css/password.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #05040c; } #stage { position: fixed; inset: 0; } .screen { position: absolute; inset: 0; }</style>
</head>
<body data-theme="password">
<div id="stage"><div class="screen screen-in" id="screen"></div></div>
<button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false" id="pv-menu"><span class="mb-bars"><i></i><i></i><i></i></span></button>
<button class="music-btn" type="button" aria-label="Music on — tap to turn it off" aria-pressed="true" id="pv-music"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="nt"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g><path class="slash-bg" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg></button>
<script type="module">
import { createView } from '/js/games/password/view.js';
import { create } from '/js/games/password/daily.js';
import { createRun, serverGuess, runView, recordOf, canGuess, cleanWord } from '/js/games/password/logic.js';

const q = new URLSearchParams(location.search);
if (q.get('corner') === '0') for (const id of ['pv-menu', 'pv-music']) document.getElementById(id).remove();
document.body.dataset.look = q.get('look') === 'day' ? 'day' : 'night';
// PW2 — THE LIVE TOGGLE: a tiny DAY / NIGHT button (the preview's own, never the game's: the console sets body[data-look]); &look=day|night = the start
{ const b = document.createElement('button'); b.id = 'pv-look'; b.type = 'button'; b.textContent = document.body.dataset.look.toUpperCase(); b.style.cssText = 'position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:99;font:700 10px/1 monospace;letter-spacing:.14em;padding:5px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;opacity:.55';
  b.onclick = () => { document.body.dataset.look = document.body.dataset.look === 'day' ? 'night' : 'day'; b.textContent = document.body.dataset.look.toUpperCase(); };
  if (q.get('toggle') !== '0') document.body.append(b); }
const still = q.get('still') === '1';
if (still) { const s = document.createElement('style'); s.textContent = '.pw-play, .pw-endscr, .pw-grid, .pw-dr-leaf, .pw-dr-room, .pw-dr-spill, .pw-flood { transition: none !important; animation: none !important; }'; document.head.append(s); }

// THE FAKE JUDGE: the test words, a local record, the same pure rules the server runs (api/_lib/pw.js) — the real list is never here
const W = [cleanWord(q.get('w1')) || 'CRANE', cleanWord(q.get('w2')) || 'LIGHT'];
const VALID = new Set(await fetch('/data/words/valid-5.json').then(r => r.json()).then(s => s.toUpperCase().match(/.{5}/g)).catch(() => [])); W.forEach(w => VALID.add(w));
const T0 = Date.now() - 1000 * (Number(q.get('t') || 137));
const clock = () => Date.now();
const judge = {
  kind: 'fake', record: null, startedAt: T0, answers: W, score: null,
  async start() { await tick(); const run = runView(this.record, W, { day: '2026-11-07', uid: 'me', startedAt: this.startedAt }); return { startedAt: this.startedAt, done: this.score, run, day: '2026-11-07' }; },
  async guess(word) {
    await tick();
    const g = cleanWord(word);
    if (!g || !VALID.has(g)) throw Object.assign(new Error('Not in the word list.'), { code: 'not_a_word', status: 422 });
    const run = runView(this.record, W, { startedAt: this.startedAt });
    const why = canGuess(run);
    if (why) throw Object.assign(new Error('closed'), { code: why === 'done' ? 'finished' : 'closed', status: 409 });
    const { run: next, resp } = serverGuess(run, g, W, clock());
    this.record = recordOf(next);
    if (resp.done) resp.finishedAt = next.finishedAt;
    return resp;
  },
  async finish() { await tick(); const run = runView(this.record, W, { startedAt: this.startedAt }); if (!run.done) throw Object.assign(new Error('not done'), { code: 'not_done', status: 409 }); const again = this.score != null; this.score = (2 - run.doors.filter(d => d.state === 'solved').length) * 100 + run.doors.reduce((s, d) => s + d.guesses.length, 0); return { score: this.score, again }; },
  canType: w => VALID.has(cleanWord(w) || ''),
};
const tick = () => new Promise(r => setTimeout(r, 30));
window.__judge = judge;

// the scripted state: the fake's record is played forward with the SAME rules (no marks are made up)
const list = k => (q.get(k) || '').split(',').map(cleanWord).filter(Boolean);
let d1 = list('d1'), d2 = list('d2');
const end = q.get('end');
if (end === 'crack') { d1 = ['TRAIN', 'CRATE', W[0]]; d2 = ['STORM', W[1]]; }
if (end === 'fail1') { d1 = ['TRAIN', 'CRATE', 'PLUMB', 'STORK', 'MOUND', 'FIGHT']; d2 = []; }
if (end === 'fail2') { d1 = ['TRAIN', W[0]]; d2 = ['STORM', 'PLUMB', 'STORK', 'MOUND', 'FIGHT', 'CHAIR']; }
{
  let run = createRun({ startedAt: T0 });
  const play = ws => { for (const w of ws) if (!canGuess(run)) run = serverGuess(run, w, W, clock() - 2000).run; };
  play(d1);
  if (run.door === 1 && !run.done) play(d2);
  judge.record = recordOf(run);
}

// mount the real view, as the console would (state.game = the daily's run shell, state.judge = the fake)
const game = create({ date: '2026-11-07', uid: 'me', now: T0, daySet: { v: 1, day: '2026-11-07' } });
const state = { uid: 'me', game, judge, players: { me: { name: 'YOU', color: 'magenta', avatar: 'crown' } }, meta: { status: 'playing' } };
const view = createView();
view.mount(document.getElementById('screen'), state);
// (the typed letters / the refused word / the hand-off, once the view has its run)
const ready = () => new Promise(r => { const t = setInterval(() => { if (window.__password && window.__password.run() && window.__password.run().doors[0].guesses.length === d1.length) { clearInterval(t); r(); } }, 20); });
await ready();
await new Promise(r => setTimeout(r, 60));
if (q.get('typed')) window.__password.type(q.get('typed'));
if (q.get('refuse') === '1') { window.__password.type('QZXWV'); await new Promise(r => setTimeout(r, 40)); window.__password.enter(); }
if (q.get('short') === '1') { window.__password.type('LI'); await new Promise(r => setTimeout(r, 40)); window.__password.enter(); }
// &reveal=1 (PW2 — THE DOOR REVEAL): door 1's last guess is the answer, typed + entered here so the real motion runs (&still=1 freezes it mid-swing)
if (q.get('reveal') === '1' || q.get('handoff') === '1') { window.__password.type(d2.length ? W[1] : W[0]); await new Promise(r => setTimeout(r, 40)); window.__password.enter(); }
// &share=1 (PW2 — THE SHARE CARD): the rendered 1080 × 1350 image over the screen (the look on screen; &look=day for the day card)
if (q.get('share') === '1') { const S = await import('/js/games/password/share.js'); const cv = S.renderShare({ run: window.__password.run(), look: document.body.dataset.look, dayNo: 7 }); cv.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);height:min(96vh, 1350px);width:auto;z-index:98;box-shadow:0 20px 60px rgba(0,0,0,.6);border-radius:8px'; cv.id = 'pv-share'; document.body.append(cv); }
window.__preview = { judge, state, view, words: W };
document.body.dataset.ready = '1';   // (shots.mjs --page waits for this)
</script>
</body>
</html>
