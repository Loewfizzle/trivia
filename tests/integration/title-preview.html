<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Title preview</title>
<link rel="icon" href="data:,">
<!-- The REAL title screen (the city, the sign, THE FLANK, the corner buttons) without Firebase or emulators: tweak its look and
     reload in a second. All the title's own preview switches work: ?when=2026-10-19T22:30&tz=America/Detroit&at=42.96,-85.67
     &wx=rain&force=lightning&speed=60&intro=1. Plus: &guest=1 (no profile), &act=join|rejoin|sun|room (the JOIN panel open, a REJOIN
     pill, the sun behind the music button, a ROOM of &n=4 at the door), &rejoin=MINT. DM2: &daily=waiting|done|off (&of=2 &left=1) the
     DAILY button · &held=1 the RESUME chip · &act=room&mid=2 the host's MID-DAILY line. HOST / JOIN do nothing here (no rooms) — use the app for flows.
     Shots: node shots.mjs "<browser>" --preview --scenes night,day -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/title.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js", "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }</script>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #04050f; } #app { position: fixed; inset: 0; } .screen { position: absolute; inset: 0; }</style>
</head>
<body>
<div id="app"><section class="screen screen-in" id="screen"></section></div>
<script type="module">
const q = new URLSearchParams(location.search);
// a profile for this preview slot (the title reads it for YOU), unless &guest=1
try {
  localStorage.setItem('nd:entered', '1');
  if (q.get('guest') === '1') localStorage.removeItem('na:pv:profile');
  else localStorage.setItem('na:pv:profile', JSON.stringify({ name: 'AVA', color: 'magenta', avatar: 'bolt' }));
} catch { /* fine */ }
if (!q.get('slot')) { q.set('slot', 'pv'); history.replaceState(null, '', `?${q}`); }
const { createTitle, harborReady } = await import('/js/screens/title.js');
await harborReady;
const { installSettingsPanel } = await import('/js/ui/settings-panel.js');
const { installAudio } = await import('/js/audio/engine.js');
installAudio();   // (a tap unlocks it, as in the app: the ambience, the sign's crackle, thunder)
const { state } = await import('/js/store.js');
installSettingsPanel();
const st = { ...state, view: 'title', uid: 'pv', ready: true, rejoin: q.get('rejoin') || '', invite: '' };
// DM2 — THE DAILY BUTTON's states (&daily=waiting|done|off, &left=n of &of=n dailies) + THE ROOM WINS' RESUME chip (&held=1)
if (q.get('daily')) {
  const T = await import('/js/daily/today.js');
  const of = Math.max(1, Number(q.get('of') || 2)), ids = ['password', 'coastclear', 'nightcap', 'four', 'five', 'six'].slice(0, of);
  const left = q.get('daily') === 'done' ? 0 : Math.min(of, Number(q.get('left') || of));
  const mine = Object.fromEntries(ids.slice(0, of - left).map(id => [id, 7]));
  T.setToday(q.get('daily') === 'off' ? { dailies: [] } : { day: 'd20261108', dailies: ids.map((id, i) => ({ id, name: id.toUpperCase(), order: i + 1, ticket: id, better: 'low' })), mine, started: q.get('held') ? { [ids[ids.length - 1]]: true } : {}, friends: {}, table: [] });
  if (q.get('held')) T.holdRun(ids[ids.length - 1], 'd20261108');
}
const title = createTitle();
title.mount(document.getElementById('screen'), st);
window.__preview = { title, state: st };
// the extra looks, once the title has come up
const act = q.get('act');
if (act) {
  const until = () => new Promise(r => { const t = setInterval(() => { if (window.__district && window.__district.phase().done) { clearInterval(t); r(); } }, 100); });
  await until();
  if (act === 'join') window.__district.dock.join(true);
  if (act === 'rejoin') window.__district.dock.preview({ rejoin: q.get('rejoin') || 'MINT' });
  if (act === 'room') {   // (CITY 1.0 OUT: a scripted ROOM over the real city — four players at the door; &n=2..8; pixdiff's room scenes)
    const n = Math.max(2, Math.min(8, Number(q.get('n') || 4))), t0 = Date.now() - 60000, cols = ['magenta', 'cyan', 'yellow', 'green', 'orange', 'violet', 'red', 'blue'], av = ['bolt', 'diamond', 'crown', 'star', 'moon', 'heart', 'wave', 'ghost'];
    const players = {}, presence = {};
    for (let i = 0; i < n; i++) { const u = i ? `pv${i}` : 'pv'; players[u] = { name: i ? `GUEST${i}` : 'AVA', color: cols[i], avatar: av[i], joinedAt: t0 + i * 500, ln: i % 2 ? 'L' : 'R' }; presence[u] = { online: true, lastSeen: Date.now(), v: 2, c: { [`k${i}`]: true } }; }
    Object.assign(st, { code: 'PVRM', meta: { hostId: 'pv', status: 'lobby', createdAt: t0, activeAt: t0 }, players, presence, connected: true, net: 'online' });
    title.update(st);
  }
  if (act === 'sun') { const r = document.querySelector('.music-btn').getBoundingClientRect(); window.__district.dock.sunAt(r.left + r.width * 0.4, r.top + r.height * 0.55); }
}
</script>
</body>
</html>
