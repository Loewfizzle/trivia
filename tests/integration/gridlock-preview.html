<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRIDLOCK preview</title>
<!-- The real GRIDLOCK view without Firebase: a scripted match drives it through placement, aiming, a volley cinematic
     (beams → scars / rings → a sink → a power-down), the bounty, an elimination, spectating — and Part 2: SALVO markers,
     the ARCADE hand, every ability's targeting and cinematic.
     ?n=4&size=8&tier=2&mode=classic|salvo|royale|arcade&at=place|aim|reticle|locked|show|sunk|elim|spec|end
       |markers|hand|armed-sonar|armed-cluster|armed-torpedo|armed-shield|armed-relocate|shield|sonar|torpedo|cluster|relocate|blocked
     &still=1&shot=hit|miss  (window.__gridlock for tests, window.__preview to script more) -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/kit.css">
<link rel="stylesheet" href="/css/gridlock.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #04050f; } #stage { position: fixed; inset: 0; } .screen { position: absolute; inset: 0; } .nd-backdrop { position: fixed; inset: 0; z-index: 0; } .nd-backdrop canvas { width: 100%; height: 100%; object-fit: cover; }</style>
</head>
<body data-theme="gridlock">
<div id="stage"><div class="screen screen-in" id="screen"></div></div>
<script type="module">
import { createView } from '/js/games/gridlock/view.js';
import { randomLayout, fleetFor, boardSize, resolveVolley, applyResolution, cellsOf, SIMUL } from '/js/games/gridlock/logic.js';
import { rngFrom } from '/js/core/rng.js';

const q = new URLSearchParams(location.search);
const n = Math.max(2, Math.min(8, Number(q.get('n') || 2)));
const size = Number(q.get('size') || boardSize(n));
const tier = Number(q.get('tier') ?? 2);
const at = q.get('at') || 'aim';
const still = q.get('still') === '1';
const mode = q.get('mode') || (/^(markers)$/.test(at) ? 'salvo' : /^(hand|armed-|shield|sonar|torpedo|cluster|relocate|blocked)/.test(at) ? 'arcade' : (n > 3 ? 'royale' : 'classic'));
const COLORS = ['cyan', 'magenta', 'yellow', 'green', 'orange', 'violet', 'red', 'blue'];
const NAMES = ['YOU', 'BOB', 'CHARLIE', 'DANA', 'EVE', 'FRANK', 'GRACE', 'HAL'];
const AV = ['crown', 'bolt', 'diamond', 'star', 'skull', 'heart', 'eye', 'ghost'];
const uids = Array.from({ length: n }, (_, i) => `u${i}`);
const me = uids[0];
const players = Object.fromEntries(uids.map((u, i) => [u, { name: NAMES[i], color: COLORS[i], avatar: AV[i], joinedAt: i }]));
const presence = Object.fromEntries(uids.map(u => [u, { online: true, lastSeen: Date.now() }]));
const fleets = Object.fromEntries(uids.map(u => [u, randomLayout(size, fleetFor(size), rngFrom(`pv:${u}`))]));
const now = Date.now();
const game = {
  id: 'gridlock', matchId: 'm1', settings: { mode, placeSec: 60, turnSec: 20 }, mode,
  participants: Object.fromEntries(uids.map(u => [u, true])), names: Object.fromEntries(uids.map((u, i) => [u, NAMES[i]])),
  size, fleet: fleetFor(size), n0: n, order: uids.slice(), phase: 'place', phaseStartAt: now, phaseEndsAt: now + 60000, v: 0, rk: '0', round: 0, ti: -1, cur: null,
  boards: {}, pts: {}, stats: {},
};
if (mode === 'arcade') { game.hand = Object.fromEntries(uids.map(u => [u, ['sonar', 'torpedo', 'shield']])); game.hand[me] = (q.get('hand') || (at.startsWith('armed-') ? ['sonar', at.slice(6), 'double'].filter((a, i, arr) => arr.indexOf(a) === i).slice(0, 3).join(',') : 'sonar,cluster,torpedo')).split(','); game.cardN = Object.fromEntries(uids.map(u => [u, 3])); }
// a little history on every board: some misses, a few hits (not sinking anything yet)
const rnd = rngFrom('pv:history');
for (const u of uids) {
  const b = { cells: {}, sunk: {}, left: game.fleet.reduce((a, c) => a + c, 0) };
  for (let k = 0; k < 5; k++) { const r = Math.floor(rnd() * size), c = Math.floor(rnd() * size); if (fleets[u].some(s => cellsOf(s).some(([a, bb]) => a === r && bb === c))) continue; b.cells[`${r},${c}`] = { by: uids[(uids.indexOf(u) + 1) % n], h: 0 }; }
  const ship = fleets[u][1]; const [r, c] = cellsOf(ship)[0]; b.cells[`${r},${c}`] = { by: uids[(uids.indexOf(u) + 1) % n], h: 1 }; b.left--;
  game.boards[u] = b;
}
const state = { uid: me, code: 'PVW1', players, presence, game, live: { shots: {}, res: {}, ready: {}, calls: {} }, liveKey: null };
import('/js/games/registry.js').then(m => { state.liveKey = m.liveKeyFor(game); push(); });

const view = createView();
const screen = document.getElementById('screen');
let mounted = false;
function push() { if (!mounted) { view.mount(screen, state); mounted = true; } else view.update({ ...state, game: { ...state.game } }); }
push();
setTimeout(() => { window.__gridlock.setTier(tier); window.__gridlock.place(fleets[me]); }, 50);

const step = (patch) => { Object.assign(game, patch); push(); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const G = window.__gridlock;
/** One volley resolved locally like the targets' phones would. shots: { by: [{t,r,c}|{t,k:'torpedo',...}] }, acts: { uid: act } */
function volley({ shots = {}, acts = null, elim = false } = {}) {
  const targets = [...new Set(Object.values(shots).flat().map(s => s.t))];
  const events = [];
  const boards = { ...game.boards };
  for (const [u, a] of Object.entries(acts || {})) { if (a.a === 'shield') events.push({ k: 'shield', t: u, r: a.r, c: a.c }); else if (a.a === 'relocate') events.push({ k: 'relocate', t: u }); }
  for (const [u, a] of Object.entries(acts || {})) if (a.a === 'sonar') events.push({ k: 'sonar', by: u, t: a.t, r: a.r, c: a.c });
  const out = { ...(game.out || {}) };
  for (const t of targets) {
    const mine = {};
    for (const [by, list] of Object.entries(shots)) { const l = list.filter(s => s.t === t); if (l.length) mine[by] = l; }
    const sh = acts && acts[t] && acts[t].a === 'shield' ? { r: acts[t].r, c: acts[t].c } : null;
    const res = resolveVolley(fleets[t], game.boards[t], mine, sh, size);
    const { board, events: ev } = applyResolution(game, t, shots, res);
    boards[t] = board; events.push(...ev);
    if (elim && t !== me) { board.left = 0; events.push({ k: 'elim', t, by: Object.keys(mine) }); out[t] = { at: Date.now(), place: n, rem: n - 1, by: Object.keys(mine) }; }
  }
  const t0 = Date.now();
  step({ phase: 'show', fire: shots, acts, ev: events, boards, phaseStartAt: t0, phaseEndsAt: t0 + 9000, out: Object.keys(out).length ? out : undefined });
}
const shipCell = (t, i, k = 0) => { const [r, c] = cellsOf(fleets[t][i])[k]; return { t, r, c }; };
const freeCell = t => { let r, c; do { r = Math.floor(rnd() * size); c = Math.floor(rnd() * size); } while (fleets[t].some(s => cellsOf(s).some(([a, b]) => a === r && b === c)) || game.boards[t].cells[`${r},${c}`]); return { t, r, c }; };
const sinkShots = (by, t, i) => cellsOf(fleets[t][i]).map(([r, c]) => ({ t, r, c })).filter(s => !(game.boards[t].cells[`${s.r},${s.c}`] || {}).h);
window.__preview = { game, state, step, volley, fleets, uids, shipCell, freeCell, sinkShots };

(async () => {
  await wait(120);
  if (at === 'place') return;
  const t1 = Date.now();
  step({ phase: SIMUL(mode) ? 'aim' : 'turn', cur: me, v: 1, rk: '1', round: 1, phaseStartAt: t1, phaseEndsAt: t1 + (mode === 'salvo' ? 30000 : 20000) });
  await wait(120);
  const BOB = uids[1];
  if (at === 'aim' || at === 'hand') return;
  if (at === 'reticle') { G.aim(BOB, 2, 3); return; }
  if (at === 'markers') { G.aim(BOB, 2, 3); G.aim(BOB, 5, 6); G.aim(BOB, 7, 1); if (uids[2]) G.aim(uids[2], 1, 1); return; }
  if (at.startsWith('armed-')) {
    const a = at.slice(6);
    G.arm(a);
    await wait(60);
    if (a === 'sonar' || a === 'cluster') G.aim(BOB, 3, 4);
    if (a === 'torpedo') G.aim(BOB, 4, 1);
    if (a === 'shield') G.aim(null, 2, 2);
    if (a === 'relocate') { const s = fleets[me][2]; G.reloc(2, { ...s, d: s.d ? 0 : 1 }); }
    return;
  }
  if (at === 'locked') { state.live.shots = { [me]: { ts: { [BOB]: true }, x: 'x' }, [uids[2] || BOB]: { ts: { [me]: true }, x: 'x' }, ...(uids[3] ? { [uids[3]]: { ts: { [me]: true }, x: 'x' } } : {}) }; G.aim(BOB, 2, 3); G.fire(); push(); return; }
  G.aim(BOB, 2, 3); G.fire();
  await wait(300);
  const hit = q.get('shot') !== 'miss';
  if (at === 'show') { volley({ shots: { [me]: [hit ? shipCell(BOB, 0) : freeCell(BOB)] } }); return; }
  if (at === 'sunk') { volley({ shots: { [me]: sinkShots(me, BOB, 1) } }); return; }
  if (at === 'elim') { volley({ shots: { [me]: sinkShots(me, BOB, 1) }, elim: true }); return; }
  if (at === 'shield' || at === 'blocked') { volley({ shots: { [BOB]: [{ t: me, r: 1, c: 1 }, { t: me, r: 4, c: 4 }], [me]: [shipCell(BOB, 0)] }, acts: { [me]: { a: 'shield', r: 0, c: 0 } } }); return; }
  if (at === 'sonar') { volley({ shots: { [BOB]: [freeCell(me)] }, acts: { [me]: { a: 'sonar', t: BOB, r: 2, c: 2 } } }); setTimeout(() => { const ev = document.createEvent('Event'); void ev; }, 0); return; }
  if (at === 'torpedo') { const [r] = cellsOf(fleets[BOB][0])[0]; volley({ shots: { [me]: [{ t: BOB, k: 'torpedo', axis: 0, idx: r, dir: 1 }] }, acts: { [me]: { a: 'torpedo', t: BOB, axis: 0, idx: r, dir: 1 } } }); return; }
  if (at === 'cluster') { const [r, c] = cellsOf(fleets[BOB][0])[0]; const rr = Math.min(size - 2, r), cc = Math.min(size - 2, c); volley({ shots: { [me]: [[rr, cc], [rr, cc + 1], [rr + 1, cc], [rr + 1, cc + 1]].map(([a, b]) => ({ t: BOB, r: a, c: b, k: 'cluster' })) }, acts: { [me]: { a: 'cluster', t: BOB, r: rr, c: cc } } }); return; }
  if (at === 'relocate') { volley({ shots: { [BOB]: [freeCell(me)] }, acts: { [BOB]: { a: 'relocate' } } }); return; }
  if (at === 'spec') { volley({ shots: { [BOB]: sinkShots(BOB, me, 1) } }); await wait(6000); const t2 = Date.now(); step({ phase: SIMUL(mode) ? 'aim' : 'turn', cur: BOB, v: 2, rk: '2', round: 2, fire: null, acts: null, phaseStartAt: t2, phaseEndsAt: t2 + 20000, bounty: BOB, out: { [me]: { at: t2, place: n, rem: n - 1, by: [BOB] } } }); return; }
  if (at === 'end') { volley({ shots: { [me]: sinkShots(me, BOB, 1) }, elim: true }); await wait(6000); step({ phase: 'end', winner: me, done: true, phaseStartAt: Date.now(), phaseEndsAt: Date.now() + 4500 }); return; }
  if (still) return;
  // a loop of volleys: me → BOB, BOB → me, with hits, misses, now and then a sink
  let k = 0;
  for (;;) {
    const mine = k % 2 === 0;
    const by = mine ? me : BOB, tg = mine ? BOB : me;
    volley({ shots: { [by]: k % 5 === 4 ? sinkShots(by, tg, 1) : [k % 3 === 2 ? freeCell(tg) : shipCell(tg, 0, k % 3)] } });
    await wait(6000);
    const t = Date.now();
    step({ phase: SIMUL(mode) ? 'aim' : 'turn', cur: mine ? BOB : me, v: k + 2, rk: String(k + 2), round: k + 2, fire: null, acts: null, phaseStartAt: t, phaseEndsAt: t + 20000, bounty: n > 2 ? BOB : null });
    await wait(1800);
    if (!mine) { G.aim(BOB, Math.floor(rnd() * size), Math.floor(rnd() * size)); await wait(800); G.fire(); await wait(400); }
    k++;
  }
})();
</script>
</body>
</html>
