<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FREEFALL end screen preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/board.css">
<link rel="stylesheet" href="/css/vault.css">
<link rel="stylesheet" href="/css/freefall-play.css">
<style>html, body { margin: 0; background: #07040f; } .ff-stage { position: relative; height: 100dvh; overflow: hidden; --ff-w: min(100vw, 560px); }</style>
<script>
  // F5B — THE END SCREENS' LOOK PREVIEW (no server: the board's read + YOUR TABLE answered here from a fixture; NEVER the live site):
  //   ?mode=solo|match · &case=top|out|empty (solo: you in the top 3 · 12th · no rows) · &fr=1 (the FRIENDS tick on) · &n=5 (a match's
  //   players; you are the n-th) · &look=night|day · &made=1 (YOU HIT THE BOTTOM) · &best=1 (a NEW BEST)
  const Q = new URLSearchParams(location.search), CASE = Q.get('case') || 'out';
  const face = (id, n, c, a, v, av, rank) => ({ id, n, a, c, l: 12 + rank, rank, v, ...(av === undefined ? {} : { av }) });
  const WORLD = CASE === 'empty' ? [] : [face('b1', 'MAXIMILIANOS', 'green', 'ghost', 212, 141, 1), face('b2', 'DEX', 'cyan', 'bolt', 188, 120, 2),
    CASE === 'top' ? face('bme', 'BENNY', 'magenta', 'crown', 160, 88, 3) : face('b3', 'LUNA', 'yellow', 'moon', 171, null, 3),
    ...Array.from({ length: 8 }, (_, i) => face(`bx${i}`, `PLAYER ${i + 4}`, 'violet', 'star', 150 - i * 6, 80, 4 + i)),
    ...(CASE === 'top' ? [] : [face('bme', 'BENNY', 'magenta', 'crown', 88, 61, 12)])];
  const TABLE = [{ n: 'DEX', a: 'bolt', c: 'cyan', v: 188, av: 120 }, { n: 'BENNY', a: 'crown', c: 'magenta', v: 88, av: 61, me: true }, { n: 'OPAL', a: 'heart', c: 'red', v: 54, av: null }];
  try { sessionStorage.setItem('na:slot', 'ffp'); localStorage.setItem('na:ffp:me', JSON.stringify({ pid: 'pmeeeeeeeeee', profile: { bid: 'bme', n: 'BENNY', a: 'crown', c: 'magenta', x: 2400 } })); localStorage.setItem('ns:endb:fr', Q.get('fr') ? '1' : '0'); } catch { /* fine */ }
  const realFetch = window.fetch.bind(window), json = d => new Response(JSON.stringify(d), { status: 200, headers: { 'content-type': 'application/json' } });
  window.fetch = (u, o) => { const url = String((u && u.url) || u); if (url.includes('/api/board')) return Promise.resolve(json({ b: 'freefall-solo', p: 'all', rows: WORLD })); if (url.includes('/api/profile')) return Promise.resolve(json({ rows: TABLE })); return realFetch(u, o); };
</script>
</head>
<body>
<div class="ff-stage" id="stage"></div>
<script type="module">
  import { setState } from '/js/store.js';
  import { createFinal } from '/js/ui/final.js';
  import { loadGame } from '/js/games/registry.js';
  import { endLogo } from '/js/games/freefall/endscreen.js';
  import { installEmblems } from '/js/ui/emblems.js';
  import { h } from '/js/ui/dom.js';
  const Q = new URLSearchParams(location.search), match = Q.get('mode') === 'match', look = Q.get('look') === 'day' ? 'day' : 'night';
  const stage = document.getElementById('stage'); stage.dataset.look = look; document.body.dataset.look = look;
  installEmblems();
  await loadGame('freefall');
  try { localStorage.setItem('ff:best', '160'); } catch { /* fine */ }   // (YOUR BEST as this phone knows it)
  const N = match ? Math.max(2, Math.min(8, Number(Q.get('n')) || 5)) : 1, made = !!Q.get('made');
  const NAMES = [['me', 'BENNY', 'magenta', 'crown'], ['u2', 'DEX', 'cyan', 'bolt'], ['u3', 'LUNA', 'yellow', 'moon'], ['u4', 'MAXIMILIANOS', 'green', 'ghost'], ['u5', 'ZED', 'orange', 'star'], ['u6', 'KIT', 'violet', 'heart'], ['u7', 'OPAL', 'red', 'diamond'], ['u8', 'WREN', 'cyan', 'bolt']];
  const players = Object.fromEntries(NAMES.slice(0, N).map(([u, name, color, avatar]) => [u, { name, color, avatar }]));
  // (a match: you are the LAST — the YOU line from 4th down; solo: your run)
  const order = match ? [...Object.keys(players).filter(u => u !== 'me'), 'me'] : ['me'];
  const results = Object.fromEntries(order.map((u, i) => [u, { f: made && i === 0 ? 200 : Math.max(3, 140 - i * 23), t: 4000 + i * 300, w: made && i === 0 ? 'made' : i % 2 ? 'dark' : 'red', bl: i % 3, b: 9, br: 4, go: 1 }]));
  if (!match && made) results.me = { f: 200, w: 'made', t: 5000, bl: 3 };
  const game = { id: 'freefall', matchId: 'mprev', mode: match ? 'match' : 'solo', phase: 'final', participants: Object.fromEntries(Object.keys(players).map(u => [u, true])), results };
  setState({ code: 'ABCD', uid: 'me', players, rv: {}, meta: { hostId: 'me', status: 'playing' }, game });
  globalThis.__nsPlayNow = { isSolo: () => !match, again: () => false, leave: () => false };
  const rows = order.map((u, i) => ({ uid: u, rank: i + 1, score: results[u].f }));
  const final = createFinal({ game, rows, players, me: 'me', presence: {}, kicker: match ? 'FREEFALL · MATCH' : 'FREEFALL · SOLO', mode: match ? 'MATCH' : 'SOLO', scoreLabel: 'FLOORS', winnerLine: nm => `${nm} FELL THE DEEPEST` });
  const kick = final.el.querySelector('.sheet-kicker');
  if (kick) { kick.classList.add('ff-kick'); kick.replaceChildren(endLogo(match ? 'match' : 'solo')); }
  stage.append(h('div.ff-final', final.el));
  const logoIn = () => { const im = stage.querySelector('.ff-ec-logo-img'); return !im || (im.complete && im.naturalWidth > 0); };
  setTimeout(function wait() { if (logoIn()) document.body.dataset.ready = '1'; else setTimeout(wait, 200); }, 3200);   // (shots.mjs --page: the strips, the fonts + the logo are in)
  window.__ffEnd = () => { const f = stage.querySelector('.final'); return { scroll: f.scrollHeight - f.clientHeight, rows: stage.querySelectorAll('.eb-list li').length, you: (stage.querySelector('.eb-you') || {}).textContent || '', k: (stage.querySelector('.eb-k') || {}).textContent || '' }; };
</script>
</body>
</html>
