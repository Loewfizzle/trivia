<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fauna preview</title>
<!-- CITY 2.0 — 8b1: THE WILDLIFE's animals, no Firebase (js/screens/harbor/fauna.js on a plain ground). Each row: one animal at 8
     headings (right · 3/4 away-right · away · 3/4 away-left · left · 3/4 toward-left · toward · 3/4 toward-right) or its poses + motion
     frames; the last column of each row at the PHONE's size (scale 1). ?light=day|night|gold &scale=3 (× the phone's size at z 46)
     &only=pigeon,gull,… . node shots.mjs "<browser>" --page "tests/integration/fauna-preview.html?light=night" -->
<style>
  html, body { background: #111; color: #ddd; margin: 0; font: 11px monospace; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { drawBird, drawDuck, drawOwl, drawHeron, drawQuad, drawTrashCan, drawPiling, drawJump } from '/js/screens/harbor/fauna.js';
const qs = new URLSearchParams(location.search);
const ONLY = (qs.get('only') || '').split(',').filter(Boolean), show = k => !ONLY.length || ONLY.includes(k);
const LIGHT = qs.get('light') || 'day', SCALE = Number(qs.get('scale') || 3);
const T = LIGHT === 'night' ? { night: 1, sunDir: 0 } : LIGHT === 'gold' ? { gold: 1, sunDir: -0.6, sunEl: 8 } : { day: 1, sunDir: -0.5, sunEl: 34 };
const dark = LIGHT === 'night' ? 1 : 0;
const ROW = 46 * SCALE, rows = ['pigeon', 'pigeon-poses', 'pigeon-fly', 'gull', 'gull-land', 'owl', 'heron', 'duck', 'coyote', 'raccoon', 'cat', 'squirrel', 'can'].filter(show);
const W = 402 * SCALE / 2 * 2, H = 30 + rows.length * (ROW + 20), dpr = window.devicePixelRatio || 1, cv = document.getElementById('c');
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const c = cv.getContext('2d'); c.scale(dpr, dpr);
c.fillStyle = dark ? '#3a3650' : LIGHT === 'gold' ? '#b08870' : '#9a948c'; c.fillRect(0, 0, W, H);
const z = 46, camAt = (k, gy) => ({ F: 600 * k, VPX: 0, VPY: gy - 600 * k * 13.2 / z, CAMH: 13.2, W, H });
const env = { t: 1.3, mo: true, T, dark, lightAt: dark ? () => [200, 150, 90] : null, rimSide: () => 1, shadow: dark ? null : h => ({ dx: 0.45 * h, dz: 0.3 * h, a: 0.25 }) };
const label = (s, x, y) => { c.fillStyle = dark ? '#ccc' : '#222'; c.fillText(s, x, y); };
const HD = i => i * Math.PI / 4;
let y = 20;
for (const row of rows) {
  label(row, 4, y + 10);
  const gy = y + ROW - 6, cam = camAt(SCALE, gy), cam1 = camAt(1, gy), X = sx => sx * z / cam.F, X1 = sx => sx * z / cam1.F;
  const cols = 8, cw = (W - 70) / cols;
  for (let i = 0; i < cols; i++) {
    const sx = 30 + cw * (i + 0.5), x = X(sx), hd = HD(i), seed = 3 + i * 7;
    if (row === 'pigeon') drawBird(c, cam, { kind: 'pigeon', x, y: 0, z, hd, pose: i % 2 ? 'walk' : 'stand', step: 0.25, seed }, env);
    if (row === 'pigeon-poses') drawBird(c, cam, { kind: 'pigeon', x, y: 0, z, hd: i < 4 ? 0 : -Math.PI / 2 - 0.5, pose: ['peck', 'look', 'sleep', 'huddle', 'stand', 'peck', 'walk', 'stand'][i], peck: i === 5 ? 0.5 : 1, turn: i === 1 ? 0.8 : 0, step: 0.6, seed }, env);
    if (row === 'pigeon-fly') drawBird(c, cam, { kind: 'pigeon', x, y: 0.6, z, hd: i < 4 ? 0.2 : -2.4, pose: 'fly', flap: i * 0.8, spread: 1, legs: i === 7 ? 1 : 0, pitch: i === 7 ? 0.5 : 0.05, seed, ground: 0 }, env);
    if (row === 'gull') drawBird(c, cam, { kind: 'gull', x, y: 0, z, hd, pose: 'stand', seed }, env);
    if (row === 'gull-land') drawBird(c, cam, { kind: 'gull', x, y: 0.5, z, hd: i < 4 ? 0.3 : -0.6, pose: i < 6 ? 'land' : 'takeoff', flap: i * 0.9, spread: i === 5 ? 0.4 : 1, legs: Math.min(1, i / 4), pitch: 0.1 + i * 0.07, seed, ground: 0 }, env);
    if (row === 'owl') drawOwl(c, cam, { x, y: 0, z, hd: -Math.PI / 2, turn: (i - 3.5) * 0.4, blink: i === 6 ? 1 : 0, eyes: i === 7 ? 1 : 0, fly: i === 5 ? 1 : 0, flap: 0.3 }, env);
    if (row === 'heron') drawHeron(c, cam, i < 6 ? { x, y: 0, z, hd: hd - Math.PI / 2, pose: 'stand', strike: i === 5 ? 1 : i === 4 ? 0.5 : 0 } : { x, y: 1.2, z, hd: i === 6 ? 0 : 3, pose: 'fly', flap: 1.2, spread: 1 }, env);
    if (row === 'duck') drawDuck(c, cam, { x, z, hd, step: 0.3, moving: true, drake: i % 2 === 0 }, env);
    if (row === 'coyote' || row === 'raccoon' || row === 'cat' || row === 'squirrel') {
      const poses = { coyote: ['trot', 'trot', 'trot', 'trot', 'trot', 'stand', 'stand', 'stand'], raccoon: ['trot', 'trot', 'trot', 'trot', 'rear', 'rummage', 'stand', 'trot'], cat: ['trot', 'trot', 'trot', 'sit', 'lick', 'crouch', 'pounce', 'trot'], squirrel: ['trot', 'trot', 'trot', 'trot', 'sitUp', 'stand', 'climb', 'climb'] }[row];
      const p = poses[i];
      drawQuad(c, cam, { kind: row, x, y: p === 'climb' ? 0.3 : 0, z, hd: p === 'trot' ? hd * 2 : row === 'raccoon' && (p === 'rear' || p === 'rummage') ? 0 : -Math.PI / 2 + 0.4, pose: p, gait: 0.3 + i * 0.1, moving: p === 'trot' || p === 'crouch' ? 1 : 0, eyes: row === 'coyote' && i >= 6 && dark ? 1 : 0, turn: row === 'coyote' && i === 6 ? 0.8 : 0, headUp: row === 'coyote' && i === 7 ? 1 : 0, dir: i === 7 ? -1 : 1, tailFlick: 0.4 }, env);
    }
    if (row === 'can') drawTrashCan(c, cam, { x, z, h: 0.98, r: 0.3, lid: i < 4 ? 'on' : 'askew' }, env);
  }
  // the phone's size (scale 1) at the right
  const sx1 = W - 30, x1 = X1(sx1);
  if (row.startsWith('pigeon')) drawBird(c, cam1, { kind: 'pigeon', x: x1, y: 0, z, hd: 0.3, pose: 'stand', seed: 3 }, env);
  if (row.startsWith('gull')) drawBird(c, cam1, { kind: 'gull', x: x1, y: 0, z, hd: 0.3, pose: 'stand', seed: 3 }, env);
  if (row === 'owl') drawOwl(c, cam1, { x: x1, y: 0, z, hd: -Math.PI / 2 }, env);
  if (row === 'heron') drawHeron(c, cam1, { x: x1, y: 0, z, hd: -2, pose: 'stand' }, env);
  if (row === 'duck') drawDuck(c, cam1, { x: x1, z, hd: 0.3, step: 0.3, moving: true, drake: true }, env);
  if (['coyote', 'raccoon', 'cat', 'squirrel'].includes(row)) drawQuad(c, cam1, { kind: row, x: x1, y: 0, z, hd: 0.3, pose: 'trot', gait: 0.3, moving: 1 }, env);
  if (row === 'can') drawTrashCan(c, cam1, { x: x1, z, h: 0.98, r: 0.3, lid: 'on' }, env);
  y += ROW + 20;
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
