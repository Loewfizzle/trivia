<!doctype html>
<!-- PRISM DROP preview (no Firebase) — PD-1: the REAL view (js/games/prism/view.js) mounted with a scripted state through the fake database, so a
     shot is exactly the phone's screen: THE MAX BOARD, HOLD / NEXT in its corners, THE SLIM RAIL, THE SLAM BUTTON, the corner pair, the podium body.
       &n=1..7            opponents on the rail (default 5)
       &state=play | count | ko | duel | final | spec      (default play)
       &rush=1            SCORE RUSH            &scheme=buttons     THE BUTTONS scheme        &slam=left    the mirrored rail + SLAM
       &world=aurora|city|nebula|crystal|sunset            the first song is one in that world
       &bot=1             a bot plays your board (frame timing: window.__prism.fps())     &stack=8   pieces dropped before the shot
       &under=1           no bot: the new piece waits at the top, under NEXT (the panel fades)
       &st=47&sb=34       the safe areas (pt) — an iPhone 13/14 = 47 / 34, a 15/16 Pro = 62 / 34, a Pro Max = 59 / 34
       &tier=0..2         the quality tier       &down=1   SLAM held down (the press)       &hit=1   the first tile's hit flash
     PD-2:
       &mode=survival     SURVIVAL (&t=ms of play, default 75 s — the rows already risen)         &solo=1   a room of one
       &state=kocard      your KO card (you just topped out)     &state=ko  Call the Winner     &state=spec  spectating (n=2 → DUEL SOON)
       &inc=1|3|6         incoming junk as RISING GHOST ROWS (6 = 4 from DANA + 2 from EVE) &rise=fresh|mid|hot (default mid)
       &shatter=2         a clear cancels 2 of them (the shatter + BLOCKED!)
       &callout=send|blocked|twist|b2b|ko|pc       one callout          &fresh=1&tip=1   the first BATTLE's tip at GO
       &after=ms          wait this long after the setup before data-ready (a shot mid-effect)
     PD-3 — THE NIGHT LOOK:
       &reduced=1         Settings → Reduced effects (every effect toned right down)
       &look=day|night    THE GAME LOOK (default night = NEON; day = the glass placeholder until PD-4)
       &fx=slam|clear1|clear2|clear3|clear4|combo|pc   that effect on a LOOP (watch it live on a phone — every ~1.5 s)
       &heavy=1           the speed run's worst moment, on a loop: a 4-line clear every 650 ms (the combo climbing) + six ghost rows + the bot
       (the effects themselves are fired from prism-shots.mjs: window.__prism.fire('slam' | 'clear', { lines, combo, pc }) + __prism.freeze(ms))
     PD-4 — THE DAY LOOK (&look=day = THE CRAYON LOOK):
       &paper=notepad|graph|construction|coloring   the page the host dealt (default: the seed's)
       (the &fx loops + &inc + &shatter + &callout + every &state work by day too)
     PD-5A — THE SOUND:
       &set=day|night     the room's SONG SET (the host's look picked it; default night) — any look can play either set
       &song=prismd1…5 | prism1…5    that song first (a day id → the day set)
       &beat=1            THE BEAT CHECK: a big flash on every beat of the song AS HEARD (the downbeat brightest) + a readout — tap once
                          for the sound, then judge the sync BY EAR (the flash must land on the kick / the snare you hear). The song starts
                          near its top (its cue-in for a day song); &at=s puts it s seconds into the song
     prism-shots.mjs shoots it; Used for the look review + the frame timing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism preview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/kit.css">
<link rel="stylesheet" href="../../css/board.css">
<link rel="stylesheet" href="../../css/prism.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { background: #000; height: 100%; margin: 0; overflow: hidden; }</style>
</head>
<body data-theme="prism">
<div class="screen screen-in" id="app"></div>
<script type="module">
import * as E from '/js/games/prism/engine.js';
import { chooseMove } from '/js/games/prism/bot.js';
import { createGame } from '/js/games/prism/director.js';
import { slotOf, setOfSong } from '/js/games/prism/logic.js';
import { loadManifest } from '/js/games/prism/songs.js';
import { rngFrom } from '/js/core/rng.js';
import { loadGame, liveKeyFor } from '/js/games/registry.js';
import { updateSettings } from '/js/audio/settings.js';
import { setState } from '/js/store.js';
import { installEmblems } from '/js/ui/emblems.js';

const q = new URLSearchParams(location.search);
const ROOT = document.documentElement;
document.body.dataset.look = q.get('look') === 'day' ? 'day' : 'night';   // (PD-3: as app.js#paintLook sets it during a match)
if (q.has('st')) ROOT.style.setProperty('--safe-t', `${q.get('st')}px`);
if (q.has('sb')) ROOT.style.setProperty('--safe-b', `${q.get('sb')}px`);
updateSettings({ prismScheme: q.get('scheme') === 'buttons' ? 'buttons' : 'gesture', prismSlam: q.get('slam') === 'left' ? 'left' : 'right', prismBtn: 0.5, reducedFx: q.get('reduced') === '1' });   // (PD-3: &reduced=1 = Settings → Reduced effects)
installEmblems();
// the shared corner pair, as the app draws it (☰ top-left, the music top-right)
document.body.classList.add('pd-on');
document.body.insertAdjacentHTML('beforeend', '<button class="menu-btn" type="button" aria-label="Menu"><span class="mb-bars"><i></i><i></i><i></i></span></button><button class="music-btn" type="button" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="nt"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g><path class="slash-bg" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg></button>');

const mode = q.get('mode') || (q.get('rush') === '1' ? 'rush' : 'battle');
const show = q.get('state') || 'play';
const SOLO = q.get('solo') === '1';
const N = SOLO ? 0 : Math.max(1, Math.min(7, Number(q.get('n') || 5)));
const NAMES = ['AVA', 'BOBBY', 'CHARLIE', 'DANA', 'EVE', 'FINN', 'MAXIMILIANOS', 'ZOE'];
const COLORS = ['magenta', 'cyan', 'yellow', 'green', 'orange', 'violet', 'red', 'blue'];
const AV = ['bolt', 'eye', 'crown', 'ghost', 'star', 'heart', 'diamond', 'moon'];
const uids = Array.from({ length: N + 1 }, (_, i) => `u${i}`);
const me = uids[0];
const players = Object.fromEntries(uids.map((u, i) => [u, { name: NAMES[i], color: COLORS[i], avatar: AV[i], joinedAt: i }]));
const presence = Object.fromEntries(uids.map(u => [u, { online: true, lastSeen: Date.now() }]));
const participants = Object.fromEntries(uids.map(u => [u, true]));

const songs = await loadManifest();
// (PD-5A) the room's SET: &set=day|night, or the set of the &song asked for
const SET = q.get('set') === 'day' || /^prismd/.test(q.get('song') || '') ? 'day' : 'night';
const setSongs = songs.filter(s => setOfSong(s) === SET);
const pick = setSongs.find(s => s.id === q.get('song')) || setSongs.find(s => s.world === q.get('world')) || setSongs[0];
const list = [pick.id, ...setSongs.filter(s => s.id !== pick.id).map(s => s.id)].slice(0, mode === 'rush' ? 1 : 5);
const slots = list.map(id => slotOf(songs.find(s => s.id === id), SET));
const sd = slots.map(x => x.sd);
const cu = SET === 'day' ? slots.map(x => x.cu) : null;
const ff = SET === 'day' ? slots.map(x => x.ff) : null;
const now = Date.now();
const count = show === 'count';
const fresh = q.get('fresh') === '1';
const BEAT = q.get('beat') === '1';
const played = mode === 'survival' ? Number(q.get('t') || 75_000) : fresh ? 1200 : 16_000;
// (&beat=1: the song near its top — &at=s into it — so the whole song can be checked from the start)
const songStartAt = BEAT ? now - Number(q.get('at') || 1) * 1000 : count ? now - 1200 : now - played - 8000;
const playStartAt = count ? now + 3400 : now - played;
const game = { ...createGame({ matchId: 'pvw', settings: { mode }, participants, now, seed: q.get('seed') || 'preview', songs: list, sd, pl0: 0, songStartAt, playStartAt, endAt: mode === 'rush' ? now + 140_000 : null, set: SET, cu, ff }), phase: count ? 'count' : 'play', names: Object.fromEntries(uids.map((u, i) => [u, NAMES[i]])) };
game.out = {}; game.bd = {}; game.ko = {};
// (PD-4) the page the host dealt: &paper=notepad|graph|construction|coloring (default: the seed's — as a game from before the deal)
{ const P = ['notepad', 'graph', 'construction', 'coloring'].indexOf(q.get('paper')); if (P >= 0) game.pp = P; }
// the others' boards: a believable mid-game stack each (the engine + the bot), one in danger, one KO'd (battle)
const boards = {};
uids.slice(1).forEach((u, i) => {
  const o = E.createEngine({ seed: 'preview', mode });
  E.start(o);
  const r = rngFrom(u);
  for (let k = 0; k < 5 + i * 4 && o.cur; k++) { const m = chooseMove(o, { skill: 0.5, rnd: r }); if (m) { while (o.cur && o.cur.r !== m.r) if (!E.rotate(o, 1)) break; while (o.cur && o.cur.x !== m.x) if (!E.move(o, Math.sign(m.x - o.cur.x))) break; } E.hardDrop(o); }
  if (i === 2) E.insertJunk(o, 6, 3);
  boards[u] = { b: E.boardString(o), h: E.stackHeight(o), p: o.cur ? `${o.cur.t},${o.cur.r},${o.cur.x},${o.cur.y}` : '', st: 'play', sc: 4000 + ((i * 7919) % 9000), tg: i === 1 ? me : '' };
});
if (mode === 'battle' && N >= 4) { game.out[uids[N]] = { place: N + 1, by: uids[1], at: now - 30_000 }; boards[uids[N]].st = 'out'; game.ko[uids[1]] = 1; game.bd[uids[1]] = 1; }
if (show === 'duel') {
  uids.slice(2).forEach((u, i) => { game.out[u] = { place: N + 1 - i, by: uids[1], at: now - 20_000 - i * 1000 }; boards[u].st = 'out'; });
  game.duelAt = now - 4000;
}
if (show === 'ko' || show === 'spec') {
  const left = uids.slice(1).filter(u => !game.out[u]).length;
  game.out[me] = { place: left + 1, by: mode === 'battle' ? uids[1] : null, at: now - (show === 'spec' ? 20_000 : 500), rem: left };
  boards[me] = { st: 'out', b: '1'.repeat(10) + '0123456789'.repeat(12), h: 14 };
  if (mode === 'battle') game.ko[uids[1]] = (game.ko[uids[1]] || 0) + 1;
}
// (PD-2: a leader in danger while spectating — the second board high)
if (show === 'spec' && boards[uids[2]]) { const o = E.createEngine({ seed: 'danger', mode }); E.insertJunk(o, 15, 4); boards[uids[2]] = { ...boards[uids[2]], b: E.boardString(o), h: 15 }; }
if (show === 'final') {
  game.phase = 'final';
  game.phaseStartAt = now - 1500;
  // a finished battle: the winner first, then by elimination order — with every stat the podium + the body read
  uids.slice(1).forEach((u, i) => { game.out[u] = { place: i + 2, by: i < 3 ? me : uids[1], at: now - 30_000 + i * 2000 }; });
  game.winner = SOLO ? null : me;
  if (SOLO) game.out[me] = { place: 1, at: now - 4000, rem: 0 };
  game.results = Object.fromEntries(uids.map((u, i) => [u, { sc: 12000 - i * 1100, ln: 40 - i * 3, lv: 5, mc: 6 - (i % 4), se: 31 - i * 4, best: i === 0 ? 'quad' : 'double', ko: i === 0 ? 3 : i === 1 ? 2 : 0, bd: i === 0 ? 4 : 1, pc: 0, ...(mode === 'survival' ? { t: 151_000 - i * 17_000 } : {}) }]));
  game.calls = {};
  boards[me] = { st: 'play', b: (boards[uids[1]] && boards[uids[1]].b) || '8888808888'.repeat(5) + '1100000033', h: 6 };   // (the winner's last published board — the body draws it)
}
const state = { uid: me, code: 'PVW1', players, presence, game, meta: { hostId: me }, live: { boards, calls: {} }, liveKey: null };
await loadGame('prism');
state.liveKey = liveKeyFor(game);
// the console's store (the podium frame reads it): the room's code left out — no callouts / reports from a preview
setState({ uid: me, players, presence, game, meta: { hostId: me }, live: state.live });
const { createView } = await import('/js/games/prism/view.js');
const view = createView();
view.mount(document.getElementById('app'), state);
const push = () => view.update({ ...state, game: { ...state.game } });
window.__preview = { state, push, view, uids };
// the engine is made on the first update with the live boards in; stack a few pieces, then the bot (or wait under NEXT)
const ready = () => window.__prism && window.__prism.engine() && window.__prism.engine().cur;
for (let k = 0; k < 200 && !ready() && show !== 'final' && show !== 'ko' && show !== 'spec' && !count; k++) await new Promise(r => setTimeout(r, 25));
const wait = ms => new Promise(r => setTimeout(r, ms));
if (ready()) {
  const g = window.__prism.engine();
  const rnd = rngFrom('p');
  const pre = Number(q.get('stack') ?? 8);
  for (let i = 0; i < pre && g.cur; i++) { const m = chooseMove(g, { skill: 0.6, rnd }); if (m) { while (g.cur && g.cur.r !== m.r) if (!E.rotate(g, 1)) break; while (g.cur && g.cur.x !== m.x) if (!E.move(g, Math.sign(m.x - g.cur.x))) break; } E.hardDrop(g); }
  if (q.get('hold') !== '0' && g.cur) E.holdPiece(g);
  if (q.get('bot') === '1') window.__prism.bot({ skill: 0.85, every: 140 });
  else if (q.get('under') !== '1') E.setLevel && E.setLevel(g, 1);
}
// (PD-2) THE RISING GHOST ROWS: attacks queued on your board — fresh (just in), mid (half its delay run), hot (due — it lands on the next lock)
if (q.has('inc') && ready()) {
  const g = window.__prism.engine();
  const D = 60_000, prog = { fresh: 0.02, mid: 0.5, hot: 1 }[q.get('rise') || 'mid'] ?? 0.5;
  const put = (n, gap, from) => g.pending.push({ n, g: gap, from, at: g.clock + D * (1 - prog) - (prog >= 1 ? 1 : 0), t0: g.clock - D * prog });
  const k = Number(q.get('inc'));
  if (k >= 6) { put(4, 2, uids[3]); put(2, 7, uids[4] || uids[1]); } else put(k, 6, uids[3] || uids[1]);
  g.level = 1;
}
if (q.has('shatter') && ready()) { await wait(500); window.__prism.counter(Number(q.get('shatter'))); }
if (q.get('state') === 'kocard' && ready()) window.__prism.topOut();
if (q.get('tip') === '1') { window.__prism.showTip(); }
const CALLOUT = { send: ['+4 → DANA', 'send'], blocked: ['BLOCKED!\n+2 → DANA', 'good'], twist: ['TWIST +2\n+2 → EVE', 'clear'], b2b: ['BACK-TO-BACK\n+5 → CHARLIE', 'big'], ko: ['KO → EVE', 'ko'], pc: ['PERFECT CLEAR\n+10 → BOBBY', 'big'] };
if (q.has('callout') && CALLOUT[q.get('callout')]) window.__prism.calloutHold(...CALLOUT[q.get('callout')]);
if (q.has('after')) await wait(Number(q.get('after')));
if (q.get('down') === '1') document.querySelector('.pd-slam-b')?.classList.add('is-down');
if (q.get('hit') === '1') setTimeout(() => { const t = document.querySelector('.pd-tile'); if (t) t.classList.add('is-hit'); }, 200);
if (q.has('tier')) window.__prism && window.__prism.setTier(Number(q.get('tier')));
// (PD-3) an effect on a loop, for watching on a phone: a SLAM (the stack wiped when it gets tall), a clear of n lines, a combo climbing, a perfect clear
if (q.has('fx') && ready()) {
  const FX = q.get('fx');
  let k = 0;
  const fire = () => {
    const g = window.__prism.engine();
    if (!g) return;
    if (FX === 'slam') { if (E.stackHeight(g) > 12) g.cells.fill(0); window.__prism.fire('slam'); return; }
    const m = /^clear([1-4])$/.exec(FX);
    window.__prism.fire('clear', FX === 'pc' ? { lines: 4, pc: true } : FX === 'combo' ? { lines: 2, combo: (k++ % 6) + 1 } : { lines: m ? Number(m[1]) : 4 });
  };
  setTimeout(fire, 900);
  setInterval(fire, FX === 'slam' ? 1300 : 1700);
}
// (PD-3) the speed run's heaviest moment, held: 4-line clears on a loop with the combo climbing + six ghost rows rising (a long delay — they never land)
if (q.get('heavy') === '1' && ready()) {
  window.__prism.incoming(3, uids[3] || uids[1], 600_000); window.__prism.incoming(3, uids[4] || uids[1], 600_000);
  let k = 0;
  setInterval(() => window.__prism.fire('clear', { lines: 4, combo: 1 + (k++ % 6) }), 650);
}
// (PD-5A) THE BEAT CHECK: a full-screen flash on every beat AS HEARD (window.__prism.beat() — the same clock every beat-timed visual reads)
if (BEAT) {
  // the sound, as the app has it: the engine's tap listeners (app.js#installAudio) — the first tap unlocks the audio
  (await import('/js/audio/engine.js')).installAudio();
  updateSettings({ muted: false, musicOff: false });
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;z-index:9998;pointer-events:none;background:#fff;opacity:0;will-change:opacity';
  const read = document.createElement('div');
  read.style.cssText = 'position:fixed;left:50%;bottom:calc(var(--safe-b, 0px) + 96px);transform:translateX(-50%);z-index:9999;pointer-events:none;background:rgba(8,6,14,.9);color:#fff;font:600 12px/1.45 "JetBrains Mono",monospace;padding:8px 12px;border-radius:10px;text-align:center;white-space:pre;max-width:calc(100vw - 32px);overflow:hidden';
  const tap = document.createElement('button');
  tap.textContent = 'TAP FOR SOUND';
  tap.style.cssText = 'position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10000;min-height:56px;padding:0 28px;border-radius:12px;border:2px solid #ff4fd8;background:#16061a;color:#fff;font:700 18px "Chakra Petch",sans-serif;letter-spacing:.08em';
  tap.addEventListener('click', () => { tap.remove(); });
  document.body.append(flash, read, tap);
  let lastRead = 0;
  const frame = now => {
    requestAnimationFrame(frame);
    const b = window.__prism && window.__prism.beat && window.__prism.beat();
    const p = b && b.beat;
    // a hard flash ON the beat, gone within ~a sixth of it (the downbeat full, the rest softer)
    flash.style.opacity = p && b.pos >= 0 ? String((p.down ? 0.9 : 0.5) * Math.exp(-Math.max(0, p.ph) * 14)) : '0';
    if (now - lastRead > 250 && b) {
      lastRead = now;
      const a = window.__prism.audio();
      const sounding = a && a.slots && a.slots.length ? 'PLAYING' + (a.parts && a.parts.length ? ' (first slice)' : '') : 'silent — tap';
      const ms = v => (v == null ? '—' : `${Math.round(v * 1000)} ms`);
      read.textContent = `${String(b.title || b.id).toUpperCase()} · ${b.set.toUpperCase()} SET\n${b.bpm} BPM · beat ${p ? ((p.idx % 4) + 4) % 4 + 1 : '-'}/4 · ${b.pos.toFixed(2)} s\nlead ${ms(b.lead)} (${b.leadState.state}) · speaker ${ms(b.speaker)} · unreported ${ms(b.unreported)}\n${sounding}`;
    }
  };
  requestAnimationFrame(frame);
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
