<!doctype html>
<!-- PRISM DROP preview (no Firebase) — PD-1: the REAL view (js/games/prism/view.js) mounted with a scripted state through the fake database, so a
     shot is exactly the phone's screen: THE MAX BOARD, HOLD / NEXT in its corners, THE SLIM RAIL, THE SLAM BUTTON, the corner pair, the podium body.
       &n=1..7            opponents on the rail (default 5)
       &state=play | count | ko | duel | final | spec      (default play)
       &rush=1            SCORE RUSH            &scheme=buttons     THE BUTTONS scheme        &slam=left    the mirrored rail + SLAM
       &world=aurora|city|nebula|crystal|sunset            the first song is one in that world
       &bot=1             a bot plays your board (frame timing: window.__prism.fps())     &stack=8   pieces dropped before the shot
       &under=1           no bot: the new piece waits at the top, under NEXT (the panel fades)
       &st=47&sb=34       the safe areas (pt) — an iPhone 13/14 = 47 / 34, a 15/16 Pro = 62 / 34, a Pro Max = 59 / 34
       &tier=0..2         the quality tier       &down=1   SLAM held down (the press)       &hit=1   the first tile's hit flash
     prism-shots.mjs shoots it; Used for the look review + the frame timing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism preview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/kit.css">
<link rel="stylesheet" href="../../css/board.css">
<link rel="stylesheet" href="../../css/prism.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { background: #000; height: 100%; margin: 0; overflow: hidden; }</style>
</head>
<body data-theme="prism">
<div class="screen screen-in" id="app"></div>
<script type="module">
import * as E from '/js/games/prism/engine.js';
import { chooseMove } from '/js/games/prism/bot.js';
import { createGame } from '/js/games/prism/director.js';
import { loadManifest } from '/js/games/prism/songs.js';
import { rngFrom } from '/js/core/rng.js';
import { loadGame, liveKeyFor } from '/js/games/registry.js';
import { updateSettings } from '/js/audio/settings.js';
import { setState } from '/js/store.js';
import { installEmblems } from '/js/ui/emblems.js';

const q = new URLSearchParams(location.search);
const ROOT = document.documentElement;
if (q.has('st')) ROOT.style.setProperty('--safe-t', `${q.get('st')}px`);
if (q.has('sb')) ROOT.style.setProperty('--safe-b', `${q.get('sb')}px`);
updateSettings({ prismScheme: q.get('scheme') === 'buttons' ? 'buttons' : 'gesture', prismSlam: q.get('slam') === 'left' ? 'left' : 'right', prismBtn: 0.5, reducedFx: false });
installEmblems();
// the shared corner pair, as the app draws it (☰ top-left, the music top-right)
document.body.classList.add('pd-on');
document.body.insertAdjacentHTML('beforeend', '<button class="menu-btn" type="button" aria-label="Menu"><span class="mb-bars"><i></i><i></i><i></i></span></button><button class="music-btn" type="button" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="nt"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></g><path class="slash-bg" d="M4 4l16 16"/><path class="slash" d="M4 4l16 16"/></svg></button>');

const mode = q.get('rush') === '1' ? 'rush' : 'battle';
const show = q.get('state') || 'play';
const N = Math.max(1, Math.min(7, Number(q.get('n') || 5)));
const NAMES = ['AVA', 'BOBBY', 'CHARLIE', 'DANA', 'EVE', 'FINN', 'MAXIMILIANOS', 'ZOE'];
const COLORS = ['magenta', 'cyan', 'yellow', 'green', 'orange', 'violet', 'red', 'blue'];
const AV = ['bolt', 'eye', 'crown', 'ghost', 'star', 'heart', 'diamond', 'moon'];
const uids = Array.from({ length: N + 1 }, (_, i) => `u${i}`);
const me = uids[0];
const players = Object.fromEntries(uids.map((u, i) => [u, { name: NAMES[i], color: COLORS[i], avatar: AV[i], joinedAt: i }]));
const presence = Object.fromEntries(uids.map(u => [u, { online: true, lastSeen: Date.now() }]));
const participants = Object.fromEntries(uids.map(u => [u, true]));

const songs = await loadManifest();
const pick = songs.find(s => s.world === q.get('world')) || songs[0];
const list = [pick.id, ...songs.filter(s => s.id !== pick.id).map(s => s.id)].slice(0, mode === 'rush' ? 1 : 5);
const sd = list.map(id => Math.round((songs.find(s => s.id === id).duration || 180) * 1000));
const now = Date.now();
const count = show === 'count';
const songStartAt = count ? now - 1200 : now - 24_000;
const playStartAt = count ? now + 3400 : now - 16_000;
const game = { ...createGame({ matchId: 'pvw', settings: { mode }, participants, now, seed: q.get('seed') || 'preview', songs: list, sd, pl0: 0, songStartAt, playStartAt, endAt: mode === 'rush' ? now + 140_000 : null }), phase: count ? 'count' : 'play', names: Object.fromEntries(uids.map((u, i) => [u, NAMES[i]])) };
game.out = {}; game.bd = {}; game.ko = {};
// the others' boards: a believable mid-game stack each (the engine + the bot), one in danger, one KO'd (battle)
const boards = {};
uids.slice(1).forEach((u, i) => {
  const o = E.createEngine({ seed: 'preview', mode });
  E.start(o);
  const r = rngFrom(u);
  for (let k = 0; k < 5 + i * 4 && o.cur; k++) { const m = chooseMove(o, { skill: 0.5, rnd: r }); if (m) { while (o.cur && o.cur.r !== m.r) if (!E.rotate(o, 1)) break; while (o.cur && o.cur.x !== m.x) if (!E.move(o, Math.sign(m.x - o.cur.x))) break; } E.hardDrop(o); }
  if (i === 2) E.insertJunk(o, 6, 3);
  boards[u] = { b: E.boardString(o), h: E.stackHeight(o), p: o.cur ? `${o.cur.t},${o.cur.r},${o.cur.x},${o.cur.y}` : '', st: 'play', sc: 4000 + ((i * 7919) % 9000), tg: i === 1 ? me : '' };
});
if (mode === 'battle' && N >= 4) { game.out[uids[N]] = { place: N + 1, by: uids[1], at: now - 30_000 }; boards[uids[N]].st = 'out'; game.ko[uids[1]] = 1; game.bd[uids[1]] = 1; }
if (show === 'duel') {
  uids.slice(2).forEach((u, i) => { game.out[u] = { place: N + 1 - i, by: uids[1], at: now - 20_000 - i * 1000 }; boards[u].st = 'out'; });
  game.duelAt = now - 4000;
}
if (show === 'ko' || show === 'spec') {
  game.out[me] = { place: N + 1, by: uids[1], at: now - 500, rem: N };
  boards[me] = { st: 'out', b: '1'.repeat(10) + '0123456789'.repeat(12), h: 14 };
}
if (show === 'final') {
  game.phase = 'final';
  game.phaseStartAt = now - 1500;
  // a finished battle: the winner first, then by elimination order — with every stat the podium + the body read
  uids.slice(1).forEach((u, i) => { game.out[u] = { place: i + 2, by: i < 3 ? me : uids[1], at: now - 30_000 + i * 2000 }; });
  game.winner = me;
  game.results = Object.fromEntries(uids.map((u, i) => [u, { sc: 12000 - i * 1100, ln: 40 - i * 3, lv: 5, mc: 6 - (i % 4), se: 31 - i * 4, best: i === 0 ? 'quad' : 'double', ko: i === 0 ? 3 : i === 1 ? 2 : 0, bd: i === 0 ? 4 : 1 }]));
  game.calls = {};
  boards[me] = { st: 'play', b: boards[uids[1]] && boards[uids[1]].b, h: 6 };   // (the winner's last published board — the body draws it)
}
const state = { uid: me, code: 'PVW1', players, presence, game, meta: { hostId: me }, live: { boards, calls: {} }, liveKey: null };
await loadGame('prism');
state.liveKey = liveKeyFor(game);
// the console's store (the podium frame reads it): the room's code left out — no callouts / reports from a preview
setState({ uid: me, players, presence, game, meta: { hostId: me }, live: state.live });
const { createView } = await import('/js/games/prism/view.js');
const view = createView();
view.mount(document.getElementById('app'), state);
const push = () => view.update({ ...state, game: { ...state.game } });
window.__preview = { state, push, view, uids };
// the engine is made on the first update with the live boards in; stack a few pieces, then the bot (or wait under NEXT)
const ready = () => window.__prism && window.__prism.engine() && window.__prism.engine().cur;
for (let k = 0; k < 200 && !ready() && show !== 'final' && show !== 'ko' && show !== 'spec' && !count; k++) await new Promise(r => setTimeout(r, 25));
if (ready()) {
  const g = window.__prism.engine();
  const rnd = rngFrom('p');
  const pre = Number(q.get('stack') ?? 8);
  for (let i = 0; i < pre && g.cur; i++) { const m = chooseMove(g, { skill: 0.6, rnd }); if (m) { while (g.cur && g.cur.r !== m.r) if (!E.rotate(g, 1)) break; while (g.cur && g.cur.x !== m.x) if (!E.move(g, Math.sign(m.x - g.cur.x))) break; } E.hardDrop(g); }
  if (q.get('hold') !== '0' && g.cur) E.holdPiece(g);
  if (q.get('bot') === '1') window.__prism.bot({ skill: 0.85, every: 140 });
  else if (q.get('under') !== '1') E.setLevel && E.setLevel(g, 1);
}
if (q.get('down') === '1') document.querySelector('.pd-slam-b')?.classList.add('is-down');
if (q.get('hit') === '1') setTimeout(() => { const t = document.querySelector('.pd-tile'); if (t) t.classList.add('is-hit'); }, 200);
if (q.has('tier')) window.__prism && window.__prism.setTier(Number(q.get('tier')));
document.body.dataset.ready = '1';
</script>
</body>
</html>
