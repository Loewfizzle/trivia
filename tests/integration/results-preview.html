<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Results moments preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/board.css">
<style>html, body { margin: 0; background: #04050d; } #stage { position: relative; height: 100dvh; }</style>
</head>
<body data-theme="slip">
<div id="stage"><section class="screen screen-in"></section></div>
<script type="module">
  // The podium with the global-board moments, no server: ?case=first|top10|pb|world|rankup|legend|merged
  import { setState } from '/js/store.js';
  import { createFinal } from '/js/ui/final.js';
  import { installEmblems } from '/js/ui/emblems.js';
  const q = new URLSearchParams(location.search);
  const kind = q.get('case') || 'merged';
  const xp = (from, to, parts) => ({ gain: to - from, from, to, parts: parts || [{ k: 'played', label: 'MATCH PLAYED', v: 30 }, { k: 'win', label: 'VICTORY', v: 52 }, { k: 'pb', label: 'PERSONAL BEST', v: 20 }] });
  const OUT = {
    first: { gid: 'slip', xp: xp(1200, 1302), rk: { from: 1, to: 1 }, pbs: [{ b: 'slip-dist', v: 9412, prev: 8700 }], ranks: [{ b: 'slip-dist', all: { rank: 3, prev: 5 }, week: { rank: 1, prev: 2 } }] },
    top10: { gid: 'slip', xp: xp(1200, 1302), rk: { from: 1, to: 1 }, pbs: [{ b: 'slip-dist', v: 6120, prev: 5400 }], ranks: [{ b: 'slip-dist', all: { rank: 8, prev: 23 }, week: { rank: 4, prev: 9 } }] },
    world: { gid: 'slip', xp: xp(1200, 1282), rk: { from: 1, to: 1 }, pbs: [{ b: 'slip-dist', v: 3120, prev: 2900 }], ranks: [{ b: 'slip-dist', all: { rank: 214, prev: 400 }, week: { rank: 31, prev: 50 } }] },
    pb: { gid: 'slip', xp: xp(1200, 1250), rk: { from: 1, to: 1 }, pbs: [{ b: 'slip-dist', v: 2120, prev: 1980 }], ranks: [] },
    merged: { gid: 'cipher', xp: xp(1200, 1310), rk: { from: 1, to: 1 }, pbs: [{ b: 'cipher-score', v: 897, prev: 640 }, { b: 'cipher-fast5', v: 9420, prev: 12100 }], ranks: [{ b: 'cipher-score', all: { rank: 1, prev: 4 }, week: { rank: 1 } }, { b: 'cipher-fast5', all: { rank: 1, prev: 2 }, week: { rank: 1 } }, { b: 'cipher-wins', all: { rank: 6, prev: 12 }, week: { rank: 1 } }] },
    rankup: { gid: 'slip', xp: xp(230, 312), rk: { from: 0, to: 1 }, pbs: [{ b: 'slip-dist', v: 2120, first: true }], ranks: [{ b: 'slip-dist', all: { rank: 57, prev: null }, week: { rank: 6, prev: null } }] },
    // (CITY F — THE RESULTS PLAQUES: the mockup's pair — #1 WORLDWIDE (the one gold) + NEW PERSONAL BEST · was; + every other kind at once)
    gold: { gid: 'jaywalk', xp: xp(1200, 1250), rk: { from: 1, to: 1 }, pbs: [{ b: 'jaywalk-solo', v: 174, prev: 172 }], ranks: [{ b: 'jaywalk-solo', all: { rank: 1, prev: 2 }, week: { rank: 1, prev: 1 } }] },
    kinds: { gid: 'jaywalk', xp: xp(1200, 1250), rk: { from: 1, to: 1 }, pbs: [{ b: 'jaywalk-solo', v: 96, prev: 80 }], ranks: [{ b: 'jaywalk-solo', all: { rank: 7, prev: 14 }, week: { rank: 2, prev: 4 } }, { b: 'slip-dist', all: { rank: 214, prev: 400 }, week: { rank: 9, prev: 12 } }] },
    week: { gid: 'jaywalk', xp: xp(1200, 1250), rk: { from: 1, to: 1 }, pbs: [], ranks: [{ b: 'jaywalk-solo', all: { rank: 4, prev: 4 }, week: { rank: 1, prev: 3 } }, { b: 'slip-dist', all: { rank: 52, prev: 60 }, week: { rank: 5, prev: 8 } }] },
    // (CITY F — THE PODIUM's MOMENT: a JAYWALK match that earned FOUR achievements, one card EPIC — every card shows + the EPIC's own beat;
    //  the display rows are placeholders registered below — never the real names, which only reach their owners)
    four: { gid: 'jaywalk', xp: xp(1270, 1420, [{ k: 'played', label: 'MATCH PLAYED', v: 30 }, { k: 'win', label: 'VICTORY', v: 52 }, { k: 'ach', label: 'ACHIEVEMENTS', v: 68 }]), rk: { from: 1, to: 1 }, pbs: [], ranks: [], st: null, ach: ['pv-a1', 'pv-a2', 'pv-a3', 'pv-a4'], items: ['pv-c1', 'pv-c2', 'pv-c3', 'pv-c4'] },
    legend: { gid: 'slip', xp: xp(24950, 25040), rk: { from: 3, to: 4 }, pbs: [], ranks: [] },
  };
  installEmblems();
  if (kind === 'four') {
    const [{ registerItems }, { registerAchievements }] = await Promise.all([import('/js/core/items.js'), import('/js/core/achievements.js')]);
    registerItems([1, 2, 3, 4].map(i => ({ id: `pv-c${i}`, kind: 'card', name: `CARD ${i}`, tier: i === 4 ? 'epic' : i === 3 ? 'uncommon' : 'rare', look: { lac: '#0a0a14', foil: '#ffe9c0', ink: '#ffe9c0', acc: '#ff4fc4' }, line: 'A preview card.' })));
    registerAchievements([1, 2, 3, 4].map(i => ({ id: `pv-a${i}`, name: `ACHIEVEMENT ${i}`, line: 'A preview line.', item: `pv-c${i}`, game: 'jaywalk' })));
  }
  const players = { me: { name: 'BENNY', color: 'magenta', avatar: 'crown', pid: 'pmeeeeeeeeee' }, u2: { name: 'DEX', color: 'cyan', avatar: 'bolt' }, u3: { name: 'LUNA', color: 'yellow', avatar: 'moon' } };
  // (FRIENDS B — &n=5: a bigger room — B4's list starts at 4th; the rows carry a game's note, like PRISM DROP's "KO · SENT · BADGES")
  const N = Math.max(3, Math.min(8, Number(q.get('n')) || 3));
  const MORE = [['u4', 'MAXIMILIANOS', 'green', 'ghost'], ['u5', 'ZED', 'orange', 'star'], ['u6', 'KIT', 'violet', 'heart'], ['u7', 'OPAL', 'red', 'diamond'], ['u8', 'WREN', 'cyan', 'bolt']];
  for (const [u, name, color, avatar] of MORE.slice(0, N - 3)) players[u] = { name, color, avatar };
  // (CITY F — END-SCREEN STANDARD A: &g=<game> = that game's ACCENT on the bar (its meta — no body) · &host=1 = this phone hosts (REMATCH
  //  starts it) · &rv=u2,u3 = those guests voted for a rematch · &voted=1 = this phone (a guest) voted too)
  const gid = q.get('g') || 'slip', mid = `m${kind}`;
  const rv = Object.fromEntries((q.get('rv') || '').split(',').filter(Boolean).map(u => [u, mid]));
  if (q.get('voted')) rv.me = mid;
  setState({ code: 'ABCD', uid: 'me', players, rv, meta: { hostId: q.get('host') ? 'me' : 'u2', status: 'playing' }, game: { id: gid, matchId: mid, phase: 'final', participants: Object.fromEntries(Object.keys(players).map(u => [u, true])) } });
  // (SHELL 2.0 A — the XP box's fit test: &xp=from,to overrides the case's XP — e.g. LEGEND · LEVEL 99 → "662 XP TO 100")
  if (q.get('xp')) { const [a, b] = q.get('xp').split(',').map(Number); OUT[kind] = { ...OUT[kind], xp: xp(a, b) }; }
  sessionStorage.setItem(`rc:ABCD_m${kind}`, JSON.stringify({ ...OUT[kind], gid: q.get('g') || OUT[kind].gid }));
  const rows = [{ uid: 'me', rank: 1, score: 9412 }, { uid: 'u2', rank: 2, score: 8100 }, { uid: 'u3', rank: 3, score: 5200 }, ...MORE.slice(0, N - 3).map(([u], i) => ({ uid: u, rank: 4 + i, score: 4100 - i * 650, note: `${3 - (i % 3)} KO · ${5 - i} SENT · ${2 + i} BADGES` }))];
  setTimeout(() => {
    const f = createFinal({ rows, players, me: 'me', presence: {}, winnerLine: n => `${n} RODE THE FARTHEST`, scoreLabel: 'M' });
    document.querySelector('.screen').append(f.el);
  }, 50);
</script>
</body>
</html>
