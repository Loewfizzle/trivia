<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate preview</title>
<!-- LOBBY FIXES — THE NAME PLATE COVERS ITS WIDEST LINE: every full card + every strip with a long name + the dev line, without Firebase.
     ?name=WWWWWWWWWWWW&lv=100&host=1&cards=card-dev-source,card-founder (default: every card) · ?only=full|strip · &fx=1 = the strips live on one surface (THE HERO-SPOT AUDIT) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/progress.css">
<link rel="stylesheet" href="/css/vault.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
<style>html, body { margin: 0; background: #05060f; color: #fff; } #stage { max-width: 440px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; } #stage > * { flex: none; } .lbl { font: 600 11px/1 monospace; opacity: 0.6; }</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { registerLabText } from '/js/vault/catalog.js';
import { LAB_TEXT } from '/__dev/api-lib/lab-text.js';
import '/__dev/api-lib/catalog.js';
registerLabText(LAB_TEXT);   // (CARD FIXES: the cards' printed names, as the lab + the owner's own cards show them)
import { fullCardEl, mountFullCard } from '/js/vault/full.js';
import { stripEl, LOOKS, mountStrips } from '/js/vault/strip.js';
const q = new URLSearchParams(location.search);
const name = q.get('name') || 'WWWWWWWWWWWW', lv = Number(q.get('lv') || 100), only = q.get('only') || '', fd = q.get('fd') !== '0';   // (CARD FIXES: &fd=0 = a non-founder)
const cards = q.get('cards') ? q.get('cards').split(',') : Object.keys(LOOKS);
await document.fonts.ready;
const stage = document.getElementById('stage');
for (const card of cards) {
  if (only !== 'strip' && q.has('fx')) { const host = Object.assign(document.createElement('div'), { style: 'position:relative' }); stage.append(Object.assign(document.createElement('div'), { className: 'lbl', textContent: `${card} · full` }), host); mountFullCard(host, card, { name, lv, no: '0001', avatar: 'crown', color: 'magenta', at: Date.UTC(2026, 9, 2), fd }); }
  else if (only !== 'strip') stage.append(Object.assign(document.createElement('div'), { className: 'lbl', textContent: `${card} · full` }), fullCardEl({ card, who: { name, lv, no: '0001', avatar: 'crown', color: 'magenta', at: Date.UTC(2026, 9, 2), fd } }));
  if (only !== 'full' && q.has('fx')) { const list = document.createElement('div'); stage.append(Object.assign(document.createElement('div'), { className: 'lbl', textContent: card }), list); mountStrips(list, [{ card, name: q.get('name') || 'MIKE', lv, no: '0001', avatar: 'crown', color: 'magenta' }]); continue; }
  if (only !== 'full') { const list = Object.assign(document.createElement('div'), { className: 'vl-list' }); list.append(stripEl({ card, name, lv, host: q.has('host'), no: '0001', avatar: 'crown', color: 'magenta' })); stage.append(list); }
}
window.__ready = true; document.body.dataset.ready = "1";   // (THE BTC CARD: shots.mjs --page waits for body.dataset.ready)
</script>
</body>
</html>
