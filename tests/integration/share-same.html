        for (const [n, c2] of [['password', pwc], ['coastclear', ccc], ['drop', drc]]) o.push([`${n}'s own card: the name`, inkBox(c2, K.OWN.nameY - K.OWN.namePx * 0.3, K.OWN.nameY + K.OWN.namePx * 0.3, 0, 1080, 'bright')]);
        return o;
      };
      const native = await measure();
      K.forceManualSpacing(true);
      const manual = await measure();
      K.forceManualSpacing(false);
      native.forEach(([label, a], i) => { const b = manual[i][1]; rows.push({ card: `no canvas letterSpacing — ${label}: ${b.w} px wide (tracked ${a.w}), ${(b.mid - 540).toFixed(1)} px off centre`, diff: Math.abs(b.w - a.w) <= a.w * 0.04 && Math.abs(b.mid - 540) <= 3 ? 0 : 1 }); });
      out.push(...rows);
    }
  }
  // (the holes never reach the picture: every junk row of the DROP's board is solid)
  const holes = DR.solidJunk(DROP_B).match(/.{10}/g).filter(row => row.includes('8') && row.includes('0')).length;
  out.push({ card: 'the DROP board: no junk row keeps a hole', diff: holes });
  void B;
}
window.__same = out;
document.getElementById('out').textContent = out.map(o => `${o.diff === 0 ? (o.purpose ? 'OK  ' : 'SAME') : (o.purpose ? 'UNCHANGED?!' : 'DIFF ' + o.diff)}  ${o.card}`).join('\n');
document.body.dataset.ready = '1';
</script>
