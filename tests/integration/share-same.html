<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SHARE CARDS — the same pixels</title>
<link rel="icon" href="data:,">
<!-- BOARD 2.0 B — the add-on's proof: each daily's OWN share card, drawn by the split pieces (js/games/<id>/share.js) and by the code BEFORE the split
     (tests/integration/_old/*-share.js — a copy kept for this check), in both looks, for several runs → every pixel compared (window.__same).
     Run with the fonts loaded (the canvas text). Open: /tests/integration/share-same.html → document.body.dataset.ready + window.__same.
     SKINS 2A (Nov 14): the copies in _old/ are the EXPECTED cards, re-taken ON PURPOSE with the pass's changes (NO PILLS — the foot; ONE RHYTHM;
     the beam removed) — a frozen copy of each daily's share.js; + the foot check (no rounded frame: the address's row has no ink left / right
     of the lettering except the ONE straight line above it).
     SKINS 2B (Nov 14): the copies re-taken ON PURPOSE again — THE SHARE CARD's ONE RULE (the kit's small neon name CARRIES THE RESULT on
     every card — green made, red failed, THE DROP white — ONE big TIME, ONE grey stat line, THE PASSWORD's strip = the tiles only, THE
     DROP's = 8 rows); + the name check (SHARE TODAY, all made / one failed / both failed, both looks: each name's row is inked in ITS
     result's colour and no other; the big time + the stat line carry no green / red). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<style>body { margin: 0; background: #222; color: #ddd; font: 13px monospace; }</style>
</head>
<body>
<pre id="out">…</pre>
<script type="module">
try { await document.fonts.load('900 92px Orbitron'); await document.fonts.load('800 40px "Chakra Petch"'); await document.fonts.load('700 40px "Chakra Petch"'); await document.fonts.load('700 20px "JetBrains Mono"'); } catch { /* fine */ }
const NEW_PW = await import('/js/games/password/share.js'), OLD_PW = await import('/tests/integration/_old/pw-share.js');
const NEW_CC = await import('/js/games/coastclear/share.js'), OLD_CC = await import('/tests/integration/_old/cc-share.js');
const G = await import('/js/games/password/logic.js');
const H = G.HIT, N = G.NEAR, M = G.MISS;
const door = (state, marks) => ({ state, marks, guesses: marks.map(() => 'xxxxx'), word: null });
const RUNS = {
  crack: { done: true, door: 1, startedAt: 1000, finishedAt: 175000, doors: [door('solved', [[M, N, M, M, H], [H, H, N, M, M], [H, H, H, H, H]]), door('solved', [[N, M, M, H, M], [H, H, H, H, H]])] },
  lockedBack: { done: true, door: 1, startedAt: 1000, finishedAt: 420000, doors: [door('solved', [[H, H, H, H, H]]), door('failed', Array.from({ length: 6 }, () => [N, M, H, M, M]))] },
  lockedFront: { done: true, door: 0, startedAt: 1000, finishedAt: 300000, doors: [door('failed', Array.from({ length: 6 }, () => [M, M, N, M, H])), { state: 'open', marks: [], guesses: [], word: null }] },
};
const CCS = {
  clear: { head: 'COAST CLEAR', caught: false, time: '2:41', line: '1 SPOTTED · +30 s', spots: 1, dayNo: 12, site: 'neonspeakeasy.com' },
  ghost: { head: 'COAST CLEAR', caught: false, time: '0:48', line: '0 SPOTTED', spots: 0, dayNo: 12, site: 'neonspeakeasy.com' },
  caught: { head: 'CAUGHT', caught: true, time: null, line: '3 SPOTTED · 1:58', spots: 3, dayNo: 12, site: 'neonspeakeasy.com' },
};
const same = (a, b) => {
  const x = a.getContext('2d').getImageData(0, 0, a.width, a.height).data, y = b.getContext('2d').getImageData(0, 0, b.width, b.height).data;
  let diff = 0; for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) diff++;
  return diff;
};
const out = [];
for (const look of ['night', 'day']) {
  for (const [k, run] of Object.entries(RUNS)) for (const dayNo of [null, 7]) out.push({ card: `password ${k} ${look}${dayNo ? ' #7' : ''}`, diff: same(NEW_PW.renderShare({ run, look, dayNo }), OLD_PW.renderShare({ run, look, dayNo })) });
  // (SKINS 2A — the EXPECTED copies were RE-TAKEN ON PURPOSE (Nov 14: the foot without its frame, ONE RHYTHM, COAST CLEAR's beam removed —
  //  tests/integration/_old/pw-share.js + cc-share.js): every card, clear + caught, must be pixel-identical to its copy again)
  for (const [k, inputs] of Object.entries(CCS)) out.push({ card: `coastclear ${k} ${look}`, diff: same(NEW_CC.renderShare({ inputs, look }), OLD_CC.renderShare({ inputs, look })) });
}
// THE DROP B — each daily's OWN card is pixel-identical INSIDE SHARE TODAY: with ONE daily finished, SHARE TODAY is that card, exactly (THE
// PASSWORD · COAST CLEAR · THE DROP — the DROP's board with its junk rows SOLID), both looks
{
  const T = await import('/js/daily/share-today.js'), DR = await import('/js/games/drop/share.js'), B = await import('/js/games/prism/board.js');
  // (THE DROP B add-on: a REAL finished run — drop-sample.js: the bot to its top-out, the log replayed as the server does)
  const DRUN = (await import('/tests/integration/drop-sample.js')).sampleDropRun('20261108', { day: 'd20261113' }), DROP_B = DRUN.raw;
  const ROWS = [{ id: 'password', name: 'THE PASSWORD' }, { id: 'coastclear', name: 'COAST CLEAR' }, { id: 'drop', name: 'THE DROP' }];
  // (each from the SERVER's share shape — THE PASSWORD's marks + counts, never a word)
  const pwShare = { done: true, door: 1, startedAt: 1000, finishedAt: 175000, doors: RUNS.crack.doors.map(d => ({ state: d.state, marks: d.marks, n: d.marks.length })) };
  const SHARE = { password: pwShare, coastclear: CCS.clear, drop: DRUN.inputs };
  const own = { password: (look) => NEW_PW.renderShare({ run: G.runFromShare(pwShare), look }), coastclear: (look) => NEW_CC.renderShare({ inputs: CCS.clear, look }), drop: (look) => DR.renderShare({ inputs: SHARE.drop, look }) };
  for (const look of ['night', 'day']) for (const r of ROWS) {
    const today = { day: 'd20261113', dailies: ROWS, mine: { [r.id]: 1 } };
    const inside = await T.drawToday(today, () => '', look, { streak: 3, share: { [r.id]: SHARE[r.id] } });
    out.push({ card: `${r.id} alone inside SHARE TODAY ${look}`, diff: same(inside, await own[r.id](look)) });
  }
  // SKINS 2A — NO PILLS: SHARE TODAY's foot = ONE straight line + plain lettering — no frame. With three finished: the columns just outside the
  // address's lettering (x 150–190 + 890–930, the old tube's sides) hold NO ink at the address's height, and the line's row is inked across
  for (const look of ['night', 'day']) {
    const today = { day: 'd20261113', dailies: ROWS, mine: { password: 1, coastclear: 1, drop: 1 } };
    const cv = await T.drawToday(today, () => '', look, { streak: 3, share: SHARE });
    const g = cv.getContext('2d'), px = (x, y) => g.getImageData(x, y, 1, 1).data, far = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
    let frame = 0, line = 0;
    for (const x of [152, 160, 170, 180, 900, 910, 920, 928]) for (let y = 1262; y <= 1306; y += 4) if (far(px(x, y), px(40, y)) > 40) frame++;
    for (let x = 160; x <= 920; x += 40) if (far(px(x, 1226), px(40, 1226)) > 40) line++;
    out.push({ card: `SHARE TODAY ${look}: no frame round the address`, diff: frame });
    out.push({ card: `SHARE TODAY ${look}: ONE straight line above it`, diff: line === 20 ? 0 : 20 - line });
  }
  // SKINS 2B — THE ONE RULE (+ the 11:16 am add-on): in SHARE TODAY with three finished, each section's NAME row is inked in ITS RESULT's
  // colour — green made, red failed, THE DROP white (navy by day) — and no other; the big time's + the stat line's rows hold NO green / red
  // (no win word, no CAUGHT / LOCKED OUT word anywhere). All made · one failed · both failed, both looks.
  {
    const R = (await import('/js/daily/share.js')).RHYTHM;
    const lostPw = { done: true, door: 1, startedAt: 1000, finishedAt: 420000, doors: RUNS.lockedBack.doors.map(d => ({ state: d.state, marks: d.marks, n: d.marks.length })) };
    const DAYS = { 'all made': [SHARE, ['green', 'green', 'none']], 'one failed': [{ ...SHARE, coastclear: CCS.caught }, ['green', 'red', 'none']], 'both failed': [{ ...SHARE, password: lostPw, coastclear: CCS.caught }, ['red', 'red', 'none']] };
    for (const look of ['night', 'day']) for (const [label, [share, want]] of Object.entries(DAYS)) {
      const today = { day: 'd20261113', dailies: ROWS, mine: { password: 1, coastclear: 1, drop: 1 } };
      const cv = await T.drawToday(today, () => '', look, { streak: 3, share });
      const g = cv.getContext('2d');
      // (where each section's rhythm box sits on the card + its scale: share-today.js records it on the canvas — `cv.sections`)
      const count = (i, ya, yb) => {
        const y0 = cv.sections[i].y, k = cv.sections[i].s, d = g.getImageData(R.COL, Math.round(y0 + ya * k), 1080 - 2 * R.COL, Math.max(1, Math.round((yb - ya) * k))).data;
        let green = 0, red = 0;
        for (let j = 0; j < d.length; j += 4) { const r = d[j], gg = d[j + 1], b = d[j + 2]; if (gg > r + 40 && gg > b + 25) green++; else if (r > gg + 70 && r > b + 50) red++; }
        return { green, red };
      };
      let bad = 0;
      want.forEach((w, i) => {
        const n = count(i, R.nameY - R.namePx * 0.36, R.nameY + R.namePx * 0.36);
        if (w === 'green' && !(n.green > 400 && n.red === 0)) bad++;
        if (w === 'red' && !(n.red > 400 && n.green === 0)) bad++;
        if (w === 'none' && (n.green || n.red)) bad++;
        const rest = count(i, R.bigY - R.bigPx * 0.42, R.statY + R.statPx * 0.4);
        if (rest.green || rest.red) bad++;
      });
      out.push({ card: `SHARE TODAY ${look}, ${label}: each name in its result's colour; the time + the stat line plain`, diff: bad });
    }
  }
  // THE ADD-ON (Ben, Nov 14 11:25 am) — SHARE TODAY's PASSWORD strip stays READABLE: with the Back Room failed after 6 (three finished) the
  // tiles are ≥ 22 px on the card and the section GROWS past the rhythm's box (the other two keep theirs); with short grids nothing grows
  {
    const R = (await import('/js/daily/share.js')).RHYTHM;
    const lostPw = { done: true, door: 1, startedAt: 1000, finishedAt: 420000, doors: RUNS.lockedBack.doors.map(d => ({ state: d.state, marks: d.marks, n: d.marks.length })) };
    const today = { day: 'd20261113', dailies: ROWS, mine: { password: 1, coastclear: 1, drop: 1 } };
    const tall = await T.drawToday(today, () => '', 'night', { streak: 3, share: { ...SHARE, password: lostPw } }), flat = await T.drawToday(today, () => '', 'night', { streak: 3, share: SHARE });
    const cell = NEW_PW.stripOf(G.runFromShare(lostPw), 1080 / tall.sections[0].s, tall.sections[0].s).cell * tall.sections[0].s;
    out.push({ card: `SHARE TODAY: a six-row PASSWORD grid keeps its tiles >= 22 px on the card (${cell.toFixed(1)} px)`, diff: cell >= 21.99 ? 0 : 1 });
    out.push({ card: 'SHARE TODAY: the tall grid makes ITS section grow (the others keep the rhythm\'s box)', diff: tall.sections[0].h > R.H && tall.sections[1].h === R.H && tall.sections[2].h === R.H ? 0 : 1 });
    out.push({ card: 'SHARE TODAY: short grids — every section the rhythm\'s box', diff: flat.sections.every(x => x.h === R.H) ? 0 : 1 });
    const last = tall.sections[2];
    out.push({ card: 'SHARE TODAY: the grown card still ends above the foot', diff: last.y + last.h * last.s <= 1202 ? 0 : 1 });
  }
  // (the holes never reach the picture: every junk row of the DROP's board is solid)
  const holes = DR.solidJunk(DROP_B).match(/.{10}/g).filter(row => row.includes('8') && row.includes('0')).length;
  out.push({ card: 'the DROP board: no junk row keeps a hole', diff: holes });
  void B;
}
window.__same = out;
document.getElementById('out').textContent = out.map(o => `${o.diff === 0 ? (o.purpose ? 'OK  ' : 'SAME') : (o.purpose ? 'UNCHANGED?!' : 'DIFF ' + o.diff)}  ${o.card}`).join('\n');
document.body.dataset.ready = '1';
</script>
</body>
</html>
