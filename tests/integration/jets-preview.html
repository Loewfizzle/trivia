<!doctype html><meta charset="utf-8"><title>Jets preview</title>
<!-- POLISH 4 — THE F-16 close up (jets.js): day / golden hour / night, at the chase's size, the air show's and blown up; the
     afterburner + Mach diamonds + the night lights. ?only=day|golden|night, ?burn=0 (no afterburner), ?dir=-1 (flying left).
     node shots.mjs "<browser>" --page "tests/integration/jets-preview.html" --name jets --sizes 1440x900 -->
<body style="margin:0;background:#101226;color:#cfd3ff;font:12px system-ui;padding:10px">
<script type="module">
import { createJets } from '/js/screens/harbor/jets.js';
const q = new URLSearchParams(location.search), only = q.get('only'), burn = q.get('burn') === '0' ? 0 : 1, dir = Number(q.get('dir') || 1);
const LOOKS = { day: { day: 1, golden: 0, dark: 0, sky: ['#5f97d6', '#a9c9ea'] }, golden: { day: 0.4, golden: 1, dark: 0, sky: ['#e0915a', '#f2c38e'] }, night: { day: 0, golden: 0, dark: 1, sky: ['#0b0a20', '#2c1f52'] } };
const jets = createJets(); jets.setDpr(2);
for (const [name, look] of Object.entries(LOOKS)) {
  if (only && only !== name) continue;
  const c = document.createElement('canvas'), W = 1400, H = 300, d = 2; c.width = W * d; c.height = H * d; c.style.width = W + 'px'; c.style.height = H + 'px'; c.style.display = 'block'; c.style.marginBottom = '8px';
  const x = c.getContext('2d'); x.scale(d, d);
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, look.sky[0]); g.addColorStop(1, look.sky[1]); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // the chase's size (80), the air show's (~48), and blown up (520)
  jets.draw(x, { x: 120, y: 80, dir, ang: 0.05, len: 80, look, burn, t: 1.3, i: 0 });
  jets.draw(x, { x: 120, y: 200, dir, ang: 0, len: 48, look, burn: burn * 0.35, t: 1.7, i: 1 });
  jets.draw(x, { x: 820, y: 150, dir, ang: 0, len: 520, look, burn, t: 0.9, i: 2 });
  x.fillStyle = '#fff'; x.fillText(name, 8, 16);
  document.body.append(c);
}
document.body.dataset.ready = '1';
</script></body>
