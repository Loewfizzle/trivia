<!doctype html>
<!-- NEON SPEAKEASY brand renders (used by render-assets.mjs; needs scripts/serve.mjs):
       ?kind=og                    1200×630 link preview: the district at night, the sign, the tagline, the games
       ?kind=icon&size=512&pad=.14 app icon: the tube "N" glowing over a night skyline (pad: maskable safe zone) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@700&family=Orbitron:wght@700;900&display=block">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/title.css">
<style>
  html, body { margin: 0; background: #03040b; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  .og canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .og .sign { position: absolute; left: 0; right: 0; top: 70px; display: flex; flex-direction: column; align-items: center; }
  .og .nd-logo-wrap { width: 520px; }
  .og .nd-word { opacity: 1; font-size: 26px; text-shadow: 0 0 18px rgba(150,170,255,.5); }
  .og .tag { margin-top: 20px; padding-left: .36em; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 17px; letter-spacing: .36em; color: rgba(232,236,255,.9); text-shadow: 0 0 12px rgba(3,3,12,1), 0 0 3px rgba(3,3,12,1); }
  .og .foot { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 60px; }
  .og .foot span { padding: 7px 12px; font-family: 'Orbitron'; font-weight: 700; font-size: 13px; letter-spacing: .12em; color: #eef1ff; background: rgba(8,9,26,.72); border: 1px solid rgba(255,255,255,.16); border-radius: 9px; }
  .og .foot span i { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); vertical-align: 1px; }
  .icon { position: relative; overflow: hidden; }
  .icon canvas { position: absolute; inset: 0; }
  .icon svg { position: absolute; overflow: visible; }
</style>
</head>
<body>
<script type="module">
import { createDistrict } from '../../js/screens/district/scene.js';
import { logoSvg, monogramSvg, TAGLINE } from '../../js/ui/logo.js';
import { GAMES } from '../../js/config.js';
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'og';
const wait = ms => new Promise(r => setTimeout(r, ms));
await document.fonts.load('900 20px Orbitron');
await document.fonts.load('700 20px Orbitron');
if (kind === 'og') {
  const root = document.createElement('div'); root.className = 'og';
  const c = document.createElement('canvas');
  root.append(c);
  const sign = document.createElement('div'); sign.className = 'sign';
  sign.innerHTML = `<div class="nd-logo-wrap">${logoSvg({ id: 'og', lit: true, blur: 1.1 })}</div><div class="nd-word">SPEAKEASY</div><div class="tag">${TAGLINE}</div>`;
  root.append(sign);
  const ACC = { gridlock: '#7fb2ff', slip: '#ffc46b', overclock: '#ffb627', prism: '#d6f0ff', golf: '#2ff5d2', agent: '#e6e9ef', pulse: '#a374ff', cipher: '#3dff8b', signal: '#ff4466', bluff: '#efe6d2' };
  const foot = document.createElement('div'); foot.className = 'foot';
  foot.innerHTML = GAMES.map(g => `<span style="--c:${ACC[g.id]}"><i></i>${g.name}</span>`).join('');
  root.append(foot);
  document.body.append(root);
  const d = createDistrict(c, { games: GAMES, tier: 2, seed: 2077 });
  const svg = sign.querySelector('svg').getBoundingClientRect();
  d.set({ wave: 1, lit: 1, bill: 1, logo: 1, motion: 0, logoRect: { x: svg.left + svg.width * 0.07, y: svg.top + svg.height * 0.18, w: svg.width * 0.86, h: svg.height * 0.64 } });
  await wait(2200);
} else {
  const size = Number(q.get('size') || 512), pad = Number(q.get('pad') || 0.14);
  const root = document.createElement('div'); root.className = 'icon';
  root.style.width = root.style.height = `${size}px`;
  if (q.get('round')) root.style.borderRadius = `${size * 0.22}px`;
  const c = document.createElement('canvas');
  c.style.width = c.style.height = `${size}px`;
  root.append(c);
  document.body.append(root);
  // the night city as the backdrop, the tube N in front
  const d = createDistrict(c, { games: [], tier: 2, seed: 77, billboards: false });
  d.set({ wave: 1, lit: 1, bill: 0, logo: 0, motion: 0 });
  const m = document.createElement('div');
  const inner = size * (1 - 2 * pad);
  m.innerHTML = monogramSvg({ id: 'ic', size: inner, blur: size < 100 ? 0.55 : 1 });
  const s = m.firstElementChild;
  s.style.left = s.style.top = `${size * pad}px`;
  root.append(s);
  // darken the city behind the mark a little so the N carries even at 64 px
  const veil = document.createElement('div');
  veil.style.cssText = `position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 45%, rgba(3,3,12,.55), rgba(3,3,12,.15) 75%)`;
  root.insertBefore(veil, s);
  await wait(1600);
}
window.__ready = true;
</script>
</body>
</html>
