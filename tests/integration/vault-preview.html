<!doctype html>
<html lang="en" class="vl-lab-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Card Lab — preview</title>
<!-- THE VAULT 1A without Firebase / the server: THE CARD LAB's REAL views (js/vault/lab-views.js) with marks kept in memory.
     ?view=strips|lobby  &mix=samples|legend|<card id>  &still=1 (reduced motion)  &tier=0|1|2 (pin the effects' tier)
     window.__lab for tests (view, mix, fps, stats, marks). The real page: /lab (admins only). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/vault.css">
<script type="importmap">{ "imports": { "/js/firebase.js": "/tests/integration/fake-firebase.js" } }</script>
</head>
<body class="vl-lab-on">
<main id="app" class="vl-lab"></main>
<script type="module">
import { mountLab } from '/js/vault/lab-views.js';
import { registerLabText, registerLabChanges, verOf } from '/js/vault/catalog.js';
import { LAB_TEXT, LAB_CHANGES } from '/__dev/api-lib/lab-text.js';   // (the server's names — this page runs on the local server only)
import '/__dev/api-lib/catalog.js';                         // (the item catalog, ditto)
registerLabText(LAB_TEXT); registerLabChanges(LAB_CHANGES);
import { setFxReduced, setFxTier } from '/js/fx/renderer.js';
const q = new URLSearchParams(location.search);
if (q.get('still') === '1') setFxReduced(true);
if (q.get('tier') != null) setFxTier(Number(q.get('tier')));
// (&marks=old: every item marked APPROVE at version 1 — the CHANGED + NEEDS YOU view the owner meets after a pass)
let marks = {};
if (q.get('marks') === 'old') { const { LAB } = await import('/js/vault/catalog.js'); for (const x of LAB) marks[x.id] = { m: 'approve', note: '', at: Date.UTC(2026, 10, 3, 20), v: 1 }; marks['card-inferno'] = { m: 'fix', note: 'This needs to look a lot more like real flame.', at: Date.UTC(2026, 10, 3, 22), v: 1 }; }
// (&marks=done: every item APPROVED at its CURRENT version — ALL CAUGHT UP)
if (q.get('marks') === 'done') { const { LAB } = await import('/js/vault/catalog.js'); for (const x of LAB) marks[x.id] = { m: 'approve', note: '', at: Date.UTC(2026, 10, 3, 23), v: verOf(x.id) }; }
mountLab(document.getElementById('app'), { marks, onMark: async (id, m, note) => { marks = { ...marks, [id]: { m, note, at: Date.now(), by: 'preview', v: verOf(id) } }; return { marks }; } });
document.fonts.ready.then(() => setTimeout(() => { document.body.dataset.ready = '1'; }, 600));
</script>
</body>
</html>
