<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE GAMES' MARKS — preview</title>
<!-- CITY H2 — the playable games' neon marks side by side (core/marks.js through ui/mark-svg.js — the PLAY sheet's / PICK A GAME's builder), at the
     sizes they're drawn (24 · 32 · 40 · 64), by night + by day; + JAYWALK's card art (ui/game-art.js) + its daily ticket (daily/ticket-art.js). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@700;900&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<style>
  html, body { margin: 0; background: #0d0a1c; color: #fff; font: 700 11px/1.2 'Chakra Petch', sans-serif; letter-spacing: 0.12em; }
  .band { padding: 14px 12px 16px; }
  .band.day { background: linear-gradient(180deg, #cfe7ff, #f4f9ff); color: #18223a; }
  .row { display: grid; grid-template-columns: 74px repeat(4, 1fr); align-items: center; gap: 6px; margin: 6px 0; }
  .row b { font-size: 10px; }
  .cell { display: grid; place-items: center; min-height: 66px; }
  .cell svg { fill: none; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  .night .cell svg { filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.25)); }
  .art { display: flex; gap: 12px; align-items: center; padding: 12px; }
  .art .card { width: 96px; height: 96px; border-radius: 12px; overflow: hidden; }
  .art .card svg { width: 100%; height: 100%; }
  .tk { width: 48px; height: 48px; color: #ffa53a; }
  .tk svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tk .c { stroke: #fff; stroke-width: 0.6; }
  h4 { margin: 0 0 6px; font: 800 10px/1 'Orbitron', sans-serif; letter-spacing: 0.24em; opacity: 0.8; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { GAMES } from '/js/config.js';
import { markSvg } from '/js/ui/mark-svg.js';
import { gameArtSvg } from '/js/ui/game-art.js';
import { TICKET_ART } from '/js/daily/ticket-art.js';
// (FREEFALL F5A — &ff=1: FREEFALL's new mark beside the playable games' — it is hidden, so it is added by hand — at the list's 36 pt + the
//  tile's 72 pt, and its tile (ui/game-art.js) beside HIGH RISE's + JAYWALK's at 72 pt)
const ff = new URLSearchParams(location.search).get('ff') === '1';
const sizes = ff ? [24, 36, 48, 72] : [24, 32, 40, 64], games = GAMES.filter(g => g.playable);
if (ff) games.unshift(GAMES.find(g => g.id === 'freefall') || { id: 'freefall', name: 'FREEFALL' });
// (J3 — &before=1: one more row under JAYWALK — its mark in CITY H2's house pink (#ff4fc4), the red's before / after)
const before = new URLSearchParams(location.search).get('before') === '1';
const cells = (g, swap, day) => sizes.map(s => `<div class="cell">${(swap ? markSvg(g, 'mk', day).split('#ff3344').join('#ff4fc4') : markSvg(g, 'mk', day)).replace('<svg ', `<svg width="${s}" height="${s}" style="stroke-width:7" `)}</div>`).join('');
const band = look => `<div class="band ${look}"><h4>${look.toUpperCase()}</h4>${games.map(g => `<div class="row"><b>${g.name}</b>${cells(g, false, look === 'day')}</div>${before && g.id === 'jaywalk' ? `<div class="row"><b>BEFORE (PINK)</b>${cells(g, true, look === 'day')}</div>` : ''}`).join('')}</div>`;
document.getElementById('out').innerHTML = band('night') + band('day') + `<div class="art"><h4>JAYWALK</h4><div class="card" id="jwcard"></div><div class="tk">${TICKET_ART.jaywalk}</div></div>`;
document.getElementById('jwcard').append(gameArtSvg('jaywalk'));
if (ff) { const row = document.createElement('div'); row.className = 'art'; row.innerHTML = '<h4>TILES · 72 PT</h4>'; for (const id of ['freefall', 'highrise', 'jaywalk', 'holdem']) { const c = document.createElement('div'); c.className = 'card'; c.style.cssText = 'width:72px;height:72px'; const a = gameArtSvg(id); if (a) c.append(a); row.append(c); } document.getElementById('out').append(row); }
document.body.dataset.ready = '1';
</script>
</body>
</html>
