<!-- THE VAULT 2C — THE WRONG DOOR (the owner typed /LAN and met the host's plain 404): Vercel serves this file for ANY unknown path (vercel.json
     has no rewrites — nothing swallows it). STATIC on purpose: no city scene, no Firebase, no module graph — instant, and it works when
     everything else is down. The speakeasy's door at night; the peephole slot SLIDES OPEN; "Wrong door, friend." + one plain line; ONE big
     BACK TO THE CITY. DID YOU MEAN: a near miss of OUR routes (/board, /daychart; a hush word → its room link) — /lab + /admin only when this
     device's saved profile was told it's an admin (a hint the app leaves: nothing secret here; the server still checks those doors).
     Phone first; the site's fonts + tokens (copied below — this page loads no stylesheet of the app's); reduced motion = the slot already open.
     `wd-` classes. docs/title.md "THE WRONG DOOR". -->
<style>
  :root { --bg: #07060b; --ink: #f5ecda; --dim: rgba(245, 236, 218, 0.78); --gold: #e9c77e; --pink: #ff4fb8; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --font-display: 'Orbitron', system-ui, sans-serif; --font-ui: 'Chakra Petch', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 24px); overflow-x: hidden;
    background: radial-gradient(120% 60% at 50% 0%, #1d1030 0%, rgba(29, 16, 48, 0) 60%), radial-gradient(90% 50% at 50% 100%, #2a0f1e 0%, rgba(42, 15, 30, 0) 70%), var(--bg); }
  .wd { width: min(100%, 420px); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .wd-k { font: 700 11.5px/1 var(--font-ui); letter-spacing: 0.34em; color: var(--gold); margin: 0 0 14px; }
  /* THE DOOR (one inline SVG, crisp at 3×) + the slot's cover sliding (its own layer: transform only) */
  .wd-door { position: relative; width: min(64vw, 250px); aspect-ratio: 250 / 330; margin: 0 0 22px; }
  .wd-door svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .wd-door > svg { -webkit-mask-image: radial-gradient(78% 66% at 50% 52%, #000 62%, transparent 100%); mask-image: radial-gradient(78% 66% at 50% 52%, #000 62%, transparent 100%); }
  .wd-slot { position: absolute; left: 30.4%; top: 27.9%; width: 39.2%; height: 9.1%; overflow: hidden; border-radius: 3px; }
  .wd-cover { position: absolute; inset: 0; background: linear-gradient(180deg, #4a3220, #2f1f13); box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.25); transform: translateX(0); animation: wd-open 3.6s cubic-bezier(.6, 0, .2, 1) 0.5s forwards; }
  .wd-cover::after { content: ''; position: absolute; right: 10%; top: 50%; width: 9%; height: 26%; margin-top: -4%; border-radius: 2px; background: #b8894a; }
  @keyframes wd-open { 0% { transform: translateX(0); } 14% { transform: translateX(-6%); } 22% { transform: translateX(-4%); } 52%, 100% { transform: translateX(-104%); } }
  .wd-eyes { position: absolute; inset: 0; opacity: 0; animation: wd-eyes 0.6s ease 2.3s forwards; }
  @keyframes wd-eyes { to { opacity: 1; } }
  .wd-blink { transform-origin: 50% 55%; animation: wd-blink 4.5s ease-in-out 3.4s infinite; }
  @keyframes wd-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .wd-lamp { animation: wd-hum 3.2s ease-in-out infinite alternate; }
  @keyframes wd-hum { from { opacity: 0.82; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .wd-cover { animation: none; transform: translateX(-104%); } .wd-eyes { animation: none; opacity: 1; } .wd-blink, .wd-lamp { animation: none; } }
  h1 { margin: 0 0 10px; font: 900 clamp(24px, 7.4vw, 32px)/1.15 var(--font-display); letter-spacing: 0.04em; color: #fff4e0; text-shadow: 0 0 18px rgba(255, 79, 184, 0.45); }
  .wd-line { margin: 0 0 22px; max-width: 34ch; font: 500 16px/1.45 var(--font-ui); color: var(--dim); }
  .wd-path { font: 700 16px/1.45 var(--font-ui); letter-spacing: 0.04em; color: #fff4e0; overflow-wrap: anywhere; }
  .wd-go { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; border-radius: 16px; text-decoration: none; font: 800 16px/1 var(--font-ui); letter-spacing: 0.3em; color: #2a1806;
    background: linear-gradient(180deg, #fff0c4 0%, #f0c96e 46%, #c99a43 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 0 24px rgba(255, 196, 90, 0.28), 0 10px 26px rgba(0, 0, 0, 0.5); }
  .wd-go:active { transform: translateY(1px); }
  .wd-go:focus-visible, .wd-mean a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .wd-mean { width: 100%; margin: 16px 0 0; }

  .wd-mean p { margin: 0 0 8px; font: 700 11.5px/1 var(--font-ui); letter-spacing: 0.3em; color: var(--gold); }
  .wd-mean a { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 50px; margin: 0 0 8px; padding: 0 16px; border-radius: 14px; text-decoration: none; color: var(--ink);

  .wd-mean a span { font: 500 13.5px/1.2 var(--font-ui); color: var(--dim); }
  .wd-foot { margin: 26px 0 0; font: 600 12px/1.4 var(--font-ui); letter-spacing: 0.14em; color: rgba(245, 236, 218, 0.62); }
  @media (min-width: 900px) { .wd-door { width: 240px; } }

<script>
// DID YOU MEAN — plain script, no imports. A near miss of our routes (≤ 2 edits, case-insensitive), a hush word's room link; the admin
// doors only on a device the app already told it's an admin (localStorage nd:adm — a hint the app writes after the server's yes).
(function () {
  var raw = decodeURIComponent(location.pathname || '/').replace(/\/+$/, '') || '/';
  var p = raw.replace(/^\//, '').toLowerCase();
  var pathEl = document.getElementById('wd-path'); if (pathEl && raw !== '/') pathEl.textContent = raw.length > 40 ? raw.slice(0, 40) + '…' : raw;
  var admin = false;
  try { admin = !!localStorage.getItem('nd:adm'); } catch (e) { admin = false; }
  var routes = [['board', 'THE BOARD', 'the hall of fame'], ['daychart', 'THE DAY CHART', 'the city’s day']];
  if (admin) routes.push(['lab', 'THE LAB', 'the card lab'], ['admin', 'ADMIN', 'the back office']);
  function dist(a, b) { var m = a.length, n = b.length, d = [], i, j; for (i = 0; i <= m; i++) { d[i] = [i]; } for (j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) for (j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; }
  var out = [], first = p.split('/')[0];
  for (var k = 0; k < routes.length; k++) { var r = routes[k], dd = dist(first, r[0]); if (first && dd <= (r[0].length > 4 ? 2 : 1) && first !== r[0]) out.push(['/' + r[0], r[1], r[2], dd]); }
  out.sort(function (a, b) { return a[3] - b[3]; });
  // a hush word (4 letters) typed as a path → its room link
  if (/^[a-z]{4}$/.test(p) && !out.length) out.push(['/?room=' + p.toUpperCase(), 'JOIN ' + p.toUpperCase(), 'the room behind that hush word', 0]);
  var nav = document.getElementById('wd-mean');
  if (out.length && nav) {
    for (var x = 0; x < Math.min(2, out.length); x++) { var a = document.createElement('a'); a.href = out[x][0]; a.dataset.to = out[x][0]; a.textContent = out[x][1]; var s = document.createElement('span'); s.textContent = out[x][2] + ' ›'; a.appendChild(s); nav.appendChild(a); }
    nav.hidden = false;
  }
  window.__wd = { path: raw, suggest: out.map(function (o) { return o[0]; }), admin: admin };
  document.body.dataset.ready = '1';
})();
