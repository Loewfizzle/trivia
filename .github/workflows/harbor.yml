# CITY 2.0 — the FULL e2e-harbor suite on GitHub's machines (the laptop runs out of memory on it). docs/testing.md "THE HARBOR IN THE CLOUD".
# Kept lean for the PRIVATE repo's 2,000 monthly free minutes (the owner, Oct 24):
#   • it runs ONLY on a pass's FINAL push — a push whose commits carry the tag [harbor] in a message (e.g. "CITY 2.0 PART 8P: … [harbor]") —
#     or by hand (Actions → harbor → Run workflow, or `gh workflow run harbor` / `gh workflow run harbor -f job=street`). Mid-pass pushes
#     show a skipped run and cost nothing. The quick unit + smoke tests stay in tests.yml on every push.
#   • only when a City 2.0 file changed (the paths below);
#   • split into PARALLEL JOBS (the matrix — the groups of each job are in tests/integration/harbor-jobs.mjs), so "Re-run failed jobs"
#     re-runs one job (~4 min), not the whole suite;
#   • a newer FULL run cancels an older full run (a skipped push never cancels a full run); npm + emulator downloads cached; no screenshots
#     unless a check fails.
name: harbor

on:
  push:
    branches: [main]
    paths:
      - 'js/screens/harbor/**'
      - 'js/core/harbor-*.js'
      - 'js/core/city-*.js'
      - 'js/core/sky.js'
      - 'js/core/weather.js'
      - 'js/core/party.js'
      - 'js/core/tube-path.js'
      - 'js/screens/title.js'
      - 'js/screens/title-dock.js'
      - 'js/audio/**'
      - 'js/ui/canvas-safe.js'
      - 'js/ui/debug-tools.js'
      - 'js/ui/logo.js'
      - 'js/ui/tube-logo.js'
      - 'js/app.js'
      - 'index.html'
      - 'css/title.css'
      - 'css/harbor*.css'
      - 'audio/city/**'
      - 'data/mood-music.json'
      - 'api/admin.js'
      - 'database.rules.json'
      - 'tests/integration/e2e-harbor.mjs'
      - 'tests/integration/harbor-e2e/**'
      - 'tests/integration/harbor-jobs.mjs'
      - '.github/workflows/harbor.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'One job only (its groups: tests/integration/harbor-jobs.mjs), or all'
        type: choice
        default: all
        options: [all, audio, show, city, perf, street, wild, legend, holiday, windows]

concurrency:
  group: harbor-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[harbor]')) && 'full' || 'skip' }}
  cancel-in-progress: true

jobs:
  harbor:
    # (the pass's final push only: a commit message in the push carries [harbor]; or Run workflow by hand)
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[harbor]')
    name: e2e-harbor · ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # THE JOBS — the same names as CI_JOBS in tests/integration/harbor-jobs.mjs (tests/harbor-jobs.test.mjs checks the two match;
        # a new job goes in both + in the options above). A new GROUP needs no change here: it goes in a job in harbor-jobs.mjs.
        job: ${{ fromJSON(inputs.job && inputs.job != 'all' && format('["{0}"]', inputs.job) || '["audio","show","city","perf","street","wild","legend","holiday","windows"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/integration/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install (firebase-admin for /api; the emulators + puppeteer-core for the tests)
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tests/integration --no-audit --no-fund
      - name: Cache the emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/integration/package-lock.json') }}
      - name: Let Chrome use its sandbox (Ubuntu 24.04 restricts user namespaces)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e-harbor (${{ matrix.job }}) on the emulators
        working-directory: tests/integration
        env:
          CHROME: /usr/bin/google-chrome
          SHOTS: '0'
          JOB: ${{ matrix.job }}
        run: |
          npx firebase emulators:exec --only database,auth --project demo-arcade --config ../../firebase.json '
            set -e
            (cd ../.. && node scripts/serve.mjs --emu > /tmp/serve.log 2>&1 &)
            for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && break; sleep 1; done
            node e2e-harbor.mjs "$CHROME" ./shots-harbor
          '
      - name: The results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-results-${{ matrix.job }}
          path: tests/integration/shots-harbor/
          retention-days: 7
